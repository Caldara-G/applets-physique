<script>
"use strict";
/* ======================================================================
   Assistance gravitationnelle — MP* Malherbe
   Calcul exact (à la précision numérique près) du mouvement d'une sonde soumise à l'attraction
   du Soleil (supposé fixe) et d'une planète en orbite circulaire : intégration de
   d²r/dt² = −μ☉ r/r³ − μp (r − Rp(t))/|r − Rp(t)|³ par une méthode de Runge-Kutta adaptative
   (Dormand-Prince 5(4)).
   La rencontre est construite à partir du point le plus proche de la planète (périapse) :
   on y place la sonde, puis on intègre vers le passé et vers le futur.
   Unités : km, s.
   ====================================================================== */
const PI = Math.PI, DEG = PI / 180, UA = 1.495978707e8, JOUR = 86400, MU_S = 1.32712440018e11, M_SOL = 1.989e30;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const fr = (x, d) => (Math.abs(x) < 1e-12 ? 0 : x).toFixed(d).replace(".", ",").replace("-", "−");
function frGrand(x) {           // 12 345 678 avec espaces fines
  const s = Math.round(x).toString(); return s.replace(/\B(?=(\d{3})+(?!\d))/g, " ");
}
function frSci(x, d) {
  if (x === 0) return "0";
  const e = Math.floor(Math.log10(Math.abs(x))), m = x / Math.pow(10, e);
  return fr(m, d === undefined ? 1 : d) + " × 10" + String(e).split("").map(c => "⁰¹²³⁴⁵⁶⁷⁸⁹"["0123456789".indexOf(c)] || (c === "-" ? "⁻" : c)).join("");
}
const PLANETES = {
  mercure: { nom: "Mercure", a: 0.387, mu: 22032, R: 2440, M: 3.30e23, coul: "#b8b2ab" },
  venus: { nom: "Vénus", a: 0.723, mu: 324859, R: 6052, M: 4.87e24, coul: "#f0d9a0" },
  terre: { nom: "Terre", a: 1.000, mu: 398600, R: 6371, M: 5.97e24, coul: "#5b8fd6" },
  mars: { nom: "Mars", a: 1.524, mu: 42828, R: 3390, M: 6.42e23, coul: "#d9744a" },
  jupiter: { nom: "Jupiter", a: 5.203, mu: 126686534, R: 69911, M: 1.898e27, coul: "#d8b48a" },
  saturne: { nom: "Saturne", a: 9.537, mu: 37931187, R: 58232, M: 5.68e26, coul: "#e3cf9a" },
  uranus: { nom: "Uranus", a: 19.19, mu: 5793939, R: 25362, M: 8.68e25, coul: "#9fdde6" },
  neptune: { nom: "Neptune", a: 30.07, mu: 6836529, R: 24622, M: 1.02e26, coul: "#4f73d9" },
  pluton: { nom: "Pluton", a: 39.48, mu: 871, R: 1188, M: 1.30e22, coul: "#d8c3a5" },
  comete: { nom: "comète 67P", a: 3.46, mu: 0, R: 2, M: 1e13, coul: "#cccccc" },
};
// paramètres de la simulation (réglés par l'interface)
const P = {
  vue: "systeme", planete: "jupiter", vinf: 6, rpR: 8, phi: 165, cote: "derriere", masseSonde: 800,
  coniques: false, zones: true, vecteurs: true, referentiel: "helio",
  lecture: true, vitesse: 1, t: 0,
  mission: "voyager2", mDate: 0, mVit: 1,
};
function pl() { return PLANETES[P.planete]; }
// orbite circulaire de la planète : position et vitesse à l'instant t (rencontre à t = 0, planète en (a, 0))
function orbite() {
  const p = pl(), a = p.a * UA, V = Math.sqrt(MU_S / a), w = V / a;
  return { a, V, w, T: 2 * PI / w };
}
function posPlanete(t, O) { const c = Math.cos(O.w * t), s = Math.sin(O.w * t); return [O.a * c, O.a * s, -O.V * s, O.V * c]; }
// rayons caractéristiques des zones d'influence
function zones(p) {
  p = p || pl(); const a = p.a * UA, q = p.M / M_SOL;
  return { egal: a * Math.sqrt(q), laplace: a * Math.pow(q, 0.4), hill: a * Math.cbrt(q / 3) };
}
// rotation d'un vecteur 2D
const rot = (v, a) => [v[0] * Math.cos(a) - v[1] * Math.sin(a), v[0] * Math.sin(a) + v[1] * Math.cos(a)];
const norme = v => Math.hypot(v[0], v[1]);

/* Hyperbole de survol (problème à deux corps dans le référentiel de la planète) :
   e = 1 + rp v∞²/μ, sin(δ/2) = 1/e, vitesse au périapse vp = √(v∞² + 2μ/rp). */
function survol() {
  const p = pl(), O = orbite(), mu = p.mu, rp = P.rpR * p.R, v = P.vinf;
  const e = 1 + rp * v * v / mu, delta = 2 * Math.asin(1 / e), vp = Math.sqrt(v * v + 2 * mu / rp);
  const Vh = [0, O.V];                                    // vitesse de la planète à t = 0
  const uin = rot([0, 1], P.phi * DEG);                    // direction de v∞ à l'arrivée (φ mesuré depuis V_planète)
  // deux sens de contournement possibles : on choisit celui qui correspond au côté demandé
  const cas = [1, -1].map(s => {
    const uout = rot(uin, s * delta), vpd = rot(uin, s * delta / 2), rpd = rot(vpd, -s * PI / 2);
    const vin = [Vh[0] + v * uin[0], Vh[1] + v * uin[1]], vout = [Vh[0] + v * uout[0], Vh[1] + v * uout[1]];
    return { s, uout, vpd, rpd, gain: norme(vout) - norme(vin), derriere: rpd[1] < 0 };
  });
  // côté de passage : derrière la planète si le périapse est en arrière d'elle (rp·V < 0).
  // Le gain de vitesse héliocentrique vaut alors v_après² − v_avant² = 2 V·Δv > 0 (Δv dirigé vers la planète au périapse).
  // Pour certaines directions d'arrivée, les deux contournements passent du même côté : on prend alors celui qui
  // donne le plus grand gain (derrière) ou la plus grande perte (devant), et on le signale.
  const voulu = P.cote === "derriere", ok = cas.filter(k => k.derriere === voulu);
  let c, force = false;
  if (ok.length === 1) c = ok[0];
  else if (ok.length === 2) c = voulu ? (cas[0].gain >= cas[1].gain ? cas[0] : cas[1]) : (cas[0].gain < cas[1].gain ? cas[0] : cas[1]);
  else { force = true; c = voulu ? (cas[0].gain >= cas[1].gain ? cas[0] : cas[1]) : (cas[0].gain < cas[1].gain ? cas[0] : cas[1]); }
  const vin = [Vh[0] + v * uin[0], Vh[1] + v * uin[1]], vout = [Vh[0] + v * c.uout[0], Vh[1] + v * c.uout[1]];
  return { rp, e, delta, vp, uin, uout: c.uout, s: c.s, rpd: c.rpd, vpd: c.vpd, vin, vout, Vh, dv: 2 * v * Math.sin(delta / 2), O, mu, force, derriere: c.derriere };
}

// ---------------------------------------------------------------- intégration (Dormand-Prince 5(4))
const DP = {
  c: [0, 1 / 5, 3 / 10, 4 / 5, 8 / 9, 1, 1],
  a: [[], [1 / 5], [3 / 40, 9 / 40], [44 / 45, -56 / 15, 32 / 9], [19372 / 6561, -25360 / 2187, 64448 / 6561, -212 / 729],
    [9017 / 3168, -355 / 33, 46732 / 5247, 49 / 176, -5103 / 18656], [35 / 384, 0, 500 / 1113, 125 / 192, -2187 / 6784, 11 / 84]],
  b: [35 / 384, 0, 500 / 1113, 125 / 192, -2187 / 6784, 11 / 84, 0],
  e: [71 / 57600, 0, -71 / 16695, 71 / 1920, -17253 / 339200, 22 / 525, -1 / 40],
};
function deriv(t, y, O, mu) {
  const [x, yy, vx, vy] = y, r3 = Math.pow(x * x + yy * yy, 1.5);
  const Pp = posPlanete(t, O), dx = x - Pp[0], dy = yy - Pp[1], d3 = Math.pow(dx * dx + dy * dy, 1.5);
  return [vx, vy, -MU_S * x / r3 - mu * dx / d3, -MU_S * yy / r3 - mu * dy / d3];
}
function integrer(y0, t0, t1, O, mu, Rp) {
  const dir = Math.sign(t1 - t0), ts = [t0], ys = [y0.slice()];
  let t = t0, y = y0.slice(), h = dir * 10, n = 0;
  while (dir * (t1 - t) > 0 && n < 200000) {
    if (dir * (t + h - t1) > 0) h = t1 - t;
    const k = [];
    for (let i = 0; i < 7; i++) {
      const yi = y.map((v, j) => { let s = v; for (let m = 0; m < i; m++) s += h * DP.a[i][m] * k[m][j]; return s; });
      k.push(deriv(t + DP.c[i] * h, yi, O, mu));
    }
    const yn = y.map((v, j) => { let s = v; for (let i = 0; i < 7; i++) s += h * DP.b[i] * k[i][j]; return s; });
    let err = 0;
    for (let j = 0; j < 4; j++) {
      let ej = 0; for (let i = 0; i < 7; i++) ej += h * DP.e[i] * k[i][j];
      err = Math.max(err, Math.abs(ej) / (j < 2 ? 1e-3 : 1e-9));
    }
    if (err <= 1 || Math.abs(h) < 1e-3) {
      t += h; y = yn; ts.push(t); ys.push(y.slice()); n++;
      // collision avec la planète
      const Pp = posPlanete(t, O); if (Math.hypot(y[0] - Pp[0], y[1] - Pp[1]) < Rp * 0.999) break;
    }
    h *= clamp(0.9 * Math.pow(Math.max(err, 1e-12), -0.2), 0.2, 5);
  }
  return { ts, ys };
}
/* Trajectoire complète : du périapse vers le passé puis vers le futur.
   Renvoie des tableaux triés en temps : t, x, y, vx, vy. */
let TRAJ = null;
function calculer() {
  const S = survol(), p = pl(), O = S.O;
  const Pp = posPlanete(0, O);
  const y0 = [Pp[0] + S.rp * S.rpd[0], Pp[1] + S.rp * S.rpd[1], Pp[2] + S.vp * S.vpd[0], Pp[3] + S.vp * S.vpd[1]];
  const Z = zones();
  const Tm = Math.max(0.12 * O.T, 6 * Z.laplace / P.vinf);
  const av = integrer(y0, 0, -Tm, O, S.mu, p.R), ap = integrer(y0, 0, Tm, O, S.mu, p.R);
  const n = av.ts.length + ap.ts.length - 1, T = new Float64Array(n), X = new Float64Array(n), Y = new Float64Array(n), VX = new Float64Array(n), VY = new Float64Array(n);
  let k = 0;
  for (let i = av.ts.length - 1; i >= 1; i--, k++) { T[k] = av.ts[i]; [X[k], Y[k], VX[k], VY[k]] = av.ys[i]; }
  for (let i = 0; i < ap.ts.length; i++, k++) { T[k] = ap.ts[i]; [X[k], Y[k], VX[k], VY[k]] = ap.ys[i]; }
  TRAJ = { T, X, Y, VX, VY, n, S, O, Tm, t0: T[0], t1: T[n - 1], Z };
  // grandeurs à l'entrée et à la sortie de la sphère d'influence (calcul exact)
  TRAJ.entree = null; TRAJ.sortie = null;
  for (let i = 0; i < n; i++) {
    const q = posPlanete(T[i], O), d = Math.hypot(X[i] - q[0], Y[i] - q[1]);
    if (d < Z.laplace && !TRAJ.entree) TRAJ.entree = i;
    if (d < Z.laplace) TRAJ.sortie = i;
  }
  // coniques raccordées : arcs képlériens autour du Soleil seul, raccordés à t = 0 au centre de la planète
  TRAJ.pc = { av: kepler2D([Pp[0], Pp[1], S.vin[0], S.vin[1]], -Tm, 300), ap: kepler2D([Pp[0], Pp[1], S.vout[0], S.vout[1]], Tm, 300) };
  return TRAJ;
}
// état interpolé (Hermite cubique) à l'instant t
function etat(t) {
  const R = TRAJ; t = clamp(t, R.t0, R.t1);
  let lo = 0, hi = R.n - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (R.T[m] <= t) lo = m; else hi = m; }
  const h = R.T[hi] - R.T[lo] || 1, u = (t - R.T[lo]) / h;
  const h00 = 2 * u * u * u - 3 * u * u + 1, h10 = u * u * u - 2 * u * u + u, h01 = -2 * u * u * u + 3 * u * u, h11 = u * u * u - u * u;
  const x = h00 * R.X[lo] + h10 * h * R.VX[lo] + h01 * R.X[hi] + h11 * h * R.VX[hi];
  const y = h00 * R.Y[lo] + h10 * h * R.VY[lo] + h01 * R.Y[hi] + h11 * h * R.VY[hi];
  const vx = R.VX[lo] + (R.VX[hi] - R.VX[lo]) * u, vy = R.VY[lo] + (R.VY[hi] - R.VY[lo]) * u;
  return [x, y, vx, vy];
}
// propagation képlérienne (Soleil seul) par petits pas RK4, pour les coniques raccordées
function kepler2D(y0, duree, n) {
  const pts = [], dt = duree / n / 20; let y = y0.slice(), t = 0;
  const f = y => { const r3 = Math.pow(y[0] * y[0] + y[1] * y[1], 1.5); return [y[2], y[3], -MU_S * y[0] / r3, -MU_S * y[1] / r3]; };
  pts.push([0, y[0], y[1]]);
  for (let i = 0; i < n * 20; i++) {
    const k1 = f(y), k2 = f(y.map((v, j) => v + dt / 2 * k1[j])), k3 = f(y.map((v, j) => v + dt / 2 * k2[j])), k4 = f(y.map((v, j) => v + dt * k3[j]));
    y = y.map((v, j) => v + dt / 6 * (k1[j] + 2 * k2[j] + 2 * k3[j] + k4[j])); t += dt;
    if ((i + 1) % 20 === 0) pts.push([t, y[0], y[1]]);
  }
  return pts;
}
// énergies massiques (J/kg = m²/s² ; ici en km²/s²)
function energies(t) {
  const [x, y, vx, vy] = etat(t), q = posPlanete(t, TRAJ.O), p = pl();
  const r = Math.hypot(x, y), dx = x - q[0], dy = y - q[1], d = Math.hypot(dx, dy), wx = vx - q[2], wy = vy - q[3];
  return { v: Math.hypot(vx, vy), vr: Math.hypot(wx, wy), d, r,
    Eh: (vx * vx + vy * vy) / 2 - MU_S / r, Ep: (wx * wx + wy * wy) / 2 - p.mu / d };
}

function pleinEcran() { if (document.fullscreenElement) document.exitFullscreen(); else if (zone.requestFullscreen) zone.requestFullscreen(); }

// ====================================================================== visite guidée
const BASE = { planete: "jupiter", vinf: 6, rpR: 8, phi: 165, cote: "derriere", coniques: false, zones: true, vecteurs: true, referentiel: "helio" };
const tFen = () => { const L = echelleSurvol(); return Math.min(1.1 * L / P.vinf, TRAJ.t1); };     // temps pour traverser la vue rapprochée
const ETAPES = [
  { t: "Une sonde frôle Jupiter", vue: "systeme", r: {}, a: u => { P.t = TRAJ.t0 + (TRAJ.t1 - TRAJ.t0) * u; }, d: 12,
    x: "Une sonde, sans moteur allumé, passe à proximité de Jupiter. La couleur de sa trajectoire indique sa vitesse par rapport au Soleil: elle arrive à environ <b>7 km/s</b> et repart à plus de <b>15 km/s</b>. Pourtant la gravitation est une force conservative… Comment est-ce possible?" },
  { t: "Deux référentiels pour un même mouvement", vue: "deux", r: {}, a: u => { const T = tFen(); P.t = -T + 2 * T * u; }, d: 14,
    x: "À gauche, le référentiel <b>héliocentrique</b>: Jupiter se déplace à 13 km/s et la vitesse ‖v‖ de la sonde change nettement. À droite, le référentiel <b>de Jupiter</b> (en translation par rapport au précédent): la trajectoire est une hyperbole symétrique et ‖v′‖ reprend exactement sa valeur initiale. Le survol a seulement fait <b>tourner</b> la vitesse relative." },
  { t: "L'énergie se conserve… dans le référentiel de la planète", vue: "graphes", r: {}, a: u => { const T = cacheG.tw || tFen(); P.t = -T + 2 * T * u; }, d: 12,
    x: "Dans le référentiel de Jupiter, la sonde n'est soumise (pratiquement) qu'à la force de Jupiter, conservative et indépendante du temps: son énergie mécanique <b>E′ = v′²/2 − 𝒢M/d</b> est constante. Dans le référentiel du Soleil, Jupiter bouge: la force qu'elle exerce dépend du temps et l'énergie de la sonde <b>change</b> pendant le survol." },
  { t: "Composition des vitesses", vue: "vitesses", r: {}, a: u => { const T = tFen(); P.t = -T + 2 * T * u; }, d: 12,
    x: "Le référentiel de Jupiter est en translation: <b>v = V + v′</b>. Loin de la planète, v′ a pour norme v∞: son extrémité est sur le cercle. Le survol fait tourner v′ de l'angle de déviation <b>δ</b>. Comme on ajoute toujours le même V, la flèche v, elle, s'allonge: la sonde est plus rapide dans le référentiel du Soleil." },
  { t: "Plus on passe près, plus la déviation est forte", vue: "vitesses", r: { rpR: 40 }, a: u => { P.rpR = Math.pow(10, Math.log10(40) + (Math.log10(1.3) - Math.log10(40)) * u); recalc(); P.t = tFen(); }, d: 12,
    x: "L'hyperbole a pour excentricité <b>e = 1 + r<sub>p</sub>v∞²/𝒢M</b> et la déviation vérifie <b>sin(δ/2) = 1/e</b>. En rapprochant le périapse de la planète, δ augmente, et avec lui ‖Δv‖ = 2 v∞ sin(δ/2) (au plus 2 v∞)." },
  { t: "Passer devant la planète: freiner", vue: "deux", r: { cote: "devant", phi: 40 }, a: u => { const T = tFen(); P.t = -T + 2 * T * u; }, d: 14,
    x: "Cette fois, la sonde va plus vite que Jupiter et la rattrape: elle passe <b>devant</b> la planète, qui la retient. v′ tourne en s'éloignant de V: la sonde <b>perd</b> de la vitesse dans le référentiel du Soleil (v<sub>après</sub>² − v<sub>avant</sub>² = 2 V·Δv < 0). C'est ainsi qu'on freine les sondes qui plongent vers le Soleil (BepiColombo, Parker Solar Probe)." },
  { t: "Une analogie: la balle et la raquette", vue: "vitesses", r: {}, a: u => { P.t = TRAJ.t1; }, d: 10,
    x: "Encart en bas à gauche: une balle rebondit sur une raquette qui avance à U. Dans le référentiel de la raquette, la balle repart à la même vitesse (choc élastique). Dans le référentiel du sol, elle repart à v + 2U: elle a gagné 2U. Le survol est un « rebond » gravitationnel sur une planète en mouvement (ici sans contact, et avec une déviation δ au lieu d'un demi-tour)." },
  { t: "D'où vient l'énergie gagnée?", vue: "vitesses", r: {}, a: u => { P.t = TRAJ.t1; }, d: 10,
    x: "La quantité de mouvement du système {sonde + Jupiter} se conserve: Jupiter subit une variation de vitesse <b>(m/M) Δv</b>, de l'ordre de 10⁻²¹ m/s (panneau de droite). L'énergie gagnée par la sonde est prise à l'énergie orbitale de Jupiter, de façon totalement imperceptible." },
  { t: "La sphère d'influence", vue: "zones", r: {}, a: u => { P.t = -tFen() + 2 * tFen() * u; }, d: 12,
    x: "Qui l'emporte, la planète ou le Soleil ? Les couleurs donnent le rapport des deux attractions. On définit la <b>sphère d'influence</b> de rayon a(m/M☉)<sup>2/5</sup>: à l'intérieur, on décrit le mouvement dans le référentiel de la planète en traitant le Soleil comme une perturbation. Pour Jupiter: 48 millions de km." },
  { t: "Les coniques raccordées", vue: "zones", r: { coniques: true }, a: u => { P.t = -tFen() + 2 * tFen() * u; }, d: 11,
    x: "Approximation des <b>coniques raccordées</b>: dans la sphère d'influence, on ne garde que la planète (hyperbole, en pointillés jaunes); en dehors, que le Soleil (ellipse ou hyperbole autour du Soleil). Le calcul exact (trait coloré) en diffère surtout près du bord de la sphère d'influence." },
  { t: "La Terre et Jupiter ne se valent pas", vue: "zones", r: { planete: "terre", vinf: 6, rpR: 1.1 }, a: u => { P.t = -tFen() + 2 * tFen() * u; }, d: 11,
    x: "Pour la Terre, la sphère d'influence ne mesure que 925 000 km (environ 145 rayons terrestres). Pour dévier fortement la sonde, il faut passer à quelques centaines de km de la surface. Jupiter, 318 fois plus massive, dévie fortement la sonde même à des millions de km." },
  { t: "Le gain dépend de la direction d'arrivée", vue: "vitesses", r: { rpR: 6 }, a: u => { P.phi = Math.round(360 * u) % 360; recalc(); P.t = TRAJ ? TRAJ.t1 : 0; }, d: 14,
    x: "On fait varier la direction d'arrivée de la sonde par rapport au mouvement de Jupiter. Le gain de vitesse héliocentrique est maximal quand v′ tourne de façon à se rapprocher au mieux de V (dans le panneau, gain ou perte en km/s). Les missions sont calculées pour arriver dans la bonne direction." },
  { t: "Pour aller plus loin: le référentiel tournant", vue: "systeme", r: { referentiel: "tournant" }, a: u => { P.t = TRAJ.t0 + (TRAJ.t1 - TRAJ.t0) * u; }, d: 12,
    x: "Dans un référentiel qui tourne avec Jupiter autour du Soleil, Jupiter est immobile. Ce référentiel n'est pas galiléen (forces d'inertie d'entraînement et de Coriolis), et la trajectoire y prend une forme surprenante. C'est dans ce référentiel qu'apparaissent les points de Lagrange." },
  { t: "Voyager 2: le grand tour", vue: "missions", r: { mission: "voyager2" }, a: u => { chargerMission(); const p = MS.pts; MS.jd = p[0][0] + (p[p.length - 1][0] - p[0][0]) * u; }, d: 16,
    x: "Lancée en 1977, Voyager 2 a profité d'un alignement rare des quatre planètes géantes. Chaque survol (Jupiter, Saturne, Uranus, Neptune) relance sa vitesse héliocentrique: voir les sauts du graphique du bas. Elle quitte aujourd'hui le système solaire." },
  { t: "Cassini: Vénus, Vénus, Terre, Jupiter", vue: "missions", r: { mission: "cassini" }, a: u => { chargerMission(); const p = MS.pts; MS.jd = p[0][0] + (p[p.length - 1][0] - p[0][0]) * u; }, d: 16,
    x: "Trop lourde pour un lancement direct vers Saturne, Cassini a d'abord tourné autour du Soleil pour survoler deux fois Vénus, puis la Terre et Jupiter. Quatre assistances gravitationnelles pour atteindre Saturne en 2004." },
  { t: "BepiColombo: freiner pour atteindre Mercure", vue: "missions", r: { mission: "bepicolombo" }, a: u => { chargerMission(); const p = MS.pts; MS.jd = p[0][0] + (p[p.length - 1][0] - p[0][0]) * u; }, d: 20,
    x: "Pour se mettre en orbite autour de Mercure, il faut <b>perdre</b> de la vitesse: en tombant vers le Soleil, la sonde accélérerait trop. Neuf survols (Terre, deux fois Vénus, six fois Mercure), aidés par des moteurs ioniques, ont peu à peu resserré l'orbite de BepiColombo sur celle de Mercure. Arrivée le 21 novembre 2026." },
  { t: "Parker Solar Probe: plonger vers le Soleil", vue: "missions", r: { mission: "parker" }, a: u => { chargerMission(); const p = MS.pts; MS.jd = p[0][0] + (p[p.length - 1][0] - p[0][0]) * u; }, d: 18,
    x: "Sept passages devant Vénus, chacun un freinage: le périhélie de la sonde descend de 0,17 UA à 0,046 UA, moins de 7 millions de km du Soleil. Au plus près, la sonde file à près de 190 km/s, l'objet le plus rapide jamais construit." },
];
const vBox = document.getElementById("visite"), vTitre = document.getElementById("vTitre"), vCorps = document.getElementById("vCorps"), vNum = document.getElementById("vNum"), vProg = document.getElementById("vProg");
let VIS = null;
function visite(i) {
  if (i < 0 || i >= ETAPES.length) { finVisite(); return; }
  const e = ETAPES[i];
  Object.assign(P, BASE, e.r);
  if (e.r.mission) { MS.cle = ""; }
  calculer(); aRecalculer = false; cacheG.cle = "";
  VIS = { i, t: 0, auto: VIS ? VIS.auto : false };
  P.lecture = false; majLecture();
  if (e.a) e.a(0);
  if (aRecalculer) { calculer(); aRecalculer = false; }
  vBox.style.display = "block"; vTitre.textContent = (i + 1) + ". " + e.t; vCorps.innerHTML = e.x; vNum.textContent = `étape ${i + 1} sur ${ETAPES.length}`;
  document.getElementById("vPrec").disabled = i === 0;
  document.getElementById("vTout").classList.toggle("actif", VIS.auto);
  choisirVue(e.vue); majControles(); if (e.vue === "missions") majTexteMission();
  const haut = e.vue === "missions" || e.vue === "vitesses";
  vBox.style.top = haut ? "12px" : "auto"; vBox.style.bottom = haut ? "auto" : "12px";
}
function finVisite() { VIS = null; vBox.style.display = "none"; vProg.style.width = "0"; P.lecture = true; majLecture(); }
document.getElementById("vPrec").onclick = () => VIS && visite(VIS.i - 1);
document.getElementById("vSuiv").onclick = () => VIS && (VIS.i + 1 < ETAPES.length ? visite(VIS.i + 1) : finVisite());
document.getElementById("vFin").onclick = finVisite;
document.getElementById("vTout").onclick = () => { if (!VIS) return; VIS.auto = !VIS.auto; document.getElementById("vTout").classList.toggle("actif", VIS.auto); };
function avancerVisite(dt) {
  if (!VIS) return;
  const e = ETAPES[VIS.i], D = e.d || 10; VIS.t += dt;
  const u = clamp(VIS.t / D, 0, 1);
  if (e.a && VIS.t <= D + dt) { e.a(u); if (aRecalculer) { calculer(); aRecalculer = false; cacheG.cle = ""; } majControles(); }
  vProg.style.width = (100 * u) + "%";
  if (VIS.auto && VIS.t > D + 7) { if (VIS.i + 1 < ETAPES.length) visite(VIS.i + 1); else { VIS.auto = false; document.getElementById("vTout").classList.remove("actif"); } }
}

// ====================================================================== interactions
let glisse = null;
zone.addEventListener("pointerdown", e => {
  if (e.target.closest("#visite")) return;
  const r = zone.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  if (P.vue === "missions" && MS.graph && y > MS.graph.y0 - 10) {
    const g = MS.graph; MS.jd = clamp(g.J0 + (x - g.x0) / g.w * (g.J1 - g.J0), g.J0, g.J1); glisse = { graphe: true }; zone.setPointerCapture(e.pointerId); return;
  }
  glisse = { x: e.clientX, y: e.clientY }; zone.setPointerCapture(e.pointerId); cv.style.cursor = "grabbing";
});
zone.addEventListener("pointermove", e => {
  if (!glisse) return;
  if (glisse.graphe) { const r = zone.getBoundingClientRect(), g = MS.graph; MS.jd = clamp(g.J0 + (e.clientX - r.left - g.x0) / g.w * (g.J1 - g.J0), g.J0, g.J1); return; }
  const dx = e.clientX - glisse.x, dy = e.clientY - glisse.y; glisse.x = e.clientX; glisse.y = e.clientY;
  const z = VS[P.vue]; if (!z) return;
  if (P.vue === "missions") { z.px += dx; z.py += dy; return; }
  // déplacement en coordonnées monde : on garde un décalage en km
  const s = P.vue === "systeme" ? 0.42 * Math.min(W, H) / TRAJ.O.a * z.z : 1;
  if (P.vue === "systeme") { z.px -= dx / s; z.py += dy / s; }
});
const finG = () => { glisse = null; cv.style.cursor = "grab"; };
zone.addEventListener("pointerup", finG); zone.addEventListener("pointercancel", finG);
zone.addEventListener("wheel", e => {
  const z = VS[P.vue]; if (!z) return; e.preventDefault();
  z.z = clamp(z.z * Math.exp(-e.deltaY * 0.0012), 0.2, P.vue === "systeme" ? 4000 : 60);
}, { passive: false });
window.addEventListener("keydown", e => {
  if (e.target.tagName === "SELECT" || (e.target.tagName === "INPUT" && !/range|radio|checkbox/.test(e.target.type))) return;
  if (e.key === " ") { e.preventDefault(); P.lecture = !P.lecture; majLecture(); }
  else if (e.key === "r" || e.key === "R") { P.t = TRAJ.t0; if (P.vue === "missions") MS.jd = MS.pts[0][0]; }
  else if (e.key === "f" || e.key === "F") pleinEcran();
  else if (VIS && e.key === "ArrowRight") document.getElementById("vSuiv").click();
  else if (VIS && e.key === "ArrowLeft") document.getElementById("vPrec").click();
  else if (e.key === "Escape") finVisite();
});

// ====================================================================== boucle
let tPrec = performance.now();
function pasTemps(dt) {
  if (P.vue === "missions") {
    const p = MS.pts, dur = p[p.length - 1][0] - p[0][0];
    MS.jd += dt * P.mVit * dur / 40; if (MS.jd > p[p.length - 1][0]) MS.jd = p[0][0];
    return;
  }
  const R = TRAJ, E = energies(P.t), L = echelleSurvol();
  let d;
  if (P.vue === "systeme") d = (R.t1 - R.t0) / 22;
  else if (P.vue === "graphes") d = 2 * (cacheG.tw || tFen()) / 14;
  else d = Math.max(0.22 * L / Math.max(E.vr, 0.1), (R.t1 - R.t0) / 70);
  P.t += dt * P.vitesse * d;
  if (P.t > R.t1) P.t = R.t0;
}
function boucle(t) {
  const dt = Math.min((t - tPrec) / 1000, 0.1); tPrec = t;
  if (aRecalculer) { calculer(); aRecalculer = false; cacheG.cle = ""; majNoteCote(); }
  avancerVisite(dt);
  if (P.lecture && !VIS) pasTemps(dt);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (P.vue === "systeme") vueSysteme();
  else if (P.vue === "deux") vueDeux();
  else if (P.vue === "vitesses") vueVitesses(dt);
  else if (P.vue === "zones") vueZones();
  else if (P.vue === "graphes") vueGraphes();
  else vueMissions();
  if (P.vue !== "missions") curT.value = Math.round(1000 * (P.t - TRAJ.t0) / (TRAJ.t1 - TRAJ.t0));
  majHud();
  requestAnimationFrame(boucle);
}
// ---------------------------------------------------------------- démarrage
dims(); calculer(); P.t = TRAJ.t0; choisirVue("systeme"); majControles(); attente.style.display = "none";
requestAnimationFrame(boucle);
</script>
