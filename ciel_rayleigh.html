    <div class="note" style="font-style:normal;margin-bottom:4px">Diffusion de la lumière solaire par les molécules de l'air (diffusion Rayleigh), calculée longueur d'onde par longueur d'onde.</div>

<script>
"use strict";
/* ======================================================================
   Couleurs et polarisation du ciel — MP* Malherbe
   Modèle physique (identique dans le shader WebGL et dans ce calcul CPU) :
   - diffusion simple par les molécules (Rayleigh) : β_R(λ) = β_R(550 nm)·(550/λ)^n, n = 4 ;
     fonction de phase 3(1+cos²γ)/16π ; partie polarisée 3 sin²γ/16π, E ⟂ plan de diffusion ;
   - aérosols (option) : diffusion de Mie, fonction de phase de Cornette-Shanks, non polarisée ;
   - ozone (option) : absorption dans la bande de Chappuis (couche 10–40 km) ;
   - diffusion multiple (option) : terme isotrope non polarisé proportionnel à l'épaisseur optique ;
   - épaisseur optique vers le Soleil : fonction de Chapman (approximation de Schüler),
     ombre de la planète.
   Unités : km ; éclairement solaire en W·m⁻²·nm⁻¹.
   ====================================================================== */
const PI = Math.PI, DEG = PI / 180;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const fr = (x, d) => (Math.abs(x) < 1e-12 ? 0 : x).toFixed(d).replace(".", ",").replace("-", "−");

// --------------------------------------------------------------- données spectrales (pas de 10 nm, 380–720 nm)
const L10 = []; for (let l = 380; l <= 720; l += 10) L10.push(l);
// fonctions colorimétriques CIE 1931 (2°)
const CIE = [
  [0.0014, 0.0000, 0.0065], [0.0042, 0.0001, 0.0201], [0.0143, 0.0004, 0.0679], [0.0435, 0.0012, 0.2074],
  [0.1344, 0.0040, 0.6456], [0.2839, 0.0116, 1.3856], [0.3483, 0.0230, 1.7471], [0.3362, 0.0380, 1.7721],
  [0.2908, 0.0600, 1.6692], [0.1954, 0.0910, 1.2876], [0.0956, 0.1390, 0.8130], [0.0320, 0.2080, 0.4652],
  [0.0049, 0.3230, 0.2720], [0.0093, 0.5030, 0.1582], [0.0633, 0.7100, 0.0782], [0.1655, 0.8620, 0.0422],
  [0.2904, 0.9540, 0.0203], [0.4334, 0.9950, 0.0087], [0.5945, 0.9950, 0.0039], [0.7621, 0.9520, 0.0021],
  [0.9163, 0.8700, 0.0017], [1.0263, 0.7570, 0.0011], [1.0622, 0.6310, 0.0008], [1.0026, 0.5030, 0.0003],
  [0.8544, 0.3810, 0.0002], [0.6424, 0.2650, 0.0000], [0.4479, 0.1750, 0.0000], [0.2835, 0.1070, 0.0000],
  [0.1649, 0.0610, 0.0000], [0.0874, 0.0320, 0.0000], [0.0468, 0.0170, 0.0000], [0.0227, 0.0082, 0.0000],
  [0.0114, 0.0041, 0.0000], [0.0058, 0.0021, 0.0000], [0.0029, 0.0010, 0.0000]];
// éclairement solaire hors atmosphère (W·m⁻²·nm⁻¹), valeurs arrondies
const SOL10 = [1.12, 1.10, 1.68, 1.72, 1.74, 1.62, 1.83, 2.03, 2.04, 1.98, 2.03, 1.94, 1.94, 1.90, 1.84, 1.92, 1.86, 1.87,
  1.82, 1.83, 1.83, 1.75, 1.76, 1.71, 1.70, 1.64, 1.63, 1.57, 1.53, 1.52, 1.49, 1.45, 1.42, 1.40, 1.36];
// absorption de l'ozone (bande de Chappuis), coefficient au maximum de la couche, en 10⁻³ km⁻¹
const O3L = [380, 400, 440, 480, 520, 560, 600, 640, 680, 720], O3V = [0, 0.02, 0.085, 0.55, 1.3, 1.9, 2.3, 1.4, 0.65, 0.35];
function interp(xs, ys, x) {
  if (x <= xs[0]) return ys[0];
  for (let i = 1; i < xs.length; i++) if (x <= xs[i]) { const u = (x - xs[i - 1]) / (xs[i] - xs[i - 1]); return ys[i - 1] + u * (ys[i] - ys[i - 1]); }
  return ys[ys.length - 1];
}
const soleil0 = l => interp(L10, SOL10, l);
const cie = (l, k) => interp(L10, CIE.map(c => c[k]), l);
// bandes du rendu WebGL (8 longueurs d'onde)
const LB = [400, 440, 480, 520, 560, 600, 640, 680];
// XYZ → sRGB linéaire
const XYZ2RGB = [[3.2406, -1.5372, -0.4986], [-0.9689, 1.8758, 0.0415], [0.0557, -0.2040, 1.0570]];

// matrice « spectre aux longueurs d'onde lams → RGB linéaire », équilibrée pour que le Soleil hors atmosphère soit blanc
function matriceCouleur(lams) {
  // reconstruction linéaire par morceaux entre les longueurs d'onde lams, intégrée contre les fonctions CIE
  const n = lams.length, M = [[], [], []];
  for (let k = 0; k < n; k++) {
    let X = 0, Y = 0, Z = 0;
    for (let l = 380; l <= 720; l += 2) {
      let w;
      if (n === 1) w = 1;
      else if (k === 0 && l <= lams[0]) w = 1;
      else if (k === n - 1 && l >= lams[n - 1]) w = 1;
      else if (k > 0 && l >= lams[k - 1] && l <= lams[k]) w = (l - lams[k - 1]) / (lams[k] - lams[k - 1]);
      else if (k < n - 1 && l >= lams[k] && l <= lams[k + 1]) w = (lams[k + 1] - l) / (lams[k + 1] - lams[k]);
      else w = 0;
      X += w * cie(l, 0) * 2; Y += w * cie(l, 1) * 2; Z += w * cie(l, 2) * 2;
    }
    for (let c = 0; c < 3; c++) M[c][k] = XYZ2RGB[c][0] * X + XYZ2RGB[c][1] * Y + XYZ2RGB[c][2] * Z;
  }
  // équilibrage des blancs sur le spectre solaire hors atmosphère
  const E = lams.map(soleil0);
  for (let c = 0; c < 3; c++) { let s = 0; for (let k = 0; k < n; k++) s += M[c][k] * E[k]; for (let k = 0; k < n; k++) M[c][k] /= s; }
  return M;
}
const versRGB = (M, S) => [0, 1, 2].map(c => { let s = 0; for (let k = 0; k < S.length; k++) s += M[c][k] * S[k]; return s; });
const lum = rgb => 0.2126 * rgb[0] + 0.7152 * rgb[1] + 0.0722 * rgb[2];

// --------------------------------------------------------------- planètes
const PLANETES = {
  terre: { nom: "Terre", R: 6360, top: 100, Hr: 8, Hm: 1.2, bR: 0.01356, ozone: true, Esun: 1, tauA: 0.1,
    alb: () => 0.9, g: () => 0.76, ang: 1.3 },
  mars: { nom: "Mars", R: 3390, top: 100, Hr: 11.1, Hm: 11.1, bR: 2.6e-4, ozone: false, Esun: 0.43, tauA: 0.5,
    alb: l => 0.5 + 0.45 * clamp((l - 400) / 260, 0, 1), g: l => 0.82 - 0.22 * clamp((l - 400) / 280, 0, 1), ang: 0 },
  lune: { nom: "Lune", R: 1737, top: 100, Hr: 8, Hm: 1, bR: 0, ozone: false, Esun: 1, tauA: 0, alb: () => 1, g: () => 0.7, ang: 0, vide: true },
};

// paramètres physiques courants (réglés par l'interface)
const P = {
  vue: "sol", planete: "terre", hSol: 30, azSol: 200, n: 4, tauA: 0.1, ozone: true, multiple: true, nuages: false,
  alt: 0.002, fov: 70, aff: "couleurs", polOn: false, polA: 0, expoAuto: true, ev: 0, qualite: "haute",
  // caméras
  camAz: 20, camEl: 15, fishPol: true, espAz: 160, espEl: 35, espD: 3.0, espCible: "centre", espDc: 1800,
  // vue molécule
  molLum: "naturelle", molGam: 90, molLam: 450, molVit: 1,
  sonde: null,
};
function planete() { return PLANETES[P.planete]; }
// coefficients aux longueurs d'onde données (km⁻¹)
function coefs(lams) {
  const pl = planete();
  return lams.map(l => {
    const bR = pl.vide ? 0 : pl.bR * Math.pow(550 / l, P.n);
    const tau = pl.vide ? 0 : P.tauA * Math.pow(550 / l, pl.ang);
    const bMe = tau / pl.Hm, alb = pl.alb(l);
    return { bR, bM: bMe * alb, eM: bMe, bO: (pl.ozone && P.ozone) ? interp(O3L, O3V, l) * 1e-3 : 0, g: pl.g(l), E: soleil0(l) * pl.Esun };
  });
}
function dirSoleil() {
  const e = P.hSol * DEG, a = P.azSol * DEG;
  return [Math.cos(e) * Math.sin(a), Math.cos(e) * Math.cos(a), Math.sin(e)];
}
// --------------------------------------------------------------- outils vectoriels
const V3 = {
  add: (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]], sub: (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]],
  mul: (a, k) => [a[0] * k, a[1] * k, a[2] * k], dot: (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2],
  cross: (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]],
  len: a => Math.hypot(a[0], a[1], a[2]), norm: a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; },
};
function sphere(ro, rd, R) {           // intersections rayon-sphère centrée à l'origine
  const b = V3.dot(ro, rd), c = V3.dot(ro, ro) - R * R, d = b * b - c;
  if (d < 0) return null;
  const s = Math.sqrt(d); return [-b - s, -b + s];
}
// fonction de Chapman (approximation de Schüler) : épaisseur optique réduite vers l'infini
function chap(X, h, mu) {
  const c = Math.sqrt(X + h);
  if (mu >= 0) return c / (c * mu + 1) * Math.exp(-h);
  const s = Math.sqrt(Math.max(0, 1 - mu * mu)), x0 = s * (X + h), c0 = Math.sqrt(x0);
  const d = X * mu * mu / (1 + s) - h * s;
  return 2 * c0 * Math.exp(d) - c / (1 - c * mu) * Math.exp(-h);
}
function colonneO3(h) { return h < 10 ? 15 : h < 25 ? 15 - (h - 10) * (h - 10) / 30 : h < 40 ? (40 - h) * (40 - h) / 30 : 0; }
function dens(h, pl) { return [Math.exp(-h / pl.Hr), Math.exp(-h / pl.Hm), Math.max(0, 1 - Math.abs(h - 25) / 15)]; }
// épaisseurs optiques (réduites) vers le Soleil depuis p, et facteur d'ombre de la planète
function odSoleil(p, s, pl) {
  const r = V3.len(p), h = Math.max(r - pl.R, 0), mu = V3.dot(p, s) / r;
  const oR = pl.Hr * chap(pl.R / pl.Hr, h / pl.Hr, mu), oM = pl.Hm * chap(pl.R / pl.Hm, h / pl.Hm, mu);
  const rs = pl.R + 25, k = r * r / (rs * rs) * (1 - mu * mu), m = k < 1 ? Math.min(1 / Math.sqrt(1 - k), 40) : 40;
  return [oR, oM, colonneO3(h) * m];
}
function ombre(p, s, pl) {
  const t = -V3.dot(p, s); if (t < 0) return 1;
  const c = V3.add(p, V3.mul(s, t)); const d = V3.len(c) - pl.R;
  return d >= 1 ? 1 : d <= -1 ? 0 : 0.5 + 0.5 * d;
}
const phR = mu => 3 / (16 * PI) * (1 + mu * mu), phP = mu => 3 / (16 * PI) * (1 - mu * mu);
function phM(mu, g) { const g2 = g * g; return 3 * (1 - g2) * (1 + mu * mu) / (8 * PI * (2 + g2) * Math.pow(1 + g2 - 2 * g * mu, 1.5)); }

/* Rayonnement du ciel reçu par un observateur en ro, dans la direction rd (sans le disque solaire ni le sol).
   Renvoie, pour chaque longueur d'onde : I (luminance totale), Pol (partie polarisée, E ⟂ plan de diffusion),
   Ray (diffusion simple Rayleigh), Mie, Mult (diffusion multiple), ainsi que T (transmission jusqu'au bout du trajet). */
function cielCPU(ro, rd, lams, C, nv) {
  const pl = planete(), s = dirSoleil(), n = lams.length;
  const out = { I: new Array(n).fill(0), Pol: new Array(n).fill(0), Ray: new Array(n).fill(0), Mie: new Array(n).fill(0), Mult: new Array(n).fill(0), T: new Array(n).fill(1), longueur: 0 };
  if (pl.vide) return out;
  const ra = sphere(ro, rd, pl.R + pl.top); if (!ra || ra[1] <= 0) return out;
  const t0 = Math.max(ra[0], 0); let t1 = ra[1];
  const rp = sphere(ro, rd, pl.R); if (rp && rp[0] > 0) t1 = rp[0];
  const dedans = V3.len(ro) < pl.R + pl.top;
  const L = t1 - t0; out.longueur = L;
  const od = new Array(n).fill(0), Lr = new Array(n).fill(0), Lm = new Array(n).fill(0), Lms = new Array(n).fill(0);
  const tv = C.map(c => P.multiple ? c.bR * pl.Hr + 0.5 * c.bM * pl.Hm : 0);
  nv = nv || 40;
  // échantillons resserrés autour du point le plus bas du trajet
  const tm = clamp(-V3.dot(ro, rd), t0, t1), A = tm - t0, B = t1 - tm, s0 = A / Math.max(A + B, 1e-6);
  const tOf = s => s < s0 ? tm - A * (s0 - s) * (s0 - s) / (s0 * s0) : tm + B * (s - s0) * (s - s0) / Math.max((1 - s0) * (1 - s0), 1e-9);
  for (let i = 0; i < nv; i++) {
    const ta = tOf(i / nv), tb = tOf((i + 1) / nv);
    const dt = tb - ta, p = V3.add(ro, V3.mul(rd, 0.5 * (ta + tb)));
    const h = V3.len(p) - pl.R, d = dens(h, pl), os = odSoleil(p, s, pl), sh = ombre(p, s, pl);
    for (let k = 0; k < n; k++) {
      const c = C[k], ext = (c.bR * d[0] + c.eM * d[1] + c.bO * d[2]) * dt;
      const Tv = Math.exp(-(od[k] + 0.5 * ext)), Ts = Math.exp(-(c.bR * os[0] + c.eM * os[1] + c.bO * os[2])) * sh;
      const w = Tv * Ts * dt;
      Lr[k] += w * c.bR * d[0]; Lm[k] += w * c.bM * d[1];
      Lms[k] += w * (c.bR * d[0] + c.bM * d[1]) * tv[k] / (4 * PI);
      od[k] += ext;
    }
  }
  const mu = V3.dot(rd, s);

const vBox = document.getElementById("visite"), vTitre = document.getElementById("vTitre"), vCorps = document.getElementById("vCorps"), vNum = document.getElementById("vNum"), vProg = document.getElementById("vProg");
let VIS = null;            // { i, t0, auto }
function visite(i) {
  if (i < 0 || i >= ETAPES.length) { finVisite(); return; }
  const e = ETAPES[i];
  Object.assign(P, BASE, e.r);
  VIS = { i, t: 0, auto: VIS? VIS.auto : false };
  animSoleil = null; rotPol = false; bCouch.classList.remove("actif"); bRot.classList.remove("actif");
  if (e.a) e.a(0);
  MOL.traceI = []; MOL.traceD = [];
  vBox.style.display = "block"; vTitre.textContent = (i + 1) + ". " + e.t; vCorps.innerHTML = e.x; vNum.textContent = `étape ${i + 1} sur ${ETAPES.length}`;
  document.getElementById("vPrec").disabled = i === 0;
  document.getElementById("vTout").classList.toggle("actif", VIS.auto);
  choisirVue(e.vue); majControles(); demander();
}
function finVisite() { VIS = null; vBox.style.display = "none"; vProg.style.width = "0"; }
document.getElementById("vPrec").onclick = () => VIS && visite(VIS.i - 1);
document.getElementById("vSuiv").onclick = () => VIS && (VIS.i + 1 < ETAPES.length? visite(VIS.i + 1) : finVisite());
document.getElementById("vFin").onclick = finVisite;
document.getElementById("vTout").onclick = () => { if (!VIS) return; VIS.auto = !VIS.auto; document.getElementById("vTout").classList.toggle("actif", VIS.auto); if (VIS.auto && VIS.t > dureeEtape(ETAPES[VIS.i])) visite(VIS.i + 1); };
function dureeEtape(e) { return e.d || 10; }
function avancerVisite(dt) {
  if (!VIS) return;
  const e = ETAPES[VIS.i], D = dureeEtape(e);
  VIS.t += dt;
  const u = clamp(VIS.t / D, 0, 1);
  if (e.a && VIS.t <= D + dt) { e.a(u); majControles(); demander(); }
  vProg.style.width = (100 * u) + "%";
  // en mode « tout enchaîner », on laisse le temps de lire après l'animation
  if (VIS.auto && VIS.t > D + 6) { if (VIS.i + 1 < ETAPES.length) visite(VIS.i + 1); else { VIS.auto = false; document.getElementById("vTout").classList.remove("actif"); } }
}

// ====================================================================== interactions
let animSoleil = null, rotPol = false, glisse = null;
zone.addEventListener("pointerdown", e => {
  if (e.target.closest("#visite")) return;
  const r = zone.getBoundingClientRect();
  glisse = { x: e.clientX, y: e.clientY, x0: e.clientX - r.left, y0: e.clientY - r.top, bouge: false };
  zone.setPointerCapture(e.pointerId); cvGL.style.cursor = "grabbing";
});
zone.addEventListener("pointermove", e => {
  if (!glisse) return;
  const dx = e.clientX - glisse.x, dy = e.clientY - glisse.y;
  if (Math.abs(dx) + Math.abs(dy) > 3) glisse.bouge = true;
  if (!glisse.bouge) return;
  glisse.x = e.clientX; glisse.y = e.clientY;
  if (P.vue === "sol") { const k = P.fov / H; P.camAz = (P.camAz - dx * k + 360) % 360; P.camEl = clamp(P.camEl + dy * k, -30, 89); demander(); }
  else if (P.vue === "espace") { P.espAz = (P.espAz - dx * 0.3 + 360) % 360; P.espEl = clamp(P.espEl + dy * 0.3, P.espCible === "caen" ? 2 : -85, 85); demander(); }
  else if (P.vue === "molecule") { MOL.yaw += dx * 0.01; MOL.pitch = clamp(MOL.pitch + dy * 0.01, -1.3, 1.3); }
});
const finGlisse = () => {
  if (!glisse) return;
  if (!glisse.bouge && (P.vue === "sol" || P.vue === "polar")) {
    const d = dirDepuisEcran(glisse.x0, glisse.y0);
    if (d && d[2] > -0.02) { P.sonde = d; if (P.spDir !== "sonde" && P.vue === "sol") P.spDir = "sonde"; majControles(); demander(); }
  }
  glisse = null; cvGL.style.cursor = "grab";
};
zone.addEventListener("pointerup", finGlisse); zone.addEventListener("pointercancel", finGlisse);
zone.addEventListener("wheel", e => {
  if (P.vue === "sol") { P.fov = clamp(P.fov * Math.exp(e.deltaY * 0.001), 25, 120); majControles(); demander(); e.preventDefault(); }
  else if (P.vue === "espace") { if (P.espCible === "caen") P.espDc = clamp(P.espDc * Math.exp(e.deltaY * 0.0012), 200, 12000); else P.espD = clamp(1 + (P.espD - 1) * Math.exp(e.deltaY * 0.0012), 1.03, 8); demander(); e.preventDefault(); }
}, { passive: false });
window.addEventListener("keydown", e => {
  if (e.target.tagName === "SELECT" || (e.target.tagName === "INPUT" && !/range|radio|checkbox/.test(e.target.type))) return;
  if (VIS && e.key === "ArrowRight") document.getElementById("vSuiv").click();
  if (VIS && e.key === "ArrowLeft") document.getElementById("vPrec").click();
  if (e.key === "Escape") finVisite();
  if (e.key === "f" || e.key === "F") { if (document.fullscreenElement) document.exitFullscreen(); else zone.requestFullscreen && zone.requestFullscreen(); }
});

// ====================================================================== boucle principale
let tPrec = performance.now(), tRendu = 0;
function boucle(t) {
  const dt = Math.min((t - tPrec) / 1000, 0.1); tPrec = t;
  avancerVisite(dt);
  if (animSoleil) { P.hSol -= dt * 1.6; if (P.hSol <= animSoleil.a) { P.hSol = animSoleil.a; animSoleil = null; bCouch.classList.remove("actif"); } majControles(); demander(); }
  if (rotPol) { P.polA = (P.polA + dt * 30) % 180; majControles(); demander(); }
  if (P.vue === "molecule") { dessinerMolecule(dt); majHud(); }
  else if (besoin) {
    besoin = false;
    sur.clearRect(0, 0, W, H);
