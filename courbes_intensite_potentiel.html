<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Courbes intensité-potentiel — MP* Malherbe</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 13px; color: #222; background: #eef0f3;
}
#app { display: flex; height: 100vh; }
#principal { position: relative; flex: 1; display: flex; flex-direction: column; min-width: 0;
  padding: 8px; gap: 8px; }
.ligne-zones { display: flex; gap: 8px; min-height: 0; }
.zone { position: relative; flex: 1; min-height: 0; min-width: 0; background: #fff;
  border: 1px solid #d5d9df; border-radius: 6px; overflow: hidden; }
.zone canvas { position: absolute; left: 0; top: 0; touch-action: none; }
#panneau { width: 340px; flex: none; overflow-y: auto; background: #fff;
  border-left: 1px solid #d5d9df; padding: 10px 14px 20px; }
#panneau h1 { font-size: 16px; margin: 4px 0 2px; }
.retour { font-size: 12px; color: #4a6fa5; text-decoration: none; }
.retour:hover { text-decoration: underline; }
.section { margin: 8px 0; padding-bottom: 8px; border-bottom: 1px solid #eceef1; }
.section:last-child { border-bottom: none; }
.titre { font-weight: 600; margin-bottom: 4px; color: #333; }
.choix { display: flex; align-items: center; gap: 6px; padding: 1px 0; cursor: pointer;
  user-select: none; }
.choix input { margin: 0 2px 0 0; }
.choix.off { color: #aaa; cursor: default; }
.curseur { margin: 7px 0; }
.curseur .tete { display: flex; justify-content: space-between; align-items: center;
  gap: 6px; }
.curseur .valeur { display: flex; align-items: center; gap: 2px; flex: none; }
.saisie { width: 66px; text-align: right; font: inherit; padding: 1px 4px;
  border: 1px solid #c9cdd3; border-radius: 3px; }
.pm { width: 20px; height: 20px; padding: 0; border: 1px solid #c9cdd3;
  background: #f5f6f8; border-radius: 3px; cursor: pointer; line-height: 1; }
.pm:hover { background: #e6e9ee; }
input[type=range] { width: 100%; margin: 3px 0 0; accent-color: #3b6fb6; }
.boutons { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
button.b { padding: 5px 10px; border: 1px solid #b8bec8; background: #f3f4f6;
  border-radius: 4px; cursor: pointer; font: inherit; }
button.b:hover { background: #e4e7ec; }
button.b.actif { background: #dce7f7; border-color: #7f9fcf; }
.info { background: #f6f8fa; border: 1px solid #e1e4e8; border-radius: 4px;
  padding: 6px 8px; line-height: 1.5; }
.note { font-size: 11.5px; color: #666; font-style: italic; line-height: 1.4; }
.dialogue { position: fixed; inset: 0; background: rgba(0,0,0,0.3); display: none;
  align-items: center; justify-content: center; z-index: 10; }
.dialogue .boite { background: #fff; border-radius: 8px; padding: 16px 20px;
  min-width: 340px; box-shadow: 0 6px 30px rgba(0,0,0,0.25); }
.dialogue table td { padding: 3px 6px; }
.dialogue input[type=text] { width: 80px; font: inherit; padding: 2px 4px; }
.erreur { color: #c62828; }
@media (max-width: 900px) {
  #app { flex-direction: column; height: auto; }
  #principal { height: 75vh; }
  #panneau { width: 100%; border-left: none; border-top: 1px solid #d5d9df; }
}
.haut { display: flex; justify-content: space-between; align-items: center; }
.etiquette { font-size: 11.5px; font-weight: 600; color: #fff; background: #3b5f96;
  border-radius: 10px; padding: 2px 9px; letter-spacing: 0.02em; }
.filigrane { position: absolute; right: 16px; bottom: 14px; z-index: 5; pointer-events: none;
  font-size: 13px; font-weight: 700; color: #3b5f96; background: rgba(255,255,255,0.82);
  border: 1px solid rgba(59,95,150,0.35); border-radius: 12px; padding: 3px 11px; }
.etapes { display: flex; flex-direction: column; gap: 3px; margin-bottom: 4px; }
button.b.etape { text-align: left; padding: 4px 8px; }
button.b:disabled { opacity: 0.45; cursor: default; }
.explication { line-height: 1.55; }
</style>
</head>
<body>
<div id="app">
  <div id="principal">
    <div class="zone" id="z_vue" data-mt-nom="Courbes" style="flex: 1"></div>
  </div>
  <div id="panneau"></div>
</div>
<script>
"use strict";
/* ======================================================================
   Bibliothèque commune aux applets (aucune dépendance externe)
   - interface: sections, curseurs (−/+, saisie, molette), boutons radio,
     cases à cocher, boutons
   - canvas: adaptation à la taille et à la résolution de l'écran,
     repères gradués, courbes, flèches, légendes
   - 3D: projection en perspective, rotation à la souris, tri en profondeur
   ====================================================================== */

// ---------------------------------------------------------------- DOM
function el(tag, attrs, parent) {
  const e = document.createElement(tag);
  if (attrs) {
    for (const k in attrs) {
      const v = attrs[k];
      if (k === "text") e.textContent = v;
      else if (k === "html") e.innerHTML = v;
      else if (k === "class") e.className = v;
      else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v);
    }
  }
  if (parent) parent.appendChild(e);
  return e;
}

/** Nombre écrit avec une virgule décimale. */
function fmt(v, d) {
  if (v === Infinity) return "∞";
  if (v === -Infinity) return "−∞";
  if (!isFinite(v)) return "—";
  let s = v.toFixed(d);
  if (/^-0(\.0*)?$/.test(s)) s = s.slice(1);
  return s.replace(".", ",").replace("-", "−");
}

function section(parent, titre) {
  const s = el("div", { class: "section" }, parent);
  if (titre) el("div", { class: "titre", html: titre }, s);
  return s;
}

/** Curseur avec boutons −/+, saisie au clavier et molette.
    o = {label, min, max, val, pas, dec, onchange} */
function curseur(parent, o) {
  const ligne = el("div", { class: "curseur" }, parent);
  const tete = el("div", { class: "tete" }, ligne);
  el("span", { html: o.label }, tete);
  const zone = el("span", { class: "valeur" }, tete);
  const moins = el("button", { class: "pm", text: "−", title: "diminuer" }, zone);
  const saisie = el("input", { type: "text", class: "saisie" }, zone);
  const plus = el("button", { class: "pm", text: "+", title: "augmenter" }, zone);
  const r = el("input", { type: "range", min: o.min, max: o.max, step: "any" }, ligne);
  const dec = o.dec !== undefined ? o.dec
    : Math.max(0, -Math.floor(Math.log10(o.pas) + 1e-9));
  let v = o.val;
  function borne(x) {
    x = Math.min(Math.max(x, o.min), o.max);
    return +(o.min + Math.round((x - o.min) / o.pas) * o.pas).toFixed(10);
  }
  function afficher() { r.value = v; saisie.value = fmt(v, dec); }
  function regler(x, silencieux) {
    x = borne(x);
    const change = Math.abs(x - v) > 1e-12;
    v = x;
    afficher();
    if (change && !silencieux && o.onchange) o.onchange(v);
  }
  r.addEventListener("input", () => regler(parseFloat(r.value)));
  saisie.addEventListener("change", () => {
    const x = parseFloat(saisie.value.replace(",", ".").replace("−", "-"));
    if (isFinite(x)) regler(x); else afficher();
  });
  saisie.addEventListener("keydown", (e) => { if (e.key === "Enter") saisie.blur(); });
  moins.addEventListener("click", () => regler(v - o.pas));
  plus.addEventListener("click", () => regler(v + o.pas));
  r.addEventListener("keydown", (e) => {
    const sauts = { ArrowRight: 1, ArrowUp: 1, ArrowLeft: -1, ArrowDown: -1,
                    PageUp: 10, PageDown: -10 };
    if (e.key in sauts) { e.preventDefault(); regler(v + sauts[e.key] * o.pas); }
  });
  ligne.addEventListener("wheel", (e) => {
    e.preventDefault();
    regler(v + (e.deltaY < 0 ? 1 : -1) * o.pas * (e.shiftKey ? 10 : 1));
  }, { passive: false });
  afficher();
  return {
    get: () => v,
    set: (x, silencieux) => regler(x, silencieux),
    ligne,
    montrer: (b) => { ligne.style.display = b ? "" : "none"; },
  };
}

/** Groupe de boutons radio. onchange(valeur, indice). */
function radios(parent, titre, options, actif, onchange) {
  const s = section(parent, titre);
  const nom = "r" + Math.random().toString(36).slice(2);
  const items = options.map((opt, i) => {
    const lab = el("label", { class: "choix" }, s);
    const inp = el("input", { type: "radio", name: nom }, lab);
    el("span", { html: opt }, lab);
    if (i === actif) inp.checked = true;
    inp.addEventListener("change", () => {
      if (inp.checked && onchange) onchange(opt, i);
    });
    return { inp, lab };
  });
  return {
    indice: () => items.findIndex((o) => o.inp.checked),
    valeur: () => options[items.findIndex((o) => o.inp.checked)],
    set: (i, silencieux) => {
      items[i].inp.checked = true;
      if (!silencieux && onchange) onchange(options[i], i);
    },
    desactiver: (i, b) => {
      items[i].inp.disabled = b;
      items[i].lab.classList.toggle("off", b);
    },
    section: s,
  };
}

/** Cases à cocher. options = [[libellé, coché], ...]. onchange(indice, état). */
function cases(parent, titre, options, onchange) {
  const s = section(parent, titre);
  const items = options.map(([texte, coche], i) => {
    const lab = el("label", { class: "choix" }, s);
    const inp = el("input", { type: "checkbox" }, lab);
    inp.checked = coche;
    el("span", { html: texte }, lab);
    inp.addEventListener("change", () => onchange && onchange(i, inp.checked));
    return inp;
  });
  return {
    get: (i) => items[i].checked,
    set: (i, b, silencieux) => {
      items[i].checked = b;
      if (!silencieux && onchange) onchange(i, b);
    },
    section: s,
  };
}

function boutons(parent) { return el("div", { class: "boutons" }, parent); }
function bouton(parent, texte, onclick) {
  return el("button", { class: "b", html: texte, onclick }, parent);
}

/** En-tête du panneau de commandes. */
function entete(panneau, titre) {
  const haut = el("div", { class: "haut" }, panneau);
  el("a", { class: "retour", href: "animations.html", text: "← Animations" }, haut);
  el("span", { class: "etiquette", text: "MP* Malherbe" }, haut);
  // filigrane visible en permanence sur la zone de simulation
  const principal = document.getElementById("principal");
  if (principal) el("div", { class: "filigrane", text: "MP* Malherbe" }, principal);
  el("h1", { html: titre }, panneau);
}

// ---------------------------------------------------------------- canvas
/** Canvas qui remplit son conteneur et se redessine quand il change de taille. */
function canevas(conteneur, dessiner) {
  const cv = el("canvas", null, conteneur);
  const ctx = cv.getContext("2d");
  const obj = { cv, ctx, w: 1, h: 1, dessiner };
  function taille() {
    const r = conteneur.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    obj.w = Math.max(10, Math.floor(r.width));
    obj.h = Math.max(10, Math.floor(r.height));
    cv.width = Math.round(obj.w * dpr);
    cv.height = Math.round(obj.h * dpr);
    cv.style.width = obj.w + "px";
    cv.style.height = obj.h + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (obj.dessiner) obj.dessiner(obj);
  }
  obj.effacer = (fond) => {
    ctx.fillStyle = fond || "#fff";
    ctx.fillRect(0, 0, obj.w, obj.h);
  };
  new ResizeObserver(taille).observe(conteneur);
  taille();
  return obj;
}

function boucle(pas) {
  let t0 = null;
  function image(t) {
    const dt = t0 === null ? 0 : Math.min(0.1, (t - t0) / 1000);
    t0 = t;
    pas(dt);
    requestAnimationFrame(image);
  }
  requestAnimationFrame(image);
}
// ---------------------------------------------------------------- outils communs de dessin
function texteIndices(ctx, x, y, t, police, aligne) {
  const morceaux = []; let i = 0;
  while (i < t.length) {
    if (t[i] === "_") { if (t[i + 1] === "{") { const j = t.indexOf("}", i); morceaux.push([t.slice(i + 2, j), 1]); i = j + 1; }
      else { morceaux.push([t[i + 1], 1]); i += 2; } }
    else { let j = i; while (j < t.length && t[j] !== "_") j++; morceaux.push([t.slice(i, j), 0]); i = j; }
  }
  const taille = parseInt((police.match(/(\d+)px/) || [0, 14])[1]), petite = police.replace(/\d+px/, Math.round(taille * 0.7) + "px");
  let L = 0; morceaux.forEach(([m, ind]) => { ctx.font = ind ? petite : police; L += ctx.measureText(m).width; });
  let xx = aligne === "g" ? x : aligne === "d" ? x - L : x - L / 2; ctx.textAlign = "left";
  morceaux.forEach(([m, ind]) => { ctx.font = ind ? petite : police; ctx.fillText(m, xx, y + (ind ? taille * 0.3 : 0)); xx += ctx.measureText(m).width; });
}
function txt(ctx, x, y, t, coul, police, aligne) { ctx.save(); ctx.fillStyle = coul; texteIndices(ctx, x, y, t, police || "bold 14px system-ui", aligne); ctx.restore(); }
function fleche(ctx, x1, y1, x2, y2, coul, larg) {
  const a = Math.atan2(y2 - y1, x2 - x1), L = Math.hypot(x2 - x1, y2 - y1);
  if (L < 2) return;
  const t = Math.min(12, L * 0.6);
  ctx.save(); ctx.strokeStyle = coul; ctx.fillStyle = coul; ctx.lineWidth = larg || 2;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2 - 0.7 * t * Math.cos(a), y2 - 0.7 * t * Math.sin(a)); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x2, y2); ctx.lineTo(x2 - t * Math.cos(a - 0.4), y2 - t * Math.sin(a - 0.4));
  ctx.lineTo(x2 - t * Math.cos(a + 0.4), y2 - t * Math.sin(a + 0.4)); ctx.closePath(); ctx.fill(); ctx.restore();
}
function trace(ctx, pts, coul, larg, tirets) {
  if (pts.length < 2) return;
  ctx.save(); ctx.strokeStyle = coul; ctx.lineWidth = larg; ctx.setLineDash(tirets || []); ctx.beginPath();
  pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.stroke(); ctx.restore();
}
function seg(ctx, A, B, coul, larg, tirets) { trace(ctx, [A, B], coul, larg, tirets); }
function point(ctx, P, n, coul, dx, dy, r) {
  ctx.save(); ctx.fillStyle = coul; ctx.beginPath(); ctx.arc(P[0], P[1], r || 4, 0, 2 * Math.PI); ctx.fill(); ctx.restore();
  if (n) txt(ctx, P[0] + (dx || 0), P[1] + (dy || 0), n, coul, "bold 14px system-ui");
}
/** Glissière sans affichage de valeur numérique. */
function glissiere(parent, label, min, max, val, onchange) {
  const l = el("div", { class: "curseur" }, parent);
  el("div", { html: label }, l);
  const r = el("input", { type: "range", min, max, step: (max - min) / 500, value: val }, l);
  r.style.width = "100%"; r.addEventListener("input", () => onchange(parseFloat(r.value)));
  return { r, l };
}
const fr = (u, a, b) => Math.max(0, Math.min(1, (u - a) / (b - a)));
/** Interface standard des étapes. */
function interfaceEtapes(titre) {
  const panneau = document.getElementById("panneau");
  entete(panneau, titre);
  const sEt = section(panneau, "Étapes");
  const liste = el("div", { class: "etapes" }, sEt);
  const boutonsEt = ETAPES.map((e, k) => el("button", { class: "b etape", html: (k + 1) + ". " + e.titre, onclick: () => aller(k) }, liste));
  const bt = boutons(sEt);
  const bPrec = bouton(bt, "◀ Précédente", () => aller(p.etape - 1));
  bouton(bt, "⟲ Rejouer", () => aller(p.etape));
  const bSuiv = bouton(bt, "Suivante ▶", () => aller(p.etape + 1));
  const explication = el("div", { class: "info explication" }, section(panneau, "Raisonnement"));
  const maj = () => {
    boutonsEt.forEach((b, k) => b.classList.toggle("actif", k === p.etape));
    bPrec.disabled = p.etape === 0; bSuiv.disabled = p.etape === ETAPES.length - 1;
    explication.innerHTML = "<b>" + (p.etape + 1) + ". " + ETAPES[p.etape].titre + "</b><br>" + ETAPES[p.etape].texte;
  };
  return { panneau, sEt, bt, explication, maj };
}

// ====================================================================== applet
/* Courbes intensité-potentiel: systèmes rapide et lent, paliers de diffusion, mur du solvant,
   potentiel mixte et corrosion, blocage cinétique. Modèle qualitatif, sans valeurs numériques. */

const COUL = { a: "#c62828", c: "#1565c0", tot: "#111", eq: "#2e7d32", eau: "#7b8794", mix: "#7b2d8e" };
const p = { etape: 0, tau: 0, t: 0, vitesse: 1, eta: 0.18, auto: false };

const ETAPES = [
  { titre: "Conventions", texte:
    "On trace l'intensité <b>i</b> traversant une électrode de travail en fonction de son potentiel <b>E</b> (mesuré par rapport à une électrode de référence; " +
    "montage à trois électrodes).<br><span style='color:" + COUL.a + "'><b>i &gt; 0: oxydation</b></span> (l'électrode est une anode), " +
    "<span style='color:" + COUL.c + "'><b>i &lt; 0: réduction</b></span> (cathode). " +
    "L'intensité mesure la <b>vitesse</b> de la réaction électrochimique." },
  { titre: "Système rapide", texte:
    "Couple Ox/Red rapide, les deux espèces en solution: le courant s'annule au <span style='color:" + COUL.eq + "'><b>potentiel d'équilibre E<sub>eq</sub></b></span> " +
    "donné par la loi de Nernst, et devient notable dès qu'on s'en écarte.<br>Aux potentiels éloignés, le courant est limité par l'apport des réactifs par diffusion: " +
    "<b>paliers de diffusion</b>, d'intensité proportionnelle à la concentration de l'espèce qui réagit." },
  { titre: "Système lent", texte:
    "Pour un couple lent, il faut s'écarter de E<sub>eq</sub> d'une <b>surtension</b> (η<sub>a</sub> &gt; 0 en oxydation, η<sub>c</sub> &lt; 0 en réduction) pour obtenir un courant notable.<br>" +
    "Entre E<sub>eq</sub> + η<sub>c</sub> et E<sub>eq</sub> + η<sub>a</sub>, aucune réaction ne se produit à vitesse appréciable. " +
    "Les surtensions dépendent de la nature de l'électrode." },
  { titre: "Mur du solvant", texte:
    "Le solvant (l'eau) est en très grand excès: son oxydation en O<sub>2</sub> et sa réduction en H<sub>2</sub> donnent des courants qui croissent sans palier: les " +
    "<span style='color:" + COUL.eau + "'><b>murs du solvant</b></span>.<br>Ils délimitent le <b>domaine d'électroactivité</b>: seuls les couples dont la vague tombe entre les deux murs " +
    "peuvent être étudiés dans ce solvant." },
  { titre: "Potentiel mixte et corrosion", texte:
    "Un métal M plongé dans une solution acide: deux couples sur la même électrode, oxydation de M en M<sup>n+</sup> et réduction de H<sup>+</sup> en H<sub>2</sub>. " +
    "Sans circuit extérieur, le courant total est nul: le métal prend le <span style='color:" + COUL.mix + "'><b>potentiel mixte E<sub>m</sub></b></span> tel que " +
    "<b>i<sub>a</sub>(E<sub>m</sub>) = −i<sub>c</sub>(E<sub>m</sub>) = i<sub>corr</sub></b>.<br>Graphiquement: intersection de la courbe anodique avec le symétrique de la courbe cathodique." },
  { titre: "Blocage cinétique", texte:
    "Quand la surtension cathodique de H<sup>+</sup>/H<sub>2</sub> sur le métal augmente (en valeur absolue), le potentiel mixte diminue et le " +
    "<b>courant de corrosion i<sub>corr</sub> diminue</b>.<br>Une réaction thermodynamiquement favorisée peut ainsi être <b>bloquée cinétiquement</b>: " +
    "c'est la cinétique, et non la thermodynamique seule, qui décide." },
];

// ---------------------------------------------------------------- interface
const { panneau, sEt, bt, explication, maj } = interfaceEtapes("Courbes intensité-potentiel");
const sReg = section(panneau, "Réglages");
const gEta = glissiere(sReg, "Surtension (en valeur absolue) du couple lent", 0.04, 0.45, p.eta, (v) => { p.eta = v; p.auto = false; });
curseur(sReg, { label: "Vitesse de l'animation", min: 0.2, max: 2, val: 1, pas: 0.1, onchange: (v) => { p.vitesse = v; } });
function aller(k) {
  if (k < 0 || k >= ETAPES.length) return;
  p.etape = k; p.tau = 0; p.auto = k === 5; if (k !== 5) { p.eta = 0.18; gEta.r.value = p.eta; }
  maj();
}

// ---------------------------------------------------------------- modèle
const S = 0.035;                     // « raideur » des branches (potentiel réduit)
const EEQ = 0.5, ILA = 0.55, ILC = -0.45;
// recentrage pour que i(EEQ) = 0: on décale la vague
const E0R = EEQ + S * Math.log(-ILC / ILA);
function vagueRapide(E) { const x = Math.exp((E - E0R) / S); return (ILA * x + ILC) / (1 + x); }
/** Couple lent: deux branches séparées par les surtensions. */
function vagueLente(E, eta) {
  const ia = E > EEQ + eta ? ILA * (1 - Math.exp(-(E - EEQ - eta) / S)) : 0;
  const ic = E < EEQ - eta ? ILC * (1 - Math.exp((E - EEQ + eta) / S)) : 0;
  return ia + ic;
}
const EOX = 0.9, ERED = 0.1;
const murOx = (E) => E > EOX ? 0.5 * (Math.exp((E - EOX) / 0.05) - 1) : 0;
const murRed = (E) => E < ERED ? -0.5 * (Math.exp((ERED - E) / 0.05) - 1) : 0;
// corrosion: oxydation du métal (rapide, pas de palier), réduction de H+ (lente, surtension eta)
const EM = 0.25, EH = 0.75;
const iMetal = (E) => E > EM ? 0.02 * (Math.exp((E - EM) / 0.08) - 1) : 0;
const iH = (E, eta) => { const d = E - (EH - eta); return d < 0 ? -0.03 * (Math.exp(-d / 0.08) - 1) : 0; };
function potentielMixte(eta) {
  let a = EM, b = EH + 0.01;                             // i total croissant en E: dichotomie
  for (let k = 0; k < 60; k++) { const m = (a + b) / 2; if (iMetal(m) + iH(m, eta) > 0) b = m; else a = m; }
  return (a + b) / 2;
}

// ---------------------------------------------------------------- dessin
const cv = canevas(document.getElementById("z_vue"), () => {});
function dessiner() {
  const ctx = cv.ctx; cv.effacer("#fff");
  const e = p.etape, x0 = 70, x1 = cv.w - 40, ym = cv.h * 0.5, H = cv.h * 0.4;
  const X = (E) => x0 + (x1 - x0) * E, Y = (i) => ym - H * Math.max(-1.08, Math.min(1.08, i));
  ctx.save(); ctx.fillStyle = "rgba(198,40,40,0.04)"; ctx.fillRect(x0, ym - H * 1.1, x1 - x0, H * 1.1);
  ctx.fillStyle = "rgba(21,101,192,0.04)"; ctx.fillRect(x0, ym, x1 - x0, H * 1.1); ctx.restore();
  fleche(ctx, x0, ym, x1 + 20, ym, "#333", 1.5); fleche(ctx, X(0.03), ym + H * 1.1, X(0.03), ym - H * 1.15, "#333", 1.5);
  txt(ctx, x1 + 16, ym + 22, "E", "#333", "italic bold 17px 'Times New Roman', serif");
  txt(ctx, X(0.03) - 10, ym - H * 1.08, "i", "#333", "italic bold 17px 'Times New Roman', serif", "d");
  txt(ctx, X(0.05), ym - H * 1.02, "i > 0: oxydation (anode)", COUL.a, "bold 13px system-ui", "g");
  txt(ctx, X(0.05), ym + H * 1.06, "i < 0: réduction (cathode)", COUL.c, "bold 13px system-ui", "g");
  const courbe = (f, coul, larg, tirets, a, b) => {
    let pts = [];
    for (let k = 0; k <= 600; k++) {
      const E = (a || 0.04) + ((b || 1) - (a || 0.04)) * k / 600, v = f(E);
      if (Math.abs(v) > 1.06) { trace(ctx, pts, coul, larg, tirets); pts = []; continue; }
      pts.push([X(E), Y(v)]);
    }
    trace(ctx, pts, coul, larg, tirets);
  };
  const eq = (E, nom) => { seg(ctx, [X(E), ym - 8], [X(E), ym + 8], COUL.eq, 2); txt(ctx, X(E), ym + 26, nom, COUL.eq, "bold 14px system-ui"); };
  if (e === 0) {
    txt(ctx, (x0 + x1) / 2, ym - H * 0.5, "Red → Ox + n e⁻", COUL.a, "bold 18px system-ui");
    txt(ctx, (x0 + x1) / 2, ym + H * 0.5, "Ox + n e⁻ → Red", COUL.c, "bold 18px system-ui");
    return;
  }
  if (e === 1 || e === 3) {
    const u = fr(p.tau, 0, 0.8), b = 0.04 + 0.96 * u;
    if (e === 1) courbe(vagueRapide, COUL.tot, 3.2, null, 0.04, b); else courbe(vagueRapide, COUL.tot, 2.5);
    eq(EEQ, "E_{eq}");
    if (e === 1) {
      seg(ctx, [X(0.78), Y(ILA)], [X(0.98), Y(ILA)], "#999", 1, [4, 3]); seg(ctx, [X(0.04), Y(ILC)], [X(0.25), Y(ILC)], "#999", 1, [4, 3]);
      if (u > 0.95) { txt(ctx, X(0.88), Y(ILA) - 10, "palier de diffusion (∝ [Red])", "#555", "13px system-ui"); txt(ctx, X(0.16), Y(ILC) + 22, "palier de diffusion (∝ [Ox])", "#555", "13px system-ui"); }
      const Em = Math.min(b, 0.98); point(ctx, [X(Em), Y(vagueRapide(Em))], "", COUL.tot, 0, 0, 5);
    }
  }
  if (e === 2) {
    const u = fr(p.tau, 0, 0.6);
    courbe(vagueRapide, "#bbb", 1.5, [5, 4]);
    const eta = p.eta * u;
    courbe((E) => vagueLente(E, eta), COUL.tot, 3.2);
    eq(EEQ, "E_{eq}");
    if (eta > 0.03) {
      ctx.save(); ctx.fillStyle = "rgba(46,125,50,0.08)"; ctx.fillRect(X(EEQ - eta), ym - H, X(EEQ + eta) - X(EEQ - eta), 2 * H); ctx.restore();
      const yy = ym - H * 0.25;
      fleche(ctx, X(EEQ), yy, X(EEQ + eta), yy, COUL.a, 2); txt(ctx, (X(EEQ) + X(EEQ + eta)) / 2, yy - 8, "η_a", COUL.a, "bold 14px system-ui");
      fleche(ctx, X(EEQ), ym + H * 0.25, X(EEQ - eta), ym + H * 0.25, COUL.c, 2); txt(ctx, (X(EEQ) + X(EEQ - eta)) / 2, ym + H * 0.25 + 20, "η_c", COUL.c, "bold 14px system-ui");
      txt(ctx, X(EEQ), ym - H * 0.62, "pas de réaction", COUL.eq, "bold 13px system-ui");
      txt(ctx, X(EEQ), ym - H * 0.62 + 16, "à vitesse notable", COUL.eq, "bold 13px system-ui");
    }
    txt(ctx, X(0.9), Y(0.35), "système rapide", "#999", "12px system-ui");
  }
  if (e === 3) {
    const u = fr(p.tau, 0, 0.6);
    ctx.save(); ctx.globalAlpha = u; courbe(murOx, COUL.eau, 3.2, null, EOX, 1); courbe(murRed, COUL.eau, 3.2, null, 0.04, ERED); ctx.restore();
    if (u > 0.5) {
      txt(ctx, X(EOX) - 6, Y(0.75), "2 H₂O → O₂ + 4 H⁺ + 4 e⁻", COUL.eau, "bold 13px system-ui", "d");
      txt(ctx, X(ERED) + 6, Y(-0.75), "2 H⁺ + 2 e⁻ → H₂", COUL.eau, "bold 13px system-ui", "g");
      ctx.save(); ctx.fillStyle = "rgba(123,135,148,0.08)"; ctx.fillRect(X(ERED), ym - H, X(EOX) - X(ERED), 2 * H); ctx.restore();
      fleche(ctx, X(0.5), ym + H * 0.82, X(ERED), ym + H * 0.82, COUL.eau, 1.5); fleche(ctx, X(0.5), ym + H * 0.82, X(EOX), ym + H * 0.82, COUL.eau, 1.5);
      txt(ctx, X(0.5), ym + H * 0.82 - 8, "domaine d'électroactivité du solvant", COUL.eau, "bold 13px system-ui");
    }
  }
  if (e >= 4) {
    const eta = p.eta, Emix = potentielMixte(eta), ic = iMetal(Emix);
    const fa = (E) => iMetal(E), fc = (E) => iH(E, eta);
    courbe(fa, COUL.a, 3, null, EM, 1);
    courbe(fc, COUL.c, 3, null, 0.04, EH);
    courbe((E) => -fc(E), COUL.c, 1.6, [6, 4], 0.04, EH);
    eq(EM, "E_{eq}(Mⁿ⁺/M)"); eq(EH, "E_{eq}(H⁺/H₂)");
    txt(ctx, X(0.66), Y(0.9), "M → Mⁿ⁺ + n e⁻", COUL.a, "bold 13px system-ui", "g");
    txt(ctx, X(0.06), Y(-0.75), "2 H⁺ + 2 e⁻ → H₂", COUL.c, "bold 13px system-ui", "g");
    txt(ctx, X(0.06), Y(0.75), "−i_c (symétrique)", COUL.c, "12px system-ui", "g");
    if (fr(p.tau, 0, 0.5) > 0.5 || e === 5) {
      seg(ctx, [X(Emix), Y(ic)], [X(Emix), ym], COUL.mix, 1.5, [3, 3]); seg(ctx, [X(Emix), Y(ic)], [X(0.03), Y(ic)], COUL.mix, 1.5, [3, 3]);
      point(ctx, [X(Emix), Y(ic)], "", COUL.mix, 0, 0, 6);
      txt(ctx, X(Emix) - 8, ym - 10, "E_m", COUL.mix, "bold 15px system-ui", "d");
      txt(ctx, X(0.03) + 6, Y(ic) - 8, "i_{corr}", COUL.mix, "bold 14px system-ui", "g");
    }
  }
}

// ---------------------------------------------------------------- boucle
maj();
// ---- enchaînement automatique de toutes les étapes (durée de chaque étape: temps de lecture de l'explication)
const ench = { on: false, t: 0, der: null };
const bEnch = bouton(bt, "▶ Tout enchaîner", () => {
  ench.on = !ench.on;
  if (ench.on) aller(p.etape === ETAPES.length - 1 ? 0 : p.etape);
  ench.t = 0; majEnch();
});
const barreEnch = el("div", { style: "height:4px;background:#e3e8ef;border-radius:2px;margin-top:6px;display:none" }, sEt);
const jaugeEnch = el("div", { style: "height:4px;width:0;background:#3d6fb3;border-radius:2px" }, barreEnch);
function majEnch() { bEnch.innerHTML = ench.on ? "■ Arrêter" : "▶ Tout enchaîner"; barreEnch.style.display = ench.on ? "" : "none"; }
function dureeEnch() { const n = (explication.innerText || "").split(/\s+/).length; return 5 + n / 4; }
{ const allerInitial = aller; aller = (k) => { ench.t = 0; allerInitial(k); }; }
function tickEnch(ts) {
  const dt = ench.der === null ? 0 : Math.min(0.1, (ts - ench.der) / 1000); ench.der = ts;
  if (ench.on) {
    ench.t += dt; const D = dureeEnch(); jaugeEnch.style.width = Math.min(100, 100 * ench.t / D) + "%";
    if (ench.t >= D) { if (p.etape < ETAPES.length - 1) aller(p.etape + 1); else { ench.on = false; majEnch(); } }
  }
  requestAnimationFrame(tickEnch);
}
requestAnimationFrame(tickEnch);

boucle((dt) => {
  p.t += dt * p.vitesse; p.tau += dt * 0.3 * p.vitesse;
  if (p.auto && p.etape === 5) { p.eta = 0.1 + 0.32 * (0.5 - 0.5 * Math.cos(2 * Math.PI * p.tau / 2.5)); gEta.r.value = p.eta; }
  dessiner();
});

</script>
