<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Effet tunnel et paquets d'ondes — MP* Malherbe</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 13px; color: #222; background: #eef0f3;
}
#app { display: flex; height: 100vh; }
#principal { position: relative; flex: 1; display: flex; flex-direction: column; min-width: 0;
  padding: 8px; gap: 8px; }
.ligne-zones { display: flex; gap: 8px; min-height: 0; }
.zone { position: relative; flex: 1; min-height: 0; min-width: 0; background: #fff;
  border: 1px solid #d5d9df; border-radius: 6px; overflow: hidden; }
.zone canvas { position: absolute; left: 0; top: 0; touch-action: none; }
#panneau { width: 340px; flex: none; overflow-y: auto; background: #fff;
  border-left: 1px solid #d5d9df; padding: 10px 14px 20px; }
#panneau h1 { font-size: 16px; margin: 4px 0 2px; }
.retour { font-size: 12px; color: #4a6fa5; text-decoration: none; }
.retour:hover { text-decoration: underline; }
.section { margin: 8px 0; padding-bottom: 8px; border-bottom: 1px solid #eceef1; }
.section:last-child { border-bottom: none; }
.titre { font-weight: 600; margin-bottom: 4px; color: #333; }
.choix { display: flex; align-items: center; gap: 6px; padding: 1px 0; cursor: pointer;
  user-select: none; }
.choix input { margin: 0 2px 0 0; }
.choix.off { color: #aaa; cursor: default; }
.curseur { margin: 7px 0; }
.curseur .tete { display: flex; justify-content: space-between; align-items: center;
  gap: 6px; }
.curseur .valeur { display: flex; align-items: center; gap: 2px; flex: none; }
.saisie { width: 66px; text-align: right; font: inherit; padding: 1px 4px;
  border: 1px solid #c9cdd3; border-radius: 3px; }
.pm { width: 20px; height: 20px; padding: 0; border: 1px solid #c9cdd3;
  background: #f5f6f8; border-radius: 3px; cursor: pointer; line-height: 1; }
.pm:hover { background: #e6e9ee; }
input[type=range] { width: 100%; margin: 3px 0 0; accent-color: #3b6fb6; }
.boutons { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
button.b { padding: 5px 10px; border: 1px solid #b8bec8; background: #f3f4f6;
  border-radius: 4px; cursor: pointer; font: inherit; }
button.b:hover { background: #e4e7ec; }
button.b.actif { background: #dce7f7; border-color: #7f9fcf; }
.info { background: #f6f8fa; border: 1px solid #e1e4e8; border-radius: 4px;
  padding: 6px 8px; line-height: 1.5; }
.note { font-size: 11.5px; color: #666; font-style: italic; line-height: 1.4; }

  align-items: center; justify-content: center; z-index: 10; }

  #app { flex-direction: column; height: auto; }
  #principal { height: 75vh; }
  #panneau { width: 100%; border-left: none; border-top: 1px solid #d5d9df; }
}
.haut { display: flex; justify-content: space-between; align-items: center; }

  border-radius: 10px; padding: 2px 9px; letter-spacing: 0.02em; }

  font-size: 13px; font-weight: 700; color: #3b5f96; background: rgba(255,255,255,0.82);
  border: 1px solid rgba(59,95,150,0.35); border-radius: 12px; padding: 3px 11px; }
</style>
<style>
.zoom { position: absolute; left: 66px; top: 10px; display: flex; flex-direction: column; gap: 3px; z-index: 2; }
.zoom button { width: 24px; height: 22px; padding: 0; border: 1px solid #b8bec8; background: #f5f6f8;
  border-radius: 3px; cursor: pointer; font-size: 15px; line-height: 1; }
.barre { display: flex; align-items: center; gap: 8px; flex: none; }
.horloge { min-width: 90px; text-align: right; font: 14px ui-monospace, monospace; background: #fff;
  border: 1px solid #ccc; border-radius: 3px; padding: 4px 8px; }
.legende-phase { height: 12px; width: 120px; border: 1px solid #aaa;
  background: linear-gradient(to right, #f00, #ff0, #0f0, #0ff, #00f, #f0f, #f00); }
</style>

<body>
<div id="app">
  <div id="principal">
    <div class="zone" id="z_E" data-mt-nom="Potentiel" style="flex: 0.95"></div>
    <div class="zone" id="z_W" data-mt-nom="Onde"><div class="zoom" id="zw"></div></div>
    <div class="zone" id="z_P" data-mt-nom="Densité"><div class="zoom" id="zp"></div></div>
    <div class="barre" id="barre"></div>
  </div>
  <div id="panneau"></div>
</div>
<div class="dialogue" id="dialogue"><div class="boite" id="boite"></div></div>
<script>
"use strict";
/* ======================================================================
   Bibliothèque commune aux applets (aucune dépendance externe)
   - interface: sections, curseurs (−/+, saisie, molette), boutons radio,
     cases à cocher, boutons
   - canvas: adaptation à la taille et à la résolution de l'écran,
     repères gradués, courbes, flèches, légendes
   - 3D: projection en perspective, rotation à la souris, tri en profondeur
   ====================================================================== */

// ---------------------------------------------------------------- DOM
function el(tag, attrs, parent) {
  const e = document.createElement(tag);
  if (attrs) {
    for (const k in attrs) {
      const v = attrs[k];
      if (k === "text") e.textContent = v;
      else if (k === "html") e.innerHTML = v;
      else if (k === "class") e.className = v;
      else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v);
    }
  }
  if (parent) parent.appendChild(e);
  return e;
}

/** Nombre écrit avec une virgule décimale. */
function fmt(v, d) {
  if (v === Infinity) return "∞";
  if (v === -Infinity) return "−∞";
  if (!isFinite(v)) return "—";
  let s = v.toFixed(d);
  if (/^-0(\.0*)?$/.test(s)) s = s.slice(1);
  return s.replace(".", ",").replace("-", "−");
}

function section(parent, titre) {
  const s = el("div", { class: "section" }, parent);
  if (titre) el("div", { class: "titre", html: titre }, s);
  return s;
}

/** Curseur avec boutons −/+, saisie au clavier et molette.
    o = {label, min, max, val, pas, dec, onchange} */
function curseur(parent, o) {
  const ligne = el("div", { class: "curseur" }, parent);
  const tete = el("div", { class: "tete" }, ligne);
  el("span", { html: o.label }, tete);
  const zone = el("span", { class: "valeur" }, tete);
  const moins = el("button", { class: "pm", text: "−", title: "diminuer" }, zone);
  const saisie = el("input", { type: "text", class: "saisie" }, zone);
  const plus = el("button", { class: "pm", text: "+", title: "augmenter" }, zone);
  const r = el("input", { type: "range", min: o.min, max: o.max, step: "any" }, ligne);
  const dec = o.dec !== undefined ? o.dec
    : Math.max(0, -Math.floor(Math.log10(o.pas) + 1e-9));
  let v = o.val;
  function borne(x) {
    x = Math.min(Math.max(x, o.min), o.max);
    return +(o.min + Math.round((x - o.min) / o.pas) * o.pas).toFixed(10);
  }
  function afficher() { r.value = v; saisie.value = fmt(v, dec); }
  function regler(x, silencieux) {
    x = borne(x);
    const change = Math.abs(x - v) > 1e-12;
    v = x;
    afficher();
    if (change && !silencieux && o.onchange) o.onchange(v);
  }
  r.addEventListener("input", () => regler(parseFloat(r.value)));
  saisie.addEventListener("change", () => {
    const x = parseFloat(saisie.value.replace(",", ".").replace("−", "-"));
    if (isFinite(x)) regler(x); else afficher();
  });
  saisie.addEventListener("keydown", (e) => { if (e.key === "Enter") saisie.blur(); });
  moins.addEventListener("click", () => regler(v - o.pas));
  plus.addEventListener("click", () => regler(v + o.pas));
  r.addEventListener("keydown", (e) => {
    const sauts = { ArrowRight: 1, ArrowUp: 1, ArrowLeft: -1, ArrowDown: -1,
                    PageUp: 10, PageDown: -10 };
    if (e.key in sauts) { e.preventDefault(); regler(v + sauts[e.key] * o.pas); }
  });
  ligne.addEventListener("wheel", (e) => {
    e.preventDefault();
    regler(v + (e.deltaY < 0 ? 1 : -1) * o.pas * (e.shiftKey ? 10 : 1));
  }, { passive: false });
  afficher();
  return {
    get: () => v,
    set: (x, silencieux) => regler(x, silencieux),
    ligne,
    montrer: (b) => { ligne.style.display = b ? "" : "none"; },
  };
}

/** Groupe de boutons radio. onchange(valeur, indice). */
function radios(parent, titre, options, actif, onchange) {
  const s = section(parent, titre);
  const nom = "r" + Math.random().toString(36).slice(2);
  const items = options.map((opt, i) => {
    const lab = el("label", { class: "choix" }, s);
    const inp = el("input", { type: "radio", name: nom }, lab);
    el("span", { html: opt }, lab);
    if (i === actif) inp.checked = true;
    inp.addEventListener("change", () => {
      if (inp.checked && onchange) onchange(opt, i);
    });
    return { inp, lab };
  });
  return {
    indice: () => items.findIndex((o) => o.inp.checked),
    valeur: () => options[items.findIndex((o) => o.inp.checked)],
    set: (i, silencieux) => {
      items[i].inp.checked = true;
      if (!silencieux && onchange) onchange(options[i], i);
    },
    desactiver: (i, b) => {
      items[i].inp.disabled = b;
      items[i].lab.classList.toggle("off", b);
    },
    section: s,
  };
}

/** Cases à cocher. options = [[libellé, coché], ...]. onchange(indice, état). */
function cases(parent, titre, options, onchange) {
  const s = section(parent, titre);
  const items = options.map(([texte, coche], i) => {
    const lab = el("label", { class: "choix" }, s);
    const inp = el("input", { type: "checkbox" }, lab);
    inp.checked = coche;
    el("span", { html: texte }, lab);
    inp.addEventListener("change", () => onchange && onchange(i, inp.checked));
    return inp;
  });
  return {
    get: (i) => items[i].checked,
    set: (i, b, silencieux) => {
      items[i].checked = b;
      if (!silencieux && onchange) onchange(i, b);
    },
    section: s,
  };
}

function boutons(parent) { return el("div", { class: "boutons" }, parent); }
function bouton(parent, texte, onclick) {
  return el("button", { class: "b", html: texte, onclick }, parent);
}

/** En-tête du panneau de commandes. */
function entete(panneau, titre) {
  const haut = el("div", { class: "haut" }, panneau);
  el("a", { class: "retour", href: "index.html", text: "← Sommaire" }, haut);
  el("span", { class: "etiquette", text: "MP* Malherbe" }, haut);
  // filigrane visible en permanence sur la zone de simulation
  const principal = document.getElementById("principal");
  if (principal) el("div", { class: "filigrane", text: "MP* Malherbe" }, principal);
  el("h1", { html: titre }, panneau);
}

// ---------------------------------------------------------------- canvas
/** Canvas qui remplit son conteneur et se redessine quand il change de taille. */
function canevas(conteneur, dessiner) {
  const cv = el("canvas", null, conteneur);
  const ctx = cv.getContext("2d");
  const obj = { cv, ctx, w: 1, h: 1, dessiner };
  function taille() {
    const r = conteneur.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    obj.w = Math.max(10, Math.floor(r.width));
    obj.h = Math.max(10, Math.floor(r.height));
    cv.width = Math.round(obj.w * dpr);
    cv.height = Math.round(obj.h * dpr);
    cv.style.width = obj.w + "px";
    cv.style.height = obj.h + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (obj.dessiner) obj.dessiner(obj);
  }
  obj.effacer = (fond) => {
    ctx.fillStyle = fond || "#fff";
    ctx.fillRect(0, 0, obj.w, obj.h);
  };
  new ResizeObserver(taille).observe(conteneur);
  taille();
  return obj;
}

/** Graduations « rondes » entre a et b (environ n intervalles). */
function graduations(a, b, n) {
  const brut = Math.abs(b - a) / Math.max(n, 1);
  const mag = Math.pow(10, Math.floor(Math.log10(brut)));
  const r = brut / mag;
  const pas = (r < 1.5 ? 1 : r < 3 ? 2 : r < 7 ? 5 : 10) * mag;
  const dec = Math.max(0, -Math.floor(Math.log10(pas) + 1e-9));
  const vals = [];
  const lo = Math.min(a, b), hi = Math.max(a, b);
  for (let v = Math.ceil(lo / pas - 1e-9) * pas; v <= hi + pas * 1e-9; v += pas) {
    vals.push(Math.abs(v) < pas * 1e-9 ? 0 : v);
  }
  return { vals, dec, pas };
}

/** Dessine un repère gradué dans le cadre {x, y, w, h} et renvoie les
    fonctions de passage X(u), Y(v) (et inverses). */
function repere(ctx, cadre, xmin, xmax, ymin, ymax, o) {
  o = o || {};
  const { x, y, w, h } = cadre;
  const R = {
    cadre, xmin, xmax, ymin, ymax,
    X: (u) => x + (u - xmin) / (xmax - xmin) * w,
    Y: (v) => y + h - (v - ymin) / (ymax - ymin) * h,
    invX: (px) => xmin + (px - x) / w * (xmax - xmin),
    invY: (py) => ymin + (y + h - py) / h * (ymax - ymin),
  };
  ctx.save();
  ctx.fillStyle = o.fond || "#fff";
  ctx.fillRect(x, y, w, h);
  const gx = graduations(xmin, xmax, o.nx || Math.max(2, w / 85));
  const gy = graduations(ymin, ymax, o.ny || Math.max(2, h / 45));
  ctx.lineWidth = 1;
  if (o.grille !== false) {
    ctx.strokeStyle = "#e6e8eb";
    ctx.beginPath();
    for (const v of gx.vals) { const p = Math.round(R.X(v)) + 0.5; ctx.moveTo(p, y); ctx.lineTo(p, y + h); }
    for (const v of gy.vals) { const p = Math.round(R.Y(v)) + 0.5; ctx.moveTo(x, p); ctx.lineTo(x + w, p); }
    ctx.stroke();
  }
  if (o.zero && ymin < 0 && ymax > 0) {
    ctx.strokeStyle = "#999";
    ctx.beginPath(); ctx.moveTo(x, R.Y(0)); ctx.lineTo(x + w, R.Y(0)); ctx.stroke();
  }
  ctx.strokeStyle = "#666";
  ctx.strokeRect(x + 0.5, y + 0.5, w, h);
  ctx.fillStyle = "#333";
  ctx.font = "11px system-ui, sans-serif";
  if (o.etiquettesX !== false) {
    ctx.textAlign = "center"; ctx.textBaseline = "top";
    for (const v of gx.vals) ctx.fillText(fmt(v, gx.dec), R.X(v), y + h + 3);
  }
  if (o.etiquettesY !== false) {
    ctx.textAlign = "right"; ctx.textBaseline = "middle";
    for (const v of gy.vals) ctx.fillText(fmt(v, gy.dec), x - 4, R.Y(v));
  }
  ctx.font = "12px system-ui, sans-serif";
  if (o.xlabel) {
    ctx.textAlign = "center"; ctx.textBaseline = "top";
    ctx.fillText(o.xlabel, x + w / 2, y + h + 18);
  }
  if (o.ylabel) {
    ctx.save();
    ctx.translate(x - (o.decY || 38), y + h / 2);
    ctx.rotate(-Math.PI / 2);
    ctx.textAlign = "center"; ctx.textBaseline = "bottom";
    ctx.fillText(o.ylabel, 0, 0);
    ctx.restore();
  }
  if (o.titre) {
    ctx.font = "bold 12.5px system-ui, sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "bottom";
    ctx.fillText(o.titre, x + w / 2, y - 5);
  }
  ctx.restore();
  return R;
}

/** Restreint le dessin au cadre du repère. */
function clipper(ctx, R) {
  const c = R.cadre;
  ctx.beginPath();
  ctx.rect(c.x, c.y, c.w, c.h);
  ctx.clip();
}

/** Courbe y(x); les valeurs non finies interrompent le tracé. */
function courbe(ctx, R, xs, ys, couleur, lw, tirets) {
  ctx.save();
  clipper(ctx, R);
  ctx.strokeStyle = couleur;
  ctx.lineWidth = lw || 1.5;
  ctx.lineJoin = "round";
  if (tirets) ctx.setLineDash(tirets);
  ctx.beginPath();
  let leve = true;
  for (let i = 0; i < xs.length; i++) {
    const yv = ys[i];
    if (!isFinite(yv) || !isFinite(xs[i])) { leve = true; continue; }
    const px = R.X(xs[i]), py = Math.max(-1e5, Math.min(1e5, R.Y(yv)));
    if (leve) { ctx.moveTo(px, py); leve = false; } else ctx.lineTo(px, py);
  }
  ctx.stroke();
  ctx.restore();
}

/** Flèche entre deux points (coordonnées écran). */
function fleche(ctx, x0, y0, x1, y1, couleur, lw, tete) {
  const dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy);
  ctx.save();
  ctx.strokeStyle = couleur; ctx.fillStyle = couleur;
  ctx.lineWidth = lw || 2; ctx.lineCap = "round";
  if (L < 0.5) { ctx.restore(); return; }
  const t = Math.min(tete || 10, 0.45 * L);
  const ux = dx / L, uy = dy / L;
  ctx.beginPath();
  ctx.moveTo(x0, y0);
  ctx.lineTo(x1 - ux * t * 0.8, y1 - uy * t * 0.8);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x1 - ux * t - uy * t * 0.45, y1 - uy * t + ux * t * 0.45);
  ctx.lineTo(x1 - ux * t + uy * t * 0.45, y1 - uy * t - ux * t * 0.45);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

/** Légende: items = [[texte, couleur, tirets|"point"|"bande"], ...]. */
function legende(ctx, x, y, items, o) {
  o = o || {};
  ctx.save();
  ctx.font = (o.taille || 11.5) + "px system-ui, sans-serif";
  const larg = Math.max(...items.map((it) => ctx.measureText(it[0]).width)) + 36;
  const h = items.length * 17 + 8;
  if (o.droite) x -= larg;
  ctx.fillStyle = "rgba(255,255,255,0.88)";
  ctx.strokeStyle = "#ccc";
  ctx.fillRect(x, y, larg, h);
  ctx.strokeRect(x + 0.5, y + 0.5, larg, h);
  items.forEach(([texte, couleur, style], i) => {
    const yy = y + 12 + 17 * i;
    ctx.strokeStyle = couleur; ctx.fillStyle = couleur;
    ctx.lineWidth = 2;
    if (style === "point") {
      ctx.beginPath(); ctx.arc(x + 17, yy, 4, 0, 2 * Math.PI); ctx.fill();
    } else if (style === "bande") {
      ctx.globalAlpha = 0.35; ctx.fillRect(x + 6, yy - 5, 22, 10); ctx.globalAlpha = 1;
    } else {
      ctx.setLineDash(style || []);
      ctx.beginPath(); ctx.moveTo(x + 6, yy); ctx.lineTo(x + 28, yy); ctx.stroke();
      ctx.setLineDash([]);
    }
    ctx.fillStyle = "#222";
    ctx.textBaseline = "middle";
    ctx.fillText(texte, x + 33, yy);
  });
  ctx.restore();
}

function texte(ctx, s, x, y, o) {
  o = o || {};
  ctx.save();
  ctx.font = (o.gras ? "bold " : "") + (o.taille || 12) + "px system-ui, sans-serif";
  ctx.fillStyle = o.couleur || "#222";
  ctx.textAlign = o.align || "left";
  ctx.textBaseline = o.base || "alphabetic";
  ctx.fillText(s, x, y);
  ctx.restore();
}

/** Teinte HSV (h dans [0,1[) -> "rgb(...)" ; utilisée pour la phase. */
function couleurPhase(h) {
  h = ((h % 1) + 1) % 1;
  const i = Math.floor(h * 6), f = h * 6 - i;
  const q = 1 - f, t = f;
  const [r, g, b] = [[1, t, 0], [q, 1, 0], [0, 1, t], [0, q, 1], [t, 0, 1], [1, 0, q]][i % 6];
  return [Math.round(255 * r), Math.round(255 * g), Math.round(255 * b)];
}

/** Couleur RVB (0..1) associée à une longueur d'onde en nm (D. Bruton). */
function lambdaVersRGB(lam) {
  let r = 0, g = 0, b = 0;
  if (lam >= 380 && lam < 440) { r = -(lam - 440) / 60; b = 1; }
  else if (lam < 490) { g = (lam - 440) / 50; b = 1; }
  else if (lam < 510) { g = 1; b = -(lam - 510) / 20; }
  else if (lam < 580) { r = (lam - 510) / 70; g = 1; }
  else if (lam < 645) { r = 1; g = -(lam - 645) / 65; }
  else if (lam <= 780) { r = 1; }
  let f = 1;
  if (lam >= 380 && lam < 420) f = 0.3 + 0.7 * (lam - 380) / 40;
  else if (lam > 700 && lam <= 780) f = 0.3 + 0.7 * (780 - lam) / 80;
  if (lam < 380 || lam > 780) f = 0;
  return [r * f, g * f, b * f];
}

// ---------------------------------------------------------------- 3D
/** Rotation de la vue à la souris (glisser) et zoom (molette).
    v = {azim, elev, zoom} en degrés. */
function vue3D(cv, v, redessiner) {
  let prec = null;
  cv.style.cursor = "grab";
  cv.addEventListener("pointerdown", (e) => {
    prec = [e.clientX, e.clientY];
    cv.setPointerCapture(e.pointerId);
    cv.style.cursor = "grabbing";
  });
  cv.addEventListener("pointermove", (e) => {
    if (!prec) return;
    v.azim -= (e.clientX - prec[0]) * 0.4;

  const ctx = o.ctx;
  o.effacer();
  const R = repere(ctx, cadreDe(o, false), XMIN, XMAX, EMIN, EMAX,
    { ylabel: "Énergie (eV)", etiquettesX: false, nx: 20 });
  Rgraph.E = R;
  ctx.save(); clipper(ctx, R);
  if (s.forme === "paquet") {
    const [k0, V0] = k0Paquet();
    const n = 300, vals = [];
    let mx = 0;
    for (let i = 0; i < n; i++) {
      const Ev = EMIN + (EMAX - EMIN) * (i + 0.5) / n;
      const kk = Math.sqrt(Math.max(Ev - V0, 0) / C);
      const I = Ev < V0 ? 0 : Math.exp(-2 * s.sigma ** 2 * (kk - Math.abs(k0)) ** 2);
      vals.push(I); mx = Math.max(mx, I);
    }
    if (mx > 0) for (let i = 0; i < n; i++) {
      const y1 = R.Y(EMIN + (EMAX - EMIN) * i / n), y2 = R.Y(EMIN + (EMAX - EMIN) * (i + 1) / n);
      ctx.fillStyle = `rgba(26,217,26,${0.9 * vals[i] / mx})`;
      ctx.fillRect(R.cadre.x, y2, R.cadre.w, y1 - y2 + 0.6);
    }
  } else {
    ctx.strokeStyle = VERT; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(R.cadre.x, R.Y(s.E)); ctx.lineTo(R.cadre.x + R.cadre.w, R.Y(s.E)); ctx.stroke();
  }
  // potentiel en escalier
  const bords = [XMIN, ...s.xs, XMAX];
  ctx.strokeStyle = VIOLET; ctx.lineWidth = 2.5;
  ctx.beginPath();
  s.V.forEach((v, j) => {
    const xa = R.X(Math.max(bords[j], XMIN)), xb = R.X(Math.min(bords[j + 1], XMAX));
    if (j === 0) ctx.moveTo(xa, R.Y(v)); else ctx.lineTo(xa, R.Y(v));
    ctx.lineTo(xb, R.Y(v));
  });
  ctx.stroke();
  ctx.restore();
  traitsDiscontinuites(ctx, R);
  // poignées
  const poignee = (x, y, c) => texte(ctx, c, R.X(x), R.Y(y), { align: "center", base: "middle", taille: 17, gras: true });
  poignee(XMAX - 1, s.E, "↕");
  s.V.forEach((v, j) => {
    let xm = 0.5 * (Math.max(bords[j], XMIN) + Math.min(bords[j + 1], XMAX));
    poignee(xm, v, "↕");
    if (s.affValeurs) texte(ctx, fmt(v, 2), R.X(xm + 0.25), R.Y(v + 0.07), { taille: 11 });
  });
  s.xs.forEach((b, i) => poignee(b, Math.max(s.V[i], s.V[i + 1]) - 0.05, "↔"));
  if (s.affValeurs) {
    texte(ctx, fmt(s.E, 2), R.X(XMAX - 0.7), R.Y(s.E + 0.07), { taille: 11 });
    for (let j = 1; j < s.V.length - 1; j++)
      texte(ctx, fmt(s.xs[j] - s.xs[j - 1], 1) + " nm", R.X(s.xs[j - 1] + 0.1), R.Y(s.V[j] - 0.1), { taille: 11 });
  }
  legende(ctx, R.cadre.x + 6, R.cadre.y + 6, [["Énergie totale" + (s.forme === "paquet" ? " (répartition)" : ""), VERT],
    ["Énergie potentielle", VIOLET]]);
}

function dessinerOnde(o) {
  const ctx = o.ctx;
  o.effacer();
  const a = 2 / s.zoomW;
  const R = repere(ctx, cadreDe(o, false), XMIN, XMAX, -a, a,
    { ylabel: "Fonction d'onde", etiquettesX: false, nx: 20, zero: true });
  Rgraph.W = R;
  const { psi, inc, ref } = psiAffiche();
  const sep = s.forme === "plane" && s.separe && inc;
  if (s.vues.phase && !sep) {
    ctx.save(); clipper(ctx, R);
    const pas = Math.max(1, Math.floor(xd.length / R.cadre.w));
    for (let i = 0; i < xd.length - pas; i += pas) {
      const z = psi[i], m = Math.sqrt(cabs2(z));
      const [r, g, b] = couleurPhase(Math.atan2(z[1], z[0]) / (2 * Math.PI));
      ctx.fillStyle = `rgb(${r},${g},${b})`;
      const x1 = R.X(xd[i]), x2 = R.X(xd[i + pas]);
      ctx.fillRect(x1, R.Y(m), x2 - x1 + 0.7, R.Y(0) - R.Y(m));
    }
    ctx.restore();
  }
  traitsDiscontinuites(ctx, R);
  const parts = sep ? [[inc, null], [ref, [6, 4]]] : [[psi, null]];
  for (const [p, tirets] of parts) {
    if (s.vues.im) courbe(ctx, R, xd, p.map((z) => z[1]), "blue", 1.6, tirets);
    if (s.vues.re) courbe(ctx, R, xd, p.map((z) => z[0]), "red", 1.6, tirets);
    if (s.vues.mod) courbe(ctx, R, xd, p.map((z) => Math.sqrt(cabs2(z))), "black", 1.6, tirets);
  }
  if (sep) legende(ctx, R.cadre.x + R.cadre.w - 6, R.cadre.y + 6,
                   [["onde incidente", "#555"], ["onde réfléchie", "#555", [6, 4]]], { droite: true });
}

function dessinerDensite(o) {
  const ctx = o.ctx;
  o.effacer();
  const R = repere(ctx, cadreDe(o, true), XMIN, XMAX, 0, 4 / s.zoomP,
    { ylabel: "Densité de probabilité", xlabel: "Position (nm)", nx: 20 });
  Rgraph.P = R;
  traitsDiscontinuites(ctx, R);
  const { psi } = psiAffiche();
  courbe(ctx, R, xd, psi.map(cabs2), "black", 1.6);
  if (s.affRT) {
    const c = coefficients();
    texte(ctx, "R = " + (c ? fmt(c[0], 2) : "?"), R.cadre.x + 50, R.cadre.y + 26, { gras: true, taille: 15 });
    texte(ctx, "T = " + (c ? fmt(c[1], 2) : "?"), R.cadre.x + R.cadre.w - 20, R.cadre.y + 26,
          { gras: true, taille: 15, align: "right" });
  }
  if (horloge) horloge.textContent = fmt(s.t, 1) + " fs";
}

function toutDessiner() { dessinerEnergie(cvE); dessinerOnde(cvW); dessinerDensite(cvP); }

// ---------------------------------------------------------------- interface
let horloge = null;
const panneau = document.getElementById("panneau");
entete(panneau, "Effet tunnel et paquets d'ondes");
const cvE = canevas(document.getElementById("z_E"), dessinerEnergie);
const cvW = canevas(document.getElementById("z_W"), dessinerOnde);
const cvP = canevas(document.getElementById("z_P"), dessinerDensite);

// boutons de zoom
function boutonsZoom(id, cle) {
  const z = document.getElementById(id);
  el("button", { text: "+", title: "zoom avant", onclick: () => { s[cle] = Math.min(cle === "zoomW" ? 16 : 64, s[cle] * 2); toutDessiner(); } }, z);
  el("button", { text: "−", title: "zoom arrière", onclick: () => { s[cle] = Math.max(1 / 8, s[cle] / 2); toutDessiner(); } }, z);
}
boutonsZoom("zw", "zoomW"); boutonsZoom("zp", "zoomP");

// barre sous les graphes
const barre = document.getElementById("barre");
const bMesure = bouton(barre, "Faire une mesure quantique", mesurer);
el("span", { style: "flex: 1" }, barre);
horloge = el("span", { class: "horloge", text: "0,0 fs" }, barre);
bouton(barre, "Recommencer", () => { initPaquet(); toutDessiner(); });
const bPlay = bouton(barre, "Pause", () => {
  s.enMarche = !s.enMarche; bPlay.textContent = s.enMarche ? "Pause" : "Lecture";
});
bouton(barre, "Pas ▸", () => { if (!s.enMarche) { avancer(10 * DT); toutDessiner(); } });

// panneau de droite
const rPot = radios(panneau, "Potentiel", NOMS_POT, 2, (_, i) => {
  s.pot = CLES_POT[i]; s.xs = [...DEFAUTS[s.pot].xs]; s.V = [...DEFAUTS[s.pot].V];
  recalculerPotentiel(); initPaquet(); toutDessiner();
});
const cOpt = cases(panneau, "Affichage", [["valeurs d'énergie", false], ["coefficients R et T", false]],
  (i, b) => { if (i === 0) s.affValeurs = b; else s.affRT = b; toutDessiner(); });
const cVue = cases(panneau, "Vue de la fonction d'onde",
  [["<span style='color:red'>partie réelle</span>", true], ["<span style='color:blue'>partie imaginaire</span>", false],
   ["module", false], ["phase <span class='legende-phase' style='display:inline-block;vertical-align:middle'></span> (0 → 2π)", false]],
  (i, b) => { s.vues[["re", "im", "mod", "phase"][i]] = b; toutDessiner(); });
const rSens = radios(panneau, "Sens de l'onde incidente", ["→ vers la droite", "← vers la gauche"], 0,
  (_, i) => { s.sens = i === 0 ? 1 : -1; changementEnergie(); });
const rForme = radios(panneau, "Forme de la fonction d'onde", ["paquet d'ondes", "onde plane"], 0,
  (_, i) => { s.forme = i === 0 ? "paquet" : "plane"; visibilites(); changementEnergie(); });
const rSep = radios(panneau, "Ondes incidente et réfléchie", ["somme", "séparées"], 0,
  (_, i) => { s.separe = i === 1; toutDessiner(); });
const sPaq = section(panneau, "Propriétés du paquet");
const cSig = curseur(sPaq, { label: "largeur initiale σ (nm)", min: 0.1, max: 4, val: s.sigma, pas: 0.1,
  onchange: (v) => { s.sigma = v; changementEnergie(); } });
const cX0 = curseur(sPaq, { label: "position initiale (nm)", min: XMIN, max: XMAX, val: s.x0, pas: 0.1,
  onchange: (v) => { s.x0 = v; changementEnergie(); } });
const bb = boutons(panneau);
bouton(bb, "Configurer l'énergie…", ouvrirConfig);
bouton(bb, "Tout réinitialiser", toutReinitialiser);
el("p", { class: "note", html:
  "Dans le graphe d'énergie, faire glisser la ligne d'énergie totale et les niveaux du potentiel (↕), " +
  "ou les bords des barrières (↔). Le paquet sort de la fenêtre sans réflexion sur les bords " +
  "(zones absorbantes). R et T: coefficients de l'onde plane d'énergie E (énergie moyenne du paquet)." },
  panneau);

function visibilites() {
  const paquet = s.forme === "paquet";
  sPaq.style.display = paquet ? "" : "none";
  bMesure.style.visibility = paquet ? "" : "hidden";
  rSep.section.style.display = paquet ? "none" : "";
}
function changementEnergie() { recalculerOndePlane(); initPaquet(); toutDessiner(); }

function mesurer() {
  if (s.forme !== "paquet") return;
  let tot = 0;
  const p = [];
  for (let i = I0; i < I1; i++) { const v = psiR[i] ** 2 + psiI[i] ** 2; p.push(v); tot += v; }
  if (tot * DX < 1e-4) return;
  let u = Math.random() * tot, j = 0;
  while (j < p.length - 1 && u > p[j]) { u -= p[j]; j++; }
  const xm = xd[j], sm = SIGMA_MESURE, A = Math.pow(2 * Math.PI * sm * sm, -0.25);
  for (let i = 0; i < N; i++) { psiR[i] = A * Math.exp(-((xg[i] - xm) ** 2) / (4 * sm * sm)); psiI[i] = 0; }
  s.mesure = true;
  toutDessiner();
}

function toutReinitialiser() {
  etatDefaut();
  rPot.set(CLES_POT.indexOf(s.pot), true); rSens.set(0, true); rForme.set(0, true); rSep.set(0, true);
  cOpt.set(0, false, true); cOpt.set(1, false, true);
  ["re", "im", "mod", "phase"].forEach((k, i) => cVue.set(i, s.vues[k], true));
  cSig.set(s.sigma, true); cX0.set(s.x0, true);
  bPlay.textContent = "Pause";
  visibilites(); recalculerPotentiel(); initPaquet(); toutDessiner();
}

// ---- souris: poignées du graphe d'énergie
let prise = null;
function poigneeProche(e) {
  const R = Rgraph.E, r = cvE.cv.getBoundingClientRect();
  const px = e.clientX - r.left, py = e.clientY - r.top;
  if (!R || px < R.cadre.x || px > R.cadre.x + R.cadre.w || py < R.cadre.y || py > R.cadre.y + R.cadre.h) return null;
  let meilleur = null, dmin = 8;
  s.xs.forEach((b, i) => { const d = Math.abs(px - R.X(b)); if (d < dmin) { meilleur = ["x", i]; dmin = d; } });
  const dE = Math.abs(py - R.Y(s.E)); if (dE < dmin) { meilleur = ["E", 0]; dmin = dE; }
  const bords = [XMIN, ...s.xs, XMAX], xv = R.invX(px);
  s.V.forEach((v, j) => {
    if (bords[j] <= xv && xv <= bords[j + 1]) { const d = Math.abs(py - R.Y(v)); if (d < dmin) { meilleur = ["V", j]; dmin = d; } }
  });
  return meilleur;
}
cvE.cv.addEventListener("pointerdown", (e) => { prise = poigneeProche(e); if (prise) cvE.cv.setPointerCapture(e.pointerId); });
cvE.cv.addEventListener("pointermove", (e) => {
  if (!prise) {
    const p = poigneeProche(e);
    cvE.cv.style.cursor = !p ? "default" : p[0] === "x" ? "ew-resize" : "ns-resize";
    return;
  }
  const R = Rgraph.E, r = cvE.cv.getBoundingClientRect();
  const x = R.invX(e.clientX - r.left), y = R.invY(e.clientY - r.top);
  const [quoi, i] = prise;
  const arr = (v, d) => Math.round(v * d) / d;
  if (quoi === "E") { s.E = Math.min(EMAX, Math.max(EMIN, arr(y, 100))); changementEnergie(); }
  else if (quoi === "V") {
    s.V[i] = Math.min(EMAX, Math.max(EMIN, arr(y, 100)));
    recalculerPotentiel();
    if (s.forme === "paquet" && s.t === 0) initPaquet();
    toutDessiner();
  } else {
    const lo = i > 0 ? s.xs[i - 1] + 0.1 : XMIN, hi = i < s.xs.length - 1 ? s.xs[i + 1] - 0.1 : XMAX;
    s.xs[i] = Math.min(hi, Math.max(lo, arr(x, 10)));
    recalculerPotentiel(); toutDessiner();
  }
});
const lacher = () => { prise = null; };
cvE.cv.addEventListener("pointerup", lacher);
cvE.cv.addEventListener("pointercancel", lacher);

// ---- dialogue « Configurer l'énergie »
const dlg = document.getElementById("dialogue"), boite = document.getElementById("boite");
function ouvrirConfig() {
  boite.innerHTML = "";
  el("div", { class: "titre", text: "Potentiel: " + NOMS_POT[CLES_POT.indexOf(s.pot)] }, boite);
  const tab = el("table", null, boite);
  const champs = {};
  const ligne = (lib, cle, val) => {
    const tr = el("tr", null, tab);
    el("td", { text: lib }, tr);
    champs[cle] = el("input", { type: "text", value: fmt(val, 3).replace(/,?0+$/, "").replace(/,$/, "") }, el("td", null, tr));
  };
  ligne("Énergie totale moyenne (eV)", "E", s.E);
  s.V.forEach((v, j) => ligne("V" + (j + 1) + " (eV)", "V" + j, v));
  if (s.pot === "marche") ligne("Position de la marche (nm)", "pos0", s.xs[0]);
  else if (s.pot === "barriere" || s.pot === "double") {
    for (let b = 0; b < s.xs.length / 2; b++) {
      ligne("Barrière " + (b + 1) + ": bord gauche (nm)", "pos" + b, s.xs[2 * b]);
      ligne("Barrière " + (b + 1) + ": largeur (nm)", "w" + b, s.xs[2 * b + 1] - s.xs[2 * b]);
    }
  }
  const msg = el("p", { class: "erreur" }, boite);
  const bb = boutons(boite);
  bouton(bb, "Appliquer", () => {
    const lire = (c) => { const v = parseFloat(champs[c].value.replace(",", ".").replace("−", "-"));
                          if (!isFinite(v)) throw new Error("nombre illisible"); return v; };
    try {
      const E = lire("E"), V = s.V.map((_, j) => lire("V" + j));
      let xs = [];
      if (s.pot === "marche") xs = [lire("pos0")];
      else if (s.pot !== "constant") for (let b = 0; b < s.xs.length / 2; b++) {
        const p0 = lire("pos" + b), w = lire("w" + b);
        if (w <= 0) throw new Error("largeur négative ou nulle");
        xs.push(p0, p0 + w);
      }
      for (let i = 1; i < xs.length; i++) if (xs[i] <= xs[i - 1]) throw new Error("les barrières se chevauchent");
      if (![...V, E].every((v) => v >= EMIN && v <= EMAX)) throw new Error("énergies entre −1 et 1 eV");
      s.E = E; s.V = V; s.xs = xs;
      msg.textContent = "";
      recalculerPotentiel(); initPaquet(); toutDessiner();
    } catch (err) { msg.textContent = "Valeur incorrecte: " + err.message; }
  });
  bouton(bb, "Fermer", () => { dlg.style.display = "none"; });
  dlg.style.display = "flex";
}
dlg.addEventListener("click", (e) => { if (e.target === dlg) dlg.style.display = "none"; });

visibilites();
recalculerPotentiel();
initPaquet();
toutDessiner();
boucle((dt) => {
  if (s.enMarche) { avancer(dt * FS_PAR_SECONDE); dessinerOnde(cvW); dessinerDensite(cvP); }
});
</script>
