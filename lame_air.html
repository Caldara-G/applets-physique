<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Michelson en lame d'air — MP* Malherbe</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 13px; color: #222; background: #eef0f3;
}
#app { display: flex; height: 100vh; }
#principal { position: relative; flex: 1; display: flex; flex-direction: column; min-width: 0;
  padding: 8px; gap: 8px; }
.ligne-zones { display: flex; gap: 8px; min-height: 0; }
.zone { position: relative; flex: 1; min-height: 0; min-width: 0; background: #fff;
  border: 1px solid #d5d9df; border-radius: 6px; overflow: hidden; }
.zone canvas { position: absolute; left: 0; top: 0; touch-action: none; }
#panneau { width: 340px; flex: none; overflow-y: auto; background: #fff;
  border-left: 1px solid #d5d9df; padding: 10px 14px 20px; }
#panneau h1 { font-size: 16px; margin: 4px 0 2px; }
.retour { font-size: 12px; color: #4a6fa5; text-decoration: none; }
.retour:hover { text-decoration: underline; }
.section { margin: 8px 0; padding-bottom: 8px; border-bottom: 1px solid #eceef1; }
.section:last-child { border-bottom: none; }
.titre { font-weight: 600; margin-bottom: 4px; color: #333; }
.choix { display: flex; align-items: center; gap: 6px; padding: 1px 0; cursor: pointer;
  user-select: none; }
.choix input { margin: 0 2px 0 0; }
.choix.off { color: #aaa; cursor: default; }
.curseur { margin: 7px 0; }
.curseur .tete { display: flex; justify-content: space-between; align-items: center;
  gap: 6px; }
.curseur .valeur { display: flex; align-items: center; gap: 2px; flex: none; }
.saisie { width: 66px; text-align: right; font: inherit; padding: 1px 4px;
  border: 1px solid #c9cdd3; border-radius: 3px; }
.pm { width: 20px; height: 20px; padding: 0; border: 1px solid #c9cdd3;
  background: #f5f6f8; border-radius: 3px; cursor: pointer; line-height: 1; }
.pm:hover { background: #e6e9ee; }
input[type=range] { width: 100%; margin: 3px 0 0; accent-color: #3b6fb6; }
.boutons { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
button.b { padding: 5px 10px; border: 1px solid #b8bec8; background: #f3f4f6;
  border-radius: 4px; cursor: pointer; font: inherit; }
button.b:hover { background: #e4e7ec; }
button.b.actif { background: #dce7f7; border-color: #7f9fcf; }
.info { background: #f6f8fa; border: 1px solid #e1e4e8; border-radius: 4px;
  padding: 6px 8px; line-height: 1.5; }
.note { font-size: 11.5px; color: #666; font-style: italic; line-height: 1.4; }
.dialogue { position: fixed; inset: 0; background: rgba(0,0,0,0.3); display: none;
  align-items: center; justify-content: center; z-index: 10; }
.dialogue .boite { background: #fff; border-radius: 8px; padding: 16px 20px;
  min-width: 340px; box-shadow: 0 6px 30px rgba(0,0,0,0.25); }
.dialogue table td { padding: 3px 6px; }
.dialogue input[type=text] { width: 80px; font: inherit; padding: 2px 4px; }
.erreur { color: #c62828; }
@media (max-width: 900px) {
  #app { flex-direction: column; height: auto; }
  #principal { height: 75vh; }
  #panneau { width: 100%; border-left: none; border-top: 1px solid #d5d9df; }
}
.haut { display: flex; justify-content: space-between; align-items: center; }
.etiquette { font-size: 11.5px; font-weight: 600; color: #fff; background: #3b5f96;
  border-radius: 10px; padding: 2px 9px; letter-spacing: 0.02em; }
.filigrane { position: absolute; right: 16px; bottom: 14px; z-index: 5; pointer-events: none;
  font-size: 13px; font-weight: 700; color: #3b5f96; background: rgba(255,255,255,0.82);
  border: 1px solid rgba(59,95,150,0.35); border-radius: 12px; padding: 3px 11px; }
.etapes { display: flex; flex-direction: column; gap: 3px; margin-bottom: 4px; }
button.b.etape { text-align: left; padding: 4px 8px; }
button.b:disabled { opacity: 0.45; cursor: default; }
.explication { line-height: 1.55; }
</style>
</head>
<body>
<div id="app">
  <div id="principal">
    <div class="zone" id="z_vue" data-mt-nom="Schéma et écran" style="flex: 1"></div>
  </div>
  <div id="panneau"></div>
</div>
<script>
"use strict";
/* ======================================================================
   Bibliothèque commune aux applets (aucune dépendance externe)
   - interface: sections, curseurs (−/+, saisie, molette), boutons radio,
     cases à cocher, boutons
   - canvas: adaptation à la taille et à la résolution de l'écran,
     repères gradués, courbes, flèches, légendes
   - 3D: projection en perspective, rotation à la souris, tri en profondeur
   ====================================================================== */

// ---------------------------------------------------------------- DOM
function el(tag, attrs, parent) {
  const e = document.createElement(tag);
  if (attrs) {
    for (const k in attrs) {
      const v = attrs[k];
      if (k === "text") e.textContent = v;
      else if (k === "html") e.innerHTML = v;
      else if (k === "class") e.className = v;
      else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v);
    }
  }
  if (parent) parent.appendChild(e);
  return e;
}

/** Nombre écrit avec une virgule décimale. */
function fmt(v, d) {
  if (v === Infinity) return "∞";
  if (v === -Infinity) return "−∞";
  if (!isFinite(v)) return "—";
  let s = v.toFixed(d);
  if (/^-0(\.0*)?$/.test(s)) s = s.slice(1);
  return s.replace(".", ",").replace("-", "−");
}

function section(parent, titre) {
  const s = el("div", { class: "section" }, parent);
  if (titre) el("div", { class: "titre", html: titre }, s);
  return s;
}

/** Curseur avec boutons −/+, saisie au clavier et molette.
    o = {label, min, max, val, pas, dec, onchange} */
function curseur(parent, o) {
  const ligne = el("div", { class: "curseur" }, parent);
  const tete = el("div", { class: "tete" }, ligne);
  el("span", { html: o.label }, tete);
  const zone = el("span", { class: "valeur" }, tete);
  const moins = el("button", { class: "pm", text: "−", title: "diminuer" }, zone);
  const saisie = el("input", { type: "text", class: "saisie" }, zone);
  const plus = el("button", { class: "pm", text: "+", title: "augmenter" }, zone);
  const r = el("input", { type: "range", min: o.min, max: o.max, step: "any" }, ligne);
  const dec = o.dec !== undefined ? o.dec
    : Math.max(0, -Math.floor(Math.log10(o.pas) + 1e-9));
  let v = o.val;
  function borne(x) {
    x = Math.min(Math.max(x, o.min), o.max);
    return +(o.min + Math.round((x - o.min) / o.pas) * o.pas).toFixed(10);
  }
  function afficher() { r.value = v; saisie.value = fmt(v, dec); }
  function regler(x, silencieux) {
    x = borne(x);
    const change = Math.abs(x - v) > 1e-12;
    v = x;
    afficher();
    if (change && !silencieux && o.onchange) o.onchange(v);
  }
  r.addEventListener("input", () => regler(parseFloat(r.value)));
  saisie.addEventListener("change", () => {
    const x = parseFloat(saisie.value.replace(",", ".").replace("−", "-"));
    if (isFinite(x)) regler(x); else afficher();
  });
  saisie.addEventListener("keydown", (e) => { if (e.key === "Enter") saisie.blur(); });
  moins.addEventListener("click", () => regler(v - o.pas));
  plus.addEventListener("click", () => regler(v + o.pas));
  r.addEventListener("keydown", (e) => {
    const sauts = { ArrowRight: 1, ArrowUp: 1, ArrowLeft: -1, ArrowDown: -1,
                    PageUp: 10, PageDown: -10 };
    if (e.key in sauts) { e.preventDefault(); regler(v + sauts[e.key] * o.pas); }
  });
  ligne.addEventListener("wheel", (e) => {
    e.preventDefault();
    regler(v + (e.deltaY < 0 ? 1 : -1) * o.pas * (e.shiftKey ? 10 : 1));
  }, { passive: false });
  afficher();
  return {
    get: () => v,
    set: (x, silencieux) => regler(x, silencieux),
    ligne,
    montrer: (b) => { ligne.style.display = b ? "" : "none"; },
  };
}

/** Groupe de boutons radio. onchange(valeur, indice). */
function radios(parent, titre, options, actif, onchange) {
  const s = section(parent, titre);
  const nom = "r" + Math.random().toString(36).slice(2);
  const items = options.map((opt, i) => {
    const lab = el("label", { class: "choix" }, s);
    const inp = el("input", { type: "radio", name: nom }, lab);
    el("span", { html: opt }, lab);
    if (i === actif) inp.checked = true;
    inp.addEventListener("change", () => {
      if (inp.checked && onchange) onchange(opt, i);
    });
    return { inp, lab };
  });
  return {
    indice: () => items.findIndex((o) => o.inp.checked),
    valeur: () => options[items.findIndex((o) => o.inp.checked)],
    set: (i, silencieux) => {
      items[i].inp.checked = true;
      if (!silencieux && onchange) onchange(options[i], i);
    },
    desactiver: (i, b) => {
      items[i].inp.disabled = b;
      items[i].lab.classList.toggle("off", b);
    },
    section: s,
  };
}

/** Cases à cocher. options = [[libellé, coché], ...]. onchange(indice, état). */
function cases(parent, titre, options, onchange) {
  const s = section(parent, titre);
  const items = options.map(([texte, coche], i) => {
    const lab = el("label", { class: "choix" }, s);
    const inp = el("input", { type: "checkbox" }, lab);
    inp.checked = coche;
    el("span", { html: texte }, lab);
    inp.addEventListener("change", () => onchange && onchange(i, inp.checked));
    return inp;
  });
  return {
    get: (i) => items[i].checked,
    set: (i, b, silencieux) => {
      items[i].checked = b;
      if (!silencieux && onchange) onchange(i, b);
    },
    section: s,
  };
}

function boutons(parent) { return el("div", { class: "boutons" }, parent); }
function bouton(parent, texte, onclick) {
  return el("button", { class: "b", html: texte, onclick }, parent);
}

/** En-tête du panneau de commandes. */
function entete(panneau, titre) {
  const haut = el("div", { class: "haut" }, panneau);
  el("a", { class: "retour", href: "animations.html", text: "← Animations" }, haut);
  el("span", { class: "etiquette", text: "MP* Malherbe" }, haut);
  // filigrane visible en permanence sur la zone de simulation
  const principal = document.getElementById("principal");
  if (principal) el("div", { class: "filigrane", text: "MP* Malherbe" }, principal);
  el("h1", { html: titre }, panneau);
}

// ---------------------------------------------------------------- canvas
/** Canvas qui remplit son conteneur et se redessine quand il change de taille. */
function canevas(conteneur, dessiner) {
  const cv = el("canvas", null, conteneur);
  const ctx = cv.getContext("2d");
  const obj = { cv, ctx, w: 1, h: 1, dessiner };
  function taille() {
    const r = conteneur.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    obj.w = Math.max(10, Math.floor(r.width));
    obj.h = Math.max(10, Math.floor(r.height));
    cv.width = Math.round(obj.w * dpr);
    cv.height = Math.round(obj.h * dpr);
    cv.style.width = obj.w + "px";
    cv.style.height = obj.h + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (obj.dessiner) obj.dessiner(obj);
  }
  obj.effacer = (fond) => {
    ctx.fillStyle = fond || "#fff";
    ctx.fillRect(0, 0, obj.w, obj.h);
  };
  new ResizeObserver(taille).observe(conteneur);
  taille();
  return obj;
}

function boucle(pas) {
  let t0 = null;
  function image(t) {
    const dt = t0 === null ? 0 : Math.min(0.1, (t - t0) / 1000);
    t0 = t;
    pas(dt);
    requestAnimationFrame(image);
  }
  requestAnimationFrame(image);
}

// ====================================================================== applet
/* Michelson en lame d'air: dédoublement d'un rayon, localisation à l'infini, calcul de δ = 2e cos i,
   anneaux d'égale inclinaison et évolution quand e diminue. */

const COUL = { M: "#37474f", inc: "#555", r1: "#c62828", r2: "#1565c0", len: "#7b2d8e", H: "#2e7d32", e: "#e67e22" };
const p = { etape: 0, tau: 0, t: 0, vitesse: 1, i: 0.35, e: 15, auto: false };
const EMAX = 30, IMAX = 0.45;

const ETAPES = [
  { titre: "La lame d'air équivalente", texte:
    "Michelson réglé en <b>lame d'air</b>: le miroir M<sub>1</sub> et l'image M'<sub>2</sub> de M<sub>2</sub> par la séparatrice sont <b>parallèles</b>, " +
    "à la distance <span style='color:" + COUL.e + "'><b>e</b></span>. Pour le calcul, le Michelson est équivalent à cette lame d'air, éclairée par une " +
    "<b>source étendue</b>." },
  { titre: "Dédoublement d'un rayon", texte:
    "Un rayon incident sous l'angle <b>i</b> donne deux rayons: <span style='color:" + COUL.r1 + "'>(1)</span> réfléchi sur M'<sub>2</sub> en I, " +
    "<span style='color:" + COUL.r2 + "'>(2)</span> réfléchi sur M<sub>1</sub> en J et ressortant en K.<br>Les lois de la réflexion imposent que les deux rayons émergents " +
    "sont <b>parallèles</b>: ils ne se rencontrent qu'à l'infini." },
  { titre: "Localisation à l'infini", texte:
    "On observe dans le <b>plan focal image</b> d'une lentille convergente: les rayons (1) et (2), parallèles, convergent au même point P, " +
    "à la distance f' tan i du foyer F'.<br>Tous les rayons incidents de même inclinaison i, issus de <b>n'importe quel point</b> de la source étendue, " +
    "aboutissent en P avec la même différence de marche: pas de brouillage. Les interférences sont <b>localisées à l'infini</b>." },
  { titre: "Calcul de δ", texte:
    "Le plan passant par K et perpendiculaire aux rayons émergents coupe le rayon (1) en <span style='color:" + COUL.H + "'>H</span>. " +
    "D'après le théorème de Malus, (HP) = (KP). Donc:<br>δ = (IJ + JK) − IH, avec IJ = JK = e / cos i, IK = 2e tan i et IH = IK sin i.<br>" +
    "δ = 2e / cos i − 2e sin²i / cos i, soit <b>δ = 2e cos i</b>." },
  { titre: "Anneaux d'égale inclinaison", texte:
    "δ ne dépend que de i: à un angle i correspond un <b>cercle</b> de rayon r = f' tan i ≈ f' i dans le plan focal. On observe des <b>anneaux</b> centrés sur F'.<br>" +
    "L'ordre p = 2e cos i / λ est <b>maximal au centre</b> (i = 0) et décroît vers l'extérieur. Pour les petits angles, " +
    "les rayons des anneaux brillants varient comme la racine carrée de leur rang compté à partir du centre." },
  { titre: "Quand e diminue", texte:
    "En diminuant e (chariotage vers le contact optique), l'ordre au centre p<sub>0</sub> = 2e / λ diminue: chaque anneau, d'ordre fixé, " +
    "doit aller vers les i plus petits. Les anneaux <b>rentrent</b> vers le centre et y disparaissent, un anneau tous les Δe = λ / 2. " +
    "Ils s'élargissent: il y en a de moins en moins dans le champ.<br>Au <b>contact optique</b> (e = 0), l'éclairement est uniforme: <b>teinte plate</b>." },
];

// ---------------------------------------------------------------- interface
const panneau = document.getElementById("panneau");
entete(panneau, "Michelson en lame d'air");
const sEt = section(panneau, "Étapes");
const listeEt = el("div", { class: "etapes" }, sEt);
const boutonsEt = ETAPES.map((e, k) =>
  el("button", { class: "b etape", html: (k + 1) + ". " + e.titre, onclick: () => aller(k) }, listeEt));
const bt = boutons(sEt);
const bPrec = bouton(bt, "◀ Précédente", () => aller(p.etape - 1));
bouton(bt, "⟲ Rejouer", () => aller(p.etape));
const bSuiv = bouton(bt, "Suivante ▶", () => aller(p.etape + 1));
const explication = el("div", { class: "info explication" }, section(panneau, "Raisonnement"));
const sReg = section(panneau, "Réglages");
/** Glissière sans affichage de valeur numérique. */
function glissiere(parent, label, min, max, val, onchange) {
  const l = el("div", { class: "curseur" }, parent);
  el("div", { html: label }, l);
  const r = el("input", { type: "range", min, max, step: (max - min) / 500, value: val }, l);
  r.style.width = "100%";
  r.addEventListener("input", () => onchange(parseFloat(r.value)));
  return r;
}
const gI = glissiere(sReg, "Inclinaison <b>i</b> du rayon incident", 0.04, IMAX, p.i, (v) => { p.i = v; });
const gE = glissiere(sReg, "Épaisseur <b>e</b> de la lame (à gauche: contact optique)", 0, EMAX, p.e, (v) => { p.e = v; p.auto = false; });
curseur(sReg, { label: "Vitesse de l'animation", min: 0.2, max: 2, val: 1, pas: 0.1, onchange: (v) => { p.vitesse = v; } });
el("div", { class: "note", html: "Épaisseur et angles exagérés sur le schéma pour la lisibilité." }, sReg);

function majBoutons() {
  boutonsEt.forEach((b, k) => b.classList.toggle("actif", k === p.etape));
  bPrec.disabled = p.etape === 0; bSuiv.disabled = p.etape === ETAPES.length - 1;
  explication.innerHTML = "<b>" + (p.etape + 1) + ". " + ETAPES[p.etape].titre + "</b><br>" + ETAPES[p.etape].texte;
}
function aller(k) {
  if (k < 0 || k >= ETAPES.length) return;
  p.etape = k; p.tau = 0; majBoutons();
  if (k === 5) { p.e = EMAX * 0.8; gE.value = p.e; p.auto = true; }
}

// ---------------------------------------------------------------- outils de dessin
const cv = canevas(document.getElementById("z_vue"), () => {});
function texteIndices(ctx, x, y, t, police, aligne) {
  const morceaux = []; let i = 0;
  while (i < t.length) {
    if (t[i] === "_") { if (t[i + 1] === "{") { const j = t.indexOf("}", i); morceaux.push([t.slice(i + 2, j), 1]); i = j + 1; }
      else { morceaux.push([t[i + 1], 1]); i += 2; } }
    else { let j = i; while (j < t.length && t[j] !== "_") j++; morceaux.push([t.slice(i, j), 0]); i = j; }
  }
  const taille = parseInt((police.match(/(\d+)px/) || [0, 14])[1]), petite = police.replace(/\d+px/, Math.round(taille * 0.7) + "px");
  let L = 0; morceaux.forEach(([m, ind]) => { ctx.font = ind ? petite : police; L += ctx.measureText(m).width; });
  let xx = aligne === "g" ? x : aligne === "d" ? x - L : x - L / 2; ctx.textAlign = "left";
  morceaux.forEach(([m, ind]) => { ctx.font = ind ? petite : police; ctx.fillText(m, xx, y + (ind ? taille * 0.3 : 0)); xx += ctx.measureText(m).width; });
}
function txt(ctx, x, y, t, coul, police, aligne) { ctx.save(); ctx.fillStyle = coul; texteIndices(ctx, x, y, t, police || "bold 14px system-ui", aligne); ctx.restore(); }
function seg(ctx, A, B, coul, larg, tirets) {
  ctx.save(); ctx.strokeStyle = coul; ctx.lineWidth = larg; ctx.setLineDash(tirets || []);
  ctx.beginPath(); ctx.moveTo(A[0], A[1]); ctx.lineTo(B[0], B[1]); ctx.stroke(); ctx.restore();
}
/** Segment parcouru partiellement (fraction f), avec flèche au milieu si complet. */
function rayon(ctx, A, B, f, coul, larg) {
  if (f <= 0) return;
  const C = [A[0] + (B[0] - A[0]) * Math.min(1, f), A[1] + (B[1] - A[1]) * Math.min(1, f)];
  seg(ctx, A, C, coul, larg || 2.5);
  if (f >= 0.6) {
    const a = Math.atan2(B[1] - A[1], B[0] - A[0]), M = [(A[0] + B[0]) / 2, (A[1] + B[1]) / 2];
    ctx.save(); ctx.fillStyle = coul; ctx.beginPath(); ctx.moveTo(M[0] + 7 * Math.cos(a), M[1] + 7 * Math.sin(a));
    ctx.lineTo(M[0] - 6 * Math.cos(a - 0.45), M[1] - 6 * Math.sin(a - 0.45)); ctx.lineTo(M[0] - 6 * Math.cos(a + 0.45), M[1] - 6 * Math.sin(a + 0.45));
    ctx.closePath(); ctx.fill(); ctx.restore();
  }
}
function point(ctx, P, n, coul, dx, dy) {
  ctx.save(); ctx.fillStyle = coul; ctx.beginPath(); ctx.arc(P[0], P[1], 3.5, 0, 2 * Math.PI); ctx.fill(); ctx.restore();
  if (n) txt(ctx, P[0] + (dx || 0), P[1] + (dy || 0), n, coul, "bold 14px system-ui");
}
const fr = (u, a, b) => Math.max(0, Math.min(1, (u - a) / (b - a)));   // avancement d'une phase de l'animation

// ---------------------------------------------------------------- vue de gauche: lame, rayons, lentille
const YL = 3.3, F = 2.4;   // ordonnée de la lentille, distance focale (unités du schéma)
function geometrie(ctx, R, u) {
  const e = p.etape, i = p.i, E = 0.065 * p.e * (e === 3 ? 2.6 : 1);
  const k = Math.min(R.w / 9.5, R.h / (YL + F + E + 1.6));
  const X = (P) => [R.x + R.w * 0.5 + k * P[0], R.y + 0.6 * k + k * (YL + F) - k * P[1]];
  // miroirs
  const xm1 = -4.2, xm2 = 4.2;
  seg(ctx, X([xm1, 0]), X([xm2, 0]), COUL.M, 2.5, [8, 5]);
  seg(ctx, X([xm1, -E]), X([xm2, -E]), COUL.M, 4);
  ctx.save(); ctx.strokeStyle = "#90a4ae"; ctx.lineWidth = 1;
  for (let x = xm1; x < xm2; x += 0.25) { const A = X([x, -E]), B = X([x - 0.18, -E - 0.18]); ctx.beginPath(); ctx.moveTo(A[0], A[1]); ctx.lineTo(B[0], B[1]); ctx.stroke(); }
  ctx.restore();
  txt(ctx, X([xm2, 0])[0] + 4, X([0, 0])[1] + 5, "M'_2", COUL.M, "bold 15px system-ui", "g");
  txt(ctx, X([xm2, 0])[0] + 4, X([0, -E])[1] + 10, "M_1", COUL.M, "bold 15px system-ui", "g");
  // épaisseur
  if (E > 0.05) {
    const a = X([-3.6, 0]), b = X([-3.6, -E]);
    seg(ctx, a, b, COUL.e, 2); seg(ctx, [a[0] - 5, a[1]], [a[0] + 5, a[1]], COUL.e, 2); seg(ctx, [b[0] - 5, b[1]], [b[0] + 5, b[1]], COUL.e, 2);
    txt(ctx, a[0] - 12, (a[1] + b[1]) / 2 + 5, "e", COUL.e, "italic bold 16px 'Times New Roman', serif");
  }
  if (e === 0) {
    // source étendue
    const S = X([-3.2, YL + F - 0.2]);
    ctx.save(); ctx.fillStyle = "#fff59d"; ctx.strokeStyle = "#f9a825"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(S[0], S[1], 46, 14, 0, 0, 2 * Math.PI); ctx.fill(); ctx.stroke(); ctx.restore();
    txt(ctx, S[0], S[1] - 22, "source étendue", "#b26a00", "bold 13px system-ui");
    for (let j = -2; j <= 2; j++) { const A = [S[0] + j * 16, S[1] + 12]; seg(ctx, A, [A[0] + 30 * Math.sin(j * 0.3 + 0.4), A[1] + 60], "#f9a825", 1.5); }
    txt(ctx, R.x + R.w / 2, X([0, -E])[1] + 40, "lame d'air d'épaisseur e", COUL.e, "bold 14px system-ui");
    return;
  }
  // rayons d'une inclinaison i, issus de plusieurs points de la source
  const ti = Math.tan(i), si = Math.sin(i), ci = Math.cos(i);
  const famille = e === 2 ? [-0.9, 0, 0.9] : [0];
  const ixs = famille.map((d) => -1.6 + d);
  const P = [F * ti, YL + F];                      // point de convergence dans le plan focal
  const fin = e === 1 ? 2.2 : YL;                  // hauteur où l'on arrête les rayons émergents si pas de lentille
  ixs.forEach((xI, n) => {
    const I = [xI, 0], J = [xI + E * ti, -E], K = [xI + 2 * E * ti, 0];
    const S0 = [xI - (YL + F - 0.3) * ti, YL + F - 0.3];
    const v = e === 1 ? u : (e === 2 ? fr(u, n * 0.12, 0.7 + n * 0.12) : 1);
    const a1 = fr(v, 0, 0.35), a2 = fr(v, 0.35, 1);
    rayon(ctx, X(S0), X(I), a1, COUL.inc, 2);
    const L1 = [xI + fin * ti, fin], L2 = [K[0] + fin * ti, fin];
    rayon(ctx, X(I), X(L1), a2, COUL.r1, 2.5);
    rayon(ctx, X(I), X(J), fr(a2, 0, 0.3), COUL.r2, 2.5); rayon(ctx, X(J), X(K), fr(a2, 0.3, 0.6), COUL.r2, 2.5);
    rayon(ctx, X(K), X(L2), fr(a2, 0.6, 1), COUL.r2, 2.5);
    if (e >= 2) {
      const b = fr(v, 0.7, 1) || (e > 2 ? 1 : 0);
      rayon(ctx, X(L1), X(P), b, COUL.r1, 2); rayon(ctx, X(L2), X(P), b, COUL.r2, 2);
    }
    if (n === 0 || famille.length === 1) {
      if (a1 >= 1) { point(ctx, X(I), "I", "#222", -12, 16); }
      if (a2 >= 0.3 && E > 0.05) point(ctx, X(J), "J", "#222", 0, 18);
      if (a2 >= 0.6) point(ctx, X(K), "K", "#222", 12, -8);
    }
    if (n === 0 && a1 > 0.5) {
      // angle i
      const Ii = X(I); seg(ctx, Ii, X([xI, 1.4]), "#999", 1, [3, 3]);
      ctx.save(); ctx.strokeStyle = "#444"; ctx.lineWidth = 1.2; ctx.beginPath();
      ctx.arc(Ii[0], Ii[1], 0.9 * k, -Math.PI / 2 - i, -Math.PI / 2); ctx.stroke(); ctx.restore();
      txt(ctx, Ii[0] - 0.9 * k * Math.sin(i / 2) - 6, Ii[1] - 0.9 * k * Math.cos(i / 2) - 4, "i", "#222", "italic bold 15px 'Times New Roman', serif");
    }
    if (e === 1 && a2 >= 1 && n === 0) {
      txt(ctx, X(L1)[0] - 6, X(L1)[1] - 6, "(1)", COUL.r1, "bold 14px system-ui", "d");
      txt(ctx, X(L2)[0] + 6, X(L2)[1] - 6, "(2)", COUL.r2, "bold 14px system-ui", "g");
    }
    // construction de H
    if (e === 3 && n === 0) {
      const IK = 2 * E * ti, H = [xI + IK * si * si, IK * si * ci];
      const b = fr(u, 0, 0.5);
      if (b > 0) {
        seg(ctx, X(K), X([K[0] + (H[0] - K[0]) * b, K[1] + (H[1] - K[1]) * b]), COUL.H, 2.5, [6, 4]);
        if (b >= 1) {
          point(ctx, X(H), "H", COUL.H, -12, -4);
          // angle droit en H
          const ux = [si, ci], vx = [ci, -si], c = 0.18;
          const A1 = X([H[0] - ux[0] * c, H[1] - ux[1] * c]), A2 = X([H[0] - ux[0] * c + vx[0] * c, H[1] - ux[1] * c + vx[1] * c]), A3 = X([H[0] + vx[0] * c, H[1] + vx[1] * c]);
          ctx.save(); ctx.strokeStyle = COUL.H; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(A1[0], A1[1]); ctx.lineTo(A2[0], A2[1]); ctx.lineTo(A3[0], A3[1]); ctx.stroke(); ctx.restore();
          txt(ctx, X(K)[0] + 14, X(K)[1] - 26, "plan d'onde (HK)", COUL.H, "13px system-ui", "g");
        }
      }
      if (fr(u, 0.5, 0.8) > 0) {
        // surlignage des chemins
        seg(ctx, X(I), X(J), COUL.r2, 5); seg(ctx, X(J), X(K), COUL.r2, 5); seg(ctx, X(I), X(H), COUL.r1, 5);
      }
    }
  });
  // lentille et plan focal
  if (e >= 2) {
    const g = X([-2.4, YL]), d = X([2.4, YL]);
    ctx.save(); ctx.strokeStyle = COUL.len; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(g[0], g[1]); ctx.lineTo(d[0], d[1]); ctx.stroke();
    for (const [Q, s] of [[g, -1], [d, 1]]) { ctx.beginPath(); ctx.moveTo(Q[0] - s * 9, Q[1] - 8); ctx.lineTo(Q[0], Q[1]); ctx.lineTo(Q[0] - s * 9, Q[1] + 8); ctx.stroke(); }
    ctx.restore();
    txt(ctx, d[0] + 8, d[1] + 5, "lentille (L)", COUL.len, "bold 13px system-ui", "g");
    seg(ctx, X([-3, YL + F]), X([3, YL + F]), "#333", 2);
    txt(ctx, X([3, YL + F])[0] + 6, X([3, YL + F])[1] + 5, "plan focal", "#333", "13px system-ui", "g");
    seg(ctx, X([0, YL - 0.5]), X([0, YL + F + 0.2]), "#999", 1, [6, 4]);
    point(ctx, X([0, YL + F]), "F'", "#333", -14, -8);
    point(ctx, X(P), "P", "#222", 10, -8);
  }
}

// ---------------------------------------------------------------- vue de droite: écran (plan focal)
let cache = { cle: "", img: null };
function etiquette(ctx, x, y, t) {
  ctx.save(); ctx.font = "bold 13px system-ui"; const L = ctx.measureText(t).width;
  ctx.fillStyle = "rgba(0,0,0,0.75)"; ctx.fillRect(x - 3, y - 14, L + 6, 19); ctx.restore();
  txt(ctx, x, y, t, "#4fc3f7", "bold 13px system-ui", "g");
}
function anneaux(ctx, R) {
  const D = Math.floor(Math.min(R.w, R.h) * 0.82), cx = R.x + R.w / 2, cy = R.y + R.h / 2 + 8;
  const visible = p.etape >= 4;
  const cle = D + "|" + p.e.toFixed(3) + "|" + visible;
  if (cache.cle !== cle) {
    const c = document.createElement("canvas"); c.width = D; c.height = D;
    const g = c.getContext("2d"), im = g.createImageData(D, D), f = (D / 2) / Math.tan(IMAX);
    for (let y = 0; y < D; y++) for (let x = 0; x < D; x++) {
      const r = Math.hypot(x - D / 2, y - D / 2), q = 4 * (y * D + x);
      if (r > D / 2) { im.data[q + 3] = 0; continue; }
      const ii = Math.atan(r / f), I = visible ? 0.5 * (1 + Math.cos(2 * Math.PI * 2 * p.e * Math.cos(ii))) : 0.08;
      im.data[q] = 255 * Math.pow(I, 0.8); im.data[q + 1] = 200 * Math.pow(I, 0.9); im.data[q + 2] = 40 * I; im.data[q + 3] = 255;
    }
    g.putImageData(im, 0, 0); cache = { cle, img: c };
  }
  ctx.save(); ctx.fillStyle = "#111"; ctx.beginPath(); ctx.arc(cx, cy, D / 2 + 3, 0, 2 * Math.PI); ctx.fill(); ctx.restore();
  ctx.drawImage(cache.img, cx - D / 2, cy - D / 2);
  txt(ctx, cx, R.y + 22, "plan focal image de (L): écran", "#333", "bold 14px system-ui");
  if (p.etape >= 2) {
    const f = (D / 2) / Math.tan(IMAX), r = f * Math.tan(p.i);
    point(ctx, [cx, cy], "", "#fff");
    txt(ctx, cx - 10, cy - 8, "F'", "#fff", "bold 13px system-ui");
    if (p.etape >= 4) {
      ctx.save(); ctx.strokeStyle = "#4fc3f7"; ctx.lineWidth = 2; ctx.setLineDash([6, 4]); ctx.beginPath(); ctx.arc(cx, cy, r, 0, 2 * Math.PI); ctx.stroke(); ctx.restore();
      etiquette(ctx, cx + r * 0.71 + 8, cy - r * 0.71 - 4, "i = cte");
    }
    ctx.save(); ctx.fillStyle = "#4fc3f7"; ctx.beginPath(); ctx.arc(cx + r, cy, 5, 0, 2 * Math.PI); ctx.fill(); ctx.restore();
    etiquette(ctx, cx + r + 8, cy + 18, "P");
  }
  if (p.etape === 5 && p.e < 0.25) txt(ctx, cx, cy + D / 2 + 26, "contact optique: teinte plate", "#c62828", "bold 15px system-ui");
  if (p.etape === 3 || p.etape === 4) {
    ctx.save(); const bx = cx - 120, by = cy + D / 2 + 8; ctx.fillStyle = "#fffbe6"; ctx.strokeStyle = "#e0c060";
    ctx.fillRect(bx, by, 240, 38); ctx.strokeRect(bx, by, 240, 38); ctx.restore();
    txt(ctx, cx, by + 26, "δ = 2e cos i", "#222", "bold 20px 'Times New Roman', serif");
  }
}

// ---------------------------------------------------------------- dessin général
function dessiner() {
  const ctx = cv.ctx; cv.effacer("#fff");
  const u = Math.min(1, p.tau);
  const cote = cv.w > cv.h * 1.15;
  let A, B;
  if (cote) { A = { x: 0, y: 0, w: cv.w * 0.56, h: cv.h }; B = { x: cv.w * 0.56, y: 0, w: cv.w * 0.44, h: cv.h }; }
  else { A = { x: 0, y: 0, w: cv.w, h: cv.h * 0.55 }; B = { x: 0, y: cv.h * 0.55, w: cv.w, h: cv.h * 0.45 }; }
  geometrie(ctx, A, u);
  anneaux(ctx, B);
}

// ---------------------------------------------------------------- boucle
majBoutons();
// ---- enchaînement automatique de toutes les étapes (durée de chaque étape: temps de lecture de l'explication)
const ench = { on: false, t: 0, der: null };
const bEnch = bouton(bt, "▶ Tout enchaîner", () => {
  ench.on = !ench.on;
  if (ench.on) aller(p.etape === ETAPES.length - 1 ? 0 : p.etape);
  ench.t = 0; majEnch();
});
const barreEnch = el("div", { style: "height:4px;background:#e3e8ef;border-radius:2px;margin-top:6px;display:none" }, sEt);
const jaugeEnch = el("div", { style: "height:4px;width:0;background:#3d6fb3;border-radius:2px" }, barreEnch);
function majEnch() { bEnch.innerHTML = ench.on ? "■ Arrêter" : "▶ Tout enchaîner"; barreEnch.style.display = ench.on ? "" : "none"; }
function dureeEnch() { const n = (explication.innerText || "").split(/\s+/).length; return 5 + n / 4; }
{ const allerInitial = aller; aller = (k) => { ench.t = 0; allerInitial(k); }; }
function tickEnch(ts) {
  const dt = ench.der === null ? 0 : Math.min(0.1, (ts - ench.der) / 1000); ench.der = ts;
  if (ench.on) {
    ench.t += dt; const D = dureeEnch(); jaugeEnch.style.width = Math.min(100, 100 * ench.t / D) + "%";
    if (ench.t >= D) { if (p.etape < ETAPES.length - 1) aller(p.etape + 1); else { ench.on = false; majEnch(); } }
  }
  requestAnimationFrame(tickEnch);
}
requestAnimationFrame(tickEnch);

boucle((dt) => {
  if (p.etape === 5 && p.auto) { p.e = Math.max(0, p.e - 0.9 * dt * p.vitesse); gE.value = p.e; if (p.e === 0) p.auto = false; }
  p.t += dt * p.vitesse; p.tau += dt * 0.3 * p.vitesse; dessiner(); });

</script>
