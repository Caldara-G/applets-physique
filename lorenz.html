<!doctype html>
<html lang="fr" data-domaine="complements">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Attracteur de Lorenz — MP* Malherbe</title>
<link rel="stylesheet" href="complements.css">
<link rel="stylesheet" href="domaines.css">
</head>
<body>
<script src="complements.js"></script>
<script>
"use strict";
/* Attracteur de Lorenz (1963) : dx/dt = σ(y − x), dy/dt = x(ρ − z) − y, dz/dt = xy − βz.
   Intégration RK4 (pas 0,004). Vue 3D en perspective, rotation à la souris. */
const C = Cadre("Attracteur de Lorenz", "Lorenz");
const ctx = C.ctx;
const P = { mode: "une", sigma: 10, rho: 28, beta: 8 / 3, nNuage: 800, autoRot: true, longueur: 3000, couleur: "vitesse" };
const cam = { lacet: 0.6, tangage: -0.25, dist: 88 };
let traj = [], t = 0, ecarts = [];

function f(s, out) {
  out[0] = P.sigma * (s[1] - s[0]);
  out[1] = s[0] * (P.rho - s[2]) - s[1];
  out[2] = s[0] * s[1] - P.beta * s[2];
}
const k1 = [0, 0, 0], k2 = [0, 0, 0], k3 = [0, 0, 0], k4 = [0, 0, 0], tmp = [0, 0, 0];
function rk4(s, h) {
  f(s, k1);
  for (let i = 0; i < 3; i++) tmp[i] = s[i] + h / 2 * k1[i]; f(tmp, k2);
  for (let i = 0; i < 3; i++) tmp[i] = s[i] + h / 2 * k2[i]; f(tmp, k3);
  for (let i = 0; i < 3; i++) tmp[i] = s[i] + h * k3[i]; f(tmp, k4);
  for (let i = 0; i < 3; i++) s[i] += h / 6 * (k1[i] + 2 * k2[i] + 2 * k3[i] + k4[i]);
}
function recommencer() {
  t = 0; ecarts = [];
  const base = [1, 1, 20];
  if (P.mode === "une") traj = [{ s: base.slice(), h: [], c: "#00f0ff" }];
  else if (P.mode === "deux") traj = [{ s: base.slice(), h: [], c: "#00f0ff" }, { s: [1 + 1e-6, 1, 20], h: [], c: "#ff2bd6" }];
  else {
    traj = [];
    for (let k = 0; k < P.nNuage; k++) {
      const e = 0.2;
      traj.push({ s: [1 + (Math.random() - 0.5) * e, 1 + (Math.random() - 0.5) * e, 20 + (Math.random() - 0.5) * e], h: [], c: null, u: k / P.nNuage });
    }
  }
}
function pas(dt) {
  const h = 0.004, n = Math.round(dt * 1.0 / h);
  const L = P.mode === "nuage" ? 14 : P.longueur;
  for (let k = 0; k < n; k++) {
    for (const tr of traj) {
      rk4(tr.s, h);
      if (P.mode !== "nuage" || k % 3 === 0) { tr.h.push([tr.s[0], tr.s[1], tr.s[2]]); if (tr.h.length > L) tr.h.shift(); }
    }
    t += h;
    if (P.mode === "deux" && k % 10 === 0) {
      const a = traj[0].s, b = traj[1].s;
      ecarts.push([t, Math.log10(Math.max(1e-12, Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2])))]);
      if (ecarts.length > 4000) ecarts.shift();
    }
  }
}

// ---------------------------------------------------------------- projection
function projeteur() {
  const cl = Math.cos(cam.lacet), sl = Math.sin(cam.lacet), ct = Math.cos(cam.tangage), st = Math.sin(cam.tangage);
  const zc = (P.rho - 1) * 0.95;          // centre de l'attracteur
  const foc = Math.min(C.W, C.H) * 1.25;
  return (x, y, z) => {
    // repère : z vertical à l'écran
    const X = x, Y = y, Z = z - zc;
    const x1 = cl * X - sl * Y, y1 = sl * X + cl * Y;
    const y2 = ct * y1 - st * Z, z2 = st * y1 + ct * Z;
    const prof = cam.dist + y2;
    const k = foc / prof;
    return [C.W / 2 + x1 * k, C.H / 2 - z2 * k, prof];
  };
}
const NEON = ["#4d00ff", "#00f0ff", "#39ff14", "#ffe600", "#ff6a00", "#ff2bd6"];
function interp(u) {
  u = Math.min(0.999, Math.max(0, u)) * (NEON.length - 1);
  const i = Math.floor(u), f = u - i;
  const a = parseInt(NEON[i].slice(1), 16), b = parseInt(NEON[i + 1].slice(1), 16);
  const m = (s) => Math.round(((a >> s) & 255) * (1 - f) + ((b >> s) & 255) * f);
  return [m(16), m(8), m(0)];
}
function dessiner(dt) {
  if (P.autoRot && !glisse) cam.lacet += dt * 0.15;
  C.effacer();
  const pr = projeteur();
  ctx.globalCompositeOperation = "lighter";
  ctx.lineCap = "round";
  if (P.mode !== "nuage") {
    for (const tr of traj) {
      const hs = tr.h, n = hs.length;
      if (n < 2) continue;
      let p0 = pr(...hs[0]);
      for (let i = 1; i < n; i++) {
        const p1 = pr(...hs[i]);
        const age = i / n;
        let col;
        if (P.mode === "deux") col = tr.c === "#00f0ff" ? [0, 240, 255] : [255, 43, 214];
        else if (P.couleur === "vitesse") {
          const a = hs[i], b = hs[i - 1];
          col = interp(Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]) / 0.9);
        } else col = interp(hs[i][0] > 0 ? 0.85 : 0.2);
        ctx.strokeStyle = `rgba(${col[0]},${col[1]},${col[2]},${0.15 + 0.85 * age})`;
        ctx.lineWidth = 1.6;
        ctx.beginPath(); ctx.moveTo(p0[0], p0[1]); ctx.lineTo(p1[0], p1[1]); ctx.stroke();
        p0 = p1;
      }
      const tete = pr(...tr.s);
      C.halo(tete[0], tete[1], 16, tr.c, 0.9);
      ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(tete[0], tete[1], 2.5, 0, 6.2832); ctx.fill();
    }
  } else {
    for (const tr of traj) {
      const col = interp(tr.u), hs = tr.h, n = hs.length;
      if (n < 2) continue;
      ctx.strokeStyle = `rgba(${col[0]},${col[1]},${col[2]},0.55)`; ctx.lineWidth = 1.3;
      ctx.beginPath();
      let p = pr(...hs[0]); ctx.moveTo(p[0], p[1]);
      for (let i = 1; i < n; i++) { p = pr(...hs[i]); ctx.lineTo(p[0], p[1]); }
      ctx.stroke();
      ctx.fillStyle = `rgb(${col[0]},${col[1]},${col[2]})`;
      p = pr(...tr.s); ctx.fillRect(p[0] - 1.5, p[1] - 1.5, 3, 3);
    }
  }
  // points fixes C+ et C−
  if (P.rho > 1) {
    const q = Math.sqrt(P.beta * (P.rho - 1));
    ctx.globalCompositeOperation = "source-over";
    ctx.font = "bold 13px system-ui"; ctx.fillStyle = "#ffe600"; ctx.textAlign = "center";
    for (const [sx, lab] of [[1, "C₊"], [-1, "C₋"]]) {
      const p = pr(sx * q, sx * q, P.rho - 1);
      ctx.strokeStyle = "#ffe600"; ctx.lineWidth = 1.3;
      ctx.beginPath(); ctx.moveTo(p[0] - 5, p[1]); ctx.lineTo(p[0] + 5, p[1]); ctx.moveTo(p[0], p[1] - 5); ctx.lineTo(p[0], p[1] + 5); ctx.stroke();
      ctx.fillText(lab, p[0], p[1] - 9);
    }
  }
  ctx.globalCompositeOperation = "source-over";
  if (P.mode === "deux") encart();
  majHud();
}
// encart : log de l'écart entre les deux trajectoires
function encart() {
  const w = Math.min(330, C.W * 0.4), h = 150, x0 = C.W - w - 14, y0 = 14;
  ctx.fillStyle = "rgba(10,5,20,0.8)"; ctx.strokeStyle = "rgba(255,43,214,0.5)"; ctx.lineWidth = 1;
  ctx.fillRect(x0, y0, w, h); ctx.strokeRect(x0, y0, w, h);
  const tmax = Math.max(30, t), X = u => x0 + 34 + (w - 44) * u / tmax, Y = v => y0 + h - 16 - (h - 52) * (v + 7) / 9;
  ctx.fillStyle = "#a8a2c0"; ctx.font = "11px system-ui"; ctx.textAlign = "right";
  for (const v of [-6, -4, -2, 0, 2]) { ctx.fillText("10" + ["⁻⁶", "⁻⁴", "⁻²", "⁰", "²"][[-6, -4, -2, 0, 2].indexOf(v)], x0 + 30, Y(v) + 4); ctx.strokeStyle = "rgba(255,255,255,0.08)"; ctx.beginPath(); ctx.moveTo(x0 + 34, Y(v)); ctx.lineTo(x0 + w - 8, Y(v)); ctx.stroke(); }
  ctx.textAlign = "left"; ctx.fillStyle = "#fff"; ctx.fillText("écart entre les deux trajectoires (échelle log)", x0 + 8, y0 + 13);
  ctx.textAlign = "right"; ctx.fillStyle = "#a8a2c0"; ctx.fillText("t", x0 + w - 6, y0 + h - 6);
  // pente de Lyapunov λ ≈ 0,906 : écart ∝ e^(λt)
  ctx.save(); ctx.beginPath(); ctx.rect(x0, y0 + 34, w, h - 34); ctx.clip();
  ctx.setLineDash([4, 4]); ctx.strokeStyle = "rgba(255,230,0,0.7)";
  ctx.beginPath(); ctx.moveTo(X(0), Y(-6)); ctx.lineTo(X(tmax), Y(-6 + 0.906 * tmax / Math.LN10)); ctx.stroke(); ctx.setLineDash([]);
  ctx.strokeStyle = "#ff2bd6"; ctx.lineWidth = 1.5; ctx.beginPath();
  ecarts.forEach((e, i) => { if (i) ctx.lineTo(X(e[0]), Y(e[1])); else ctx.moveTo(X(e[0]), Y(e[1])); });
  ctx.stroke(); ctx.restore();
  ctx.fillStyle = "#ffe600"; ctx.textAlign = "left"; ctx.fillText("pente e^(λt), λ ≈ 0,91", x0 + 40, y0 + 28);
}
let ch = 0;
function majHud() {
  if (ch++ % 8) return;
  const fr = C.fr;
  let regime = P.rho < 1 ? "tout converge vers l'origine" : P.rho < 24.74 ? (P.rho < 13.93 ? "convergence vers C₊ ou C₋" : "chaos transitoire, puis convergence vers C₊ ou C₋") : "attracteur étrange: régime chaotique";
  C.hud.innerHTML = `<span class="grand">σ = ${fr(P.sigma, 1)}, ρ = ${fr(P.rho, 1)}, β = ${fr(P.beta, 3)}</span><br>t = <span class="v">${fr(t, 1)}</span> · ${regime}`;
}
// ---------------------------------------------------------------- souris
let glisse = false, prec = null;
C.pointeur({
  bas: (x, y) => { glisse = true; prec = [x, y]; },
  glisse: (x, y) => { cam.lacet += (x - prec[0]) * 0.008; cam.tangage = Math.max(-1.5, Math.min(1.5, cam.tangage + (y - prec[1]) * 0.008)); prec = [x, y]; },
  haut: () => { glisse = false; },
  molette: dy => { cam.dist = Math.max(50, Math.min(400, cam.dist * Math.exp(dy * 0.001))); },
});
// ---------------------------------------------------------------- panneau
const s1 = C.section("Situation");
C.radios(s1, [["une", "Une trajectoire"], ["deux", "Deux trajectoires partant à 10⁻⁶ l'une de l'autre"], ["nuage", "Un nuage de points qui envahit l'attracteur"]], P, "mode", recommencer);
const sp = C.section("Paramètres");
C.curseur(sp, "σ (nombre de Prandtl)", P, "sigma", 1, 20, 0.1, v => C.fr(v, 1));
C.curseur(sp, "ρ (nombre de Rayleigh réduit)", P, "rho", 0.5, 60, 0.1, v => C.fr(v, 1));
C.curseur(sp, "β (géométrie)", P, "beta", 0.5, 5, 0.01, v => C.fr(v, 3));
C.bouton(C.boutons(sp), "Valeurs de Lorenz (10, 28, 8/3)", () => { P.sigma = 10; P.rho = 28; P.beta = 8 / 3; majCurseurs(); recommencer(); });
function majCurseurs() { const r = sp.querySelectorAll("input[type=range]"); r[0].value = P.sigma; r[1].value = P.rho; r[2].value = P.beta; r.forEach(i => i.dispatchEvent(new Event("input"))); }
const sa = C.section("Affichage");
C.caseC(sa, "Rotation automatique (sinon: glisser pour tourner)", P, "autoRot");
C.radios(sa, [["vitesse", "Couleur selon la vitesse"], ["aile", "Couleur selon l'aile (x &gt; 0 ou x &lt; 0)"]], P, "couleur");
C.curseur(sa, "Longueur de la traînée", P, "longueur", 300, 8000, 100, v => v + " points");
const s3 = C.section("Ce qu'on observe");
C.texte(s3, "Lorenz a obtenu ces trois équations en simplifiant à l'extrême la convection d'une couche d'air chauffée par le bas. La trajectoire tourne autour de C₊ puis de C₋ sans jamais repasser par le même état et sans aucune régularité: c'est un <b>attracteur étrange</b>, de dimension fractale ≈ 2,06.");
C.texte(s3, "Deux états initiaux distants de 10⁻⁶ s'écartent comme e<sup>λt</sup> (λ ≈ 0,91, exposant de Lyapunov): toute prévision à long terme est impossible. C'est l'« effet papillon ».");
C.note(s3, "Faire varier ρ: pour ρ &lt; 24,74 les points fixes C₊ et C₋ sont stables et la trajectoire finit par s'y arrêter.");
C.temps(recommencer);
C.ajuster();
recommencer();
C.demarrer(pas, dessiner);
</script>
<script src="mobile.js"></script>
</body>
</html>
