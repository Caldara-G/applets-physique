<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Michelson: schéma équivalent — MP* Malherbe</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 13px; color: #222; background: #eef0f3;
}
#app { display: flex; height: 100vh; }
#principal { position: relative; flex: 1; display: flex; flex-direction: column; min-width: 0;
  padding: 8px; gap: 8px; }
.ligne-zones { display: flex; gap: 8px; min-height: 0; }
.zone { position: relative; flex: 1; min-height: 0; min-width: 0; background: #fff;
  border: 1px solid #d5d9df; border-radius: 6px; overflow: hidden; }
.zone canvas { position: absolute; left: 0; top: 0; touch-action: none; }
#panneau { width: 340px; flex: none; overflow-y: auto; background: #fff;
  border-left: 1px solid #d5d9df; padding: 10px 14px 20px; }
#panneau h1 { font-size: 16px; margin: 4px 0 2px; }
.retour { font-size: 12px; color: #4a6fa5; text-decoration: none; }
.retour:hover { text-decoration: underline; }
.section { margin: 8px 0; padding-bottom: 8px; border-bottom: 1px solid #eceef1; }
.section:last-child { border-bottom: none; }
.titre { font-weight: 600; margin-bottom: 4px; color: #333; }
.choix { display: flex; align-items: center; gap: 6px; padding: 1px 0; cursor: pointer;
  user-select: none; }
.choix input { margin: 0 2px 0 0; }
.choix.off { color: #aaa; cursor: default; }
.curseur { margin: 7px 0; }
.curseur .tete { display: flex; justify-content: space-between; align-items: center;
  gap: 6px; }
.curseur .valeur { display: flex; align-items: center; gap: 2px; flex: none; }
.saisie { width: 66px; text-align: right; font: inherit; padding: 1px 4px;
  border: 1px solid #c9cdd3; border-radius: 3px; }
.pm { width: 20px; height: 20px; padding: 0; border: 1px solid #c9cdd3;
  background: #f5f6f8; border-radius: 3px; cursor: pointer; line-height: 1; }
.pm:hover { background: #e6e9ee; }
input[type=range] { width: 100%; margin: 3px 0 0; accent-color: #3b6fb6; }
.boutons { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
button.b { padding: 5px 10px; border: 1px solid #b8bec8; background: #f3f4f6;
  border-radius: 4px; cursor: pointer; font: inherit; }
button.b:hover { background: #e4e7ec; }
button.b.actif { background: #dce7f7; border-color: #7f9fcf; }
.info { background: #f6f8fa; border: 1px solid #e1e4e8; border-radius: 4px;
  padding: 6px 8px; line-height: 1.5; }
.note { font-size: 11.5px; color: #666; font-style: italic; line-height: 1.4; }
.dialogue { position: fixed; inset: 0; background: rgba(0,0,0,0.3); display: none;
  align-items: center; justify-content: center; z-index: 10; }
.dialogue .boite { background: #fff; border-radius: 8px; padding: 16px 20px;
  min-width: 340px; box-shadow: 0 6px 30px rgba(0,0,0,0.25); }
.dialogue table td { padding: 3px 6px; }
.dialogue input[type=text] { width: 80px; font: inherit; padding: 2px 4px; }
.erreur { color: #c62828; }
@media (max-width: 900px) {
  #app { flex-direction: column; height: auto; }
  #principal { height: 75vh; }
  #panneau { width: 100%; border-left: none; border-top: 1px solid #d5d9df; }
}
.haut { display: flex; justify-content: space-between; align-items: center; }
.etiquette { font-size: 11.5px; font-weight: 600; color: #fff; background: #3b5f96;
  border-radius: 10px; padding: 2px 9px; letter-spacing: 0.02em; }
.filigrane { position: absolute; right: 16px; bottom: 14px; z-index: 5; pointer-events: none;
  font-size: 13px; font-weight: 700; color: #3b5f96; background: rgba(255,255,255,0.82);
  border: 1px solid rgba(59,95,150,0.35); border-radius: 12px; padding: 3px 11px; }
.etapes { display: flex; flex-direction: column; gap: 3px; margin-bottom: 4px; }
button.b.etape { text-align: left; padding: 4px 8px; }
button.b:disabled { opacity: 0.45; cursor: default; }
.explication { line-height: 1.55; }
.mono { font-size: 12.5px; line-height: 1.6; }
</style>
</head>
<body>
<div id="app">
  <div id="principal">
    <div class="zone" id="z_schema" data-mt-nom="Schéma"></div>
  </div>
  <div id="panneau"></div>
</div>
<script>
"use strict";
/* ======================================================================
   Bibliothèque commune aux applets (aucune dépendance externe)
   - interface: sections, curseurs (−/+, saisie, molette), boutons radio,
     cases à cocher, boutons
   - canvas: adaptation à la taille et à la résolution de l'écran,
     repères gradués, courbes, flèches, légendes
   - 3D: projection en perspective, rotation à la souris, tri en profondeur
   ====================================================================== */

// ---------------------------------------------------------------- DOM
function el(tag, attrs, parent) {
  const e = document.createElement(tag);
  if (attrs) {
    for (const k in attrs) {
      const v = attrs[k];
      if (k === "text") e.textContent = v;
      else if (k === "html") e.innerHTML = v;
      else if (k === "class") e.className = v;
      else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v);
    }
  }
  if (parent) parent.appendChild(e);
  return e;
}

/** Nombre écrit avec une virgule décimale. */
function fmt(v, d) {
  if (v === Infinity) return "∞";
  if (v === -Infinity) return "−∞";
  if (!isFinite(v)) return "—";
  let s = v.toFixed(d);
  if (/^-0(\.0*)?$/.test(s)) s = s.slice(1);
  return s.replace(".", ",").replace("-", "−");
}

function section(parent, titre) {
  const s = el("div", { class: "section" }, parent);
  if (titre) el("div", { class: "titre", html: titre }, s);
  return s;
}

/** Curseur avec boutons −/+, saisie au clavier et molette.
    o = {label, min, max, val, pas, dec, onchange} */
function curseur(parent, o) {
  const ligne = el("div", { class: "curseur" }, parent);
  const tete = el("div", { class: "tete" }, ligne);
  el("span", { html: o.label }, tete);
  const zone = el("span", { class: "valeur" }, tete);
  const moins = el("button", { class: "pm", text: "−", title: "diminuer" }, zone);
  const saisie = el("input", { type: "text", class: "saisie" }, zone);
  const plus = el("button", { class: "pm", text: "+", title: "augmenter" }, zone);
  const r = el("input", { type: "range", min: o.min, max: o.max, step: "any" }, ligne);
  const dec = o.dec !== undefined ? o.dec
    : Math.max(0, -Math.floor(Math.log10(o.pas) + 1e-9));
  let v = o.val;
  function borne(x) {
    x = Math.min(Math.max(x, o.min), o.max);
    return +(o.min + Math.round((x - o.min) / o.pas) * o.pas).toFixed(10);
  }
  function afficher() { r.value = v; saisie.value = fmt(v, dec); }
  function regler(x, silencieux) {
    x = borne(x);
    const change = Math.abs(x - v) > 1e-12;
    v = x;
    afficher();
    if (change && !silencieux && o.onchange) o.onchange(v);
  }
  r.addEventListener("input", () => regler(parseFloat(r.value)));
  saisie.addEventListener("change", () => {
    const x = parseFloat(saisie.value.replace(",", ".").replace("−", "-"));
    if (isFinite(x)) regler(x); else afficher();
  });
  saisie.addEventListener("keydown", (e) => { if (e.key === "Enter") saisie.blur(); });
  moins.addEventListener("click", () => regler(v - o.pas));
  plus.addEventListener("click", () => regler(v + o.pas));
  r.addEventListener("keydown", (e) => {
    const sauts = { ArrowRight: 1, ArrowUp: 1, ArrowLeft: -1, ArrowDown: -1,
                    PageUp: 10, PageDown: -10 };
    if (e.key in sauts) { e.preventDefault(); regler(v + sauts[e.key] * o.pas); }
  });
  ligne.addEventListener("wheel", (e) => {
    e.preventDefault();
    regler(v + (e.deltaY < 0 ? 1 : -1) * o.pas * (e.shiftKey ? 10 : 1));
  }, { passive: false });
  afficher();
  return {
    get: () => v,
    set: (x, silencieux) => regler(x, silencieux),
    ligne,
    montrer: (b) => { ligne.style.display = b ? "" : "none"; },
  };
}

/** Groupe de boutons radio. onchange(valeur, indice). */
function radios(parent, titre, options, actif, onchange) {
  const s = section(parent, titre);
  const nom = "r" + Math.random().toString(36).slice(2);
  const items = options.map((opt, i) => {
    const lab = el("label", { class: "choix" }, s);
    const inp = el("input", { type: "radio", name: nom }, lab);
    el("span", { html: opt }, lab);
    if (i === actif) inp.checked = true;
    inp.addEventListener("change", () => {
      if (inp.checked && onchange) onchange(opt, i);
    });
    return { inp, lab };
  });
  return {
    indice: () => items.findIndex((o) => o.inp.checked),
    valeur: () => options[items.findIndex((o) => o.inp.checked)],
    set: (i, silencieux) => {
      items[i].inp.checked = true;
      if (!silencieux && onchange) onchange(options[i], i);
    },
    desactiver: (i, b) => {
      items[i].inp.disabled = b;
      items[i].lab.classList.toggle("off", b);
    },
    section: s,
  };
}

/** Cases à cocher. options = [[libellé, coché], ...]. onchange(indice, état). */
function cases(parent, titre, options, onchange) {
  const s = section(parent, titre);
  const items = options.map(([texte, coche], i) => {
    const lab = el("label", { class: "choix" }, s);
    const inp = el("input", { type: "checkbox" }, lab);
    inp.checked = coche;
    el("span", { html: texte }, lab);
    inp.addEventListener("change", () => onchange && onchange(i, inp.checked));
    return inp;
  });
  return {
    get: (i) => items[i].checked,
    set: (i, b, silencieux) => {
      items[i].checked = b;
      if (!silencieux && onchange) onchange(i, b);
    },
    section: s,
  };
}

function boutons(parent) { return el("div", { class: "boutons" }, parent); }
function bouton(parent, texte, onclick) {
  return el("button", { class: "b", html: texte, onclick }, parent);
}

/** En-tête du panneau de commandes. */
function entete(panneau, titre) {
  const haut = el("div", { class: "haut" }, panneau);
  el("a", { class: "retour", href: "animations.html", text: "← Animations" }, haut);
  el("span", { class: "etiquette", text: "MP* Malherbe" }, haut);
  // filigrane visible en permanence sur la zone de simulation
  const principal = document.getElementById("principal");
  if (principal) el("div", { class: "filigrane", text: "MP* Malherbe" }, principal);
  el("h1", { html: titre }, panneau);
}

// ---------------------------------------------------------------- canvas
/** Canvas qui remplit son conteneur et se redessine quand il change de taille. */
function canevas(conteneur, dessiner) {
  const cv = el("canvas", null, conteneur);
  const ctx = cv.getContext("2d");
  const obj = { cv, ctx, w: 1, h: 1, dessiner };
  function taille() {
    const r = conteneur.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    obj.w = Math.max(10, Math.floor(r.width));
    obj.h = Math.max(10, Math.floor(r.height));
    cv.width = Math.round(obj.w * dpr);
    cv.height = Math.round(obj.h * dpr);
    cv.style.width = obj.w + "px";
    cv.style.height = obj.h + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (obj.dessiner) obj.dessiner(obj);
  }
  obj.effacer = (fond) => {
    ctx.fillStyle = fond || "#fff";
    ctx.fillRect(0, 0, obj.w, obj.h);
  };
  new ResizeObserver(taille).observe(conteneur);
  taille();
  return obj;
}

function boucle(pas) {
  let t0 = null;
  function image(t) {
    const dt = t0 === null ? 0 : Math.min(0.1, (t - t0) / 1000);
    t0 = t;
    pas(dt);
    requestAnimationFrame(image);
  }
  requestAnimationFrame(image);
}

// ====================================================================== applet
/* Michelson: construction du schéma équivalent (source S', miroirs M1 et M'2).
   Géométrie (unités arbitraires, « cm » du schéma): séparatrice Sp sur la droite y = x,
   M1 horizontal (y = d1), M2 passant par (d2, 0) incliné d'un angle α sur la verticale. */

const COUL = { ch1: "#b3261e", ch2: "#2f62c8", fictif: "#7b2d8e", sep: "#0f6b67",
  miroir: "#111", gris: "#9aa3ad", vert: "#2e7d32" };

const p = { S: [-6.5, -0.6], A: [2.2, -6.8], d1: 4.0, d2: 5.0, alpha: 5,
  etape: 0, tau: 1, lecture: false, auto: false, pause: 0 };

// ---------------------------------------------------------------- vecteurs
const add = (a, b) => [a[0] + b[0], a[1] + b[1]];
const sub = (a, b) => [a[0] - b[0], a[1] - b[1]];
const mul = (a, k) => [a[0] * k, a[1] * k];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1];
const nrm = (a) => Math.hypot(a[0], a[1]);
const unit = (a) => mul(a, 1 / nrm(a));
const lerp = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
const dist = (a, b) => nrm(sub(a, b));

/** Image de P par la droite passant par O de direction u. */
function refl(P, O, u) {
  u = unit(u);
  const v = sub(P, O);
  return add(O, sub(mul(u, 2 * dot(v, u)), v));
}
/** Intersection de la droite (P1 P2) avec la droite (O, u): point et abscisse s sur (O, u). */
function inter(P1, P2, O, u) {
  const d = sub(P2, P1);
  const det = d[0] * (-u[1]) - (-u[0]) * d[1];
  if (Math.abs(det) < 1e-12) return null;
  const w = sub(O, P1);
  const t = (w[0] * (-u[1]) - (-u[0]) * w[1]) / det;
  const s = (d[0] * w[1] - d[1] * w[0]) / det;
  return { pt: add(P1, mul(d, t)), s };
}
const sym = (P) => [P[1], P[0]];           // image par la séparatrice (droite y = x)

// segments (abscisses le long de chaque droite)
const SP = { O: [0, 0], u: unit([1, 1]), a: -5.2, b: 5.0 };
function miroirs() {
  const a = p.alpha * Math.PI / 180;
  const u2 = [-Math.sin(a), Math.cos(a)];
  return {
    M1: { O: [0, p.d1], u: [1, 0], a: -3.6, b: 3.6, n: [0, 1] },
    M2: { O: [p.d2, 0], u: u2, a: -3.6, b: 3.4, n: [u2[1], -u2[0]] },
  };
}
const bout = (m, s) => add(m.O, mul(m.u, s));

/** Tous les points de la construction pour la position actuelle. */
function calculer() {
  const { M1, M2 } = miroirs();
  const S = p.S, A = p.A, S2 = sym(S);
  const g = { S, A, S2, M1, M2, ok: true, defaut: "" };
  // chemin 1: S -> I (Sp) -> J (M1) -> A
  const S2b = refl(S2, M1.O, M1.u);
  const j = inter(S2b, A, M1.O, M1.u);
  const i = j && inter(S2, j.pt, SP.O, SP.u);
  // chemin 2: S -> K (Sp) -> P (M2) -> N (Sp) -> A
  const A2 = sym(A), A3 = refl(A2, M2.O, M2.u);
  const pp = inter(S, A3, M2.O, M2.u);
  const n = pp && inter(pp.pt, A2, SP.O, SP.u);
  const k = pp && inter(S, pp.pt, SP.O, SP.u);
  if (!j || !i || !pp || !n || !k) { g.ok = false; g.defaut = "Construction impossible."; return g; }
  g.I = i.pt; g.J = j.pt; g.P = pp.pt; g.N = n.pt; g.K = k.pt; g.P2 = sym(g.P);
  const dans = (x, m) => x.s >= m.a && x.s <= m.b;
  if (!dans(j, M1)) g.defaut = "Le rayon 1 tombe hors du miroir M₁.";
  else if (!dans(pp, M2)) g.defaut = "Le rayon 2 tombe hors du miroir M₂.";
  else if (!dans(i, SP) || !dans(n, SP) || !dans(k, SP)) g.defaut = "Un rayon passe à côté de la séparatrice.";
  // longueurs
  const L = {};
  L.SI = dist(S, g.I); L.IJ = dist(g.I, g.J); L.JA = dist(g.J, A);
  L.SK = dist(S, g.K); L.KP = dist(g.K, g.P); L.PN = dist(g.P, g.N); L.NA = dist(g.N, A);
  L.S2I = dist(S2, g.I); L.S2J = dist(S2, g.J); L.S2K = dist(S2, g.K); L.KP2 = dist(g.K, g.P2);
  L.P2N = dist(g.P2, g.N); L.S2P2 = dist(S2, g.P2); L.P2A = dist(g.P2, A);
  L.ch1 = L.SI + L.IJ + L.JA; L.ch2 = L.SK + L.KP + L.PN + L.NA;
  g.L = L;
  return g;
}

// ---------------------------------------------------------------- étapes
const ETAPES = [
  { titre: "Le montage", duree: 1.2, texte:
    "Source ponctuelle <b>S</b>, séparatrice <b style='color:" + COUL.sep + "'>S<sub>p</sub></b> (à 45°), miroirs " +
    "<b>M<sub>1</sub></b> et <b>M<sub>2</sub></b>. On cherche les deux rayons issus de S qui arrivent en un point " +
    "<b>A</b> donné. <i>Faites glisser S, A, M<sub>1</sub> ou M<sub>2</sub> à la souris.</i>" },
  { titre: "Chemin 1", duree: 3, texte:
    "<b style='color:" + COUL.ch1 + "'>Chemin 1</b>: le rayon issu de S se <b>réfléchit</b> sur la séparatrice en I, " +
    "puis sur M<sub>1</sub> en J, et <b>traverse</b> la séparatrice jusqu'en A.<br>(SA)<sub>1</sub> = n (SI + IJ + JA)." },
  { titre: "Chemin 2", duree: 3.5, texte:
    "<b style='color:" + COUL.ch2 + "'>Chemin 2</b>: le rayon <b>traverse</b> la séparatrice en K, se réfléchit sur " +
    "M<sub>2</sub> en P, puis sur la séparatrice en N jusqu'en A.<br>(SA)<sub>2</sub> = n (SK + KP + PN + NA)." },
  { titre: "Source fictive S′", duree: 2.5, texte:
    "On remplace S par son <b>image S′ par la séparatrice</b>. Comme I est sur la séparatrice, SI = S′I, " +
    "et S′, I, J sont alignés (loi de la réflexion): (SA)<sub>1</sub> = n (S′J + JA)." },
  { titre: "Miroir fictif M′₂", duree: 3, texte:
    "On replie le bras de M<sub>2</sub>: <b>M′<sub>2</sub> image de M<sub>2</sub></b> et P′ image de P par la " +
    "séparatrice. SK = S′K, KP = KP′, PN = P′N, d'où (SA)<sub>2</sub> = n (S′K + KP′ + P′N + NA)." },
  { titre: "Chemins dépliés", duree: 3, texte:
    "S′, K, P′ sont alignés, ainsi que P′, N, A: (SA)<sub>2</sub> = n (S′P′ + P′A). " +
    "Les deux chemins sont maintenant de simples réflexions sur M<sub>1</sub> et M′<sub>2</sub>." },
  { titre: "Schéma équivalent", duree: 2.5, texte:
    "<b>Tout se passe comme si la source S′ éclairait les deux miroirs M<sub>1</sub> et M′<sub>2</sub></b>, " +
    "placés l'un derrière l'autre: δ = n (S′J + JA) − n (S′P′ + P′A).<br>Lame d'air d'épaisseur e si " +
    "M′<sub>2</sub> ∥ M<sub>1</sub> (α = 0), coin d'air d'angle α sinon." },
];

// ---------------------------------------------------------------- interface
const panneau = document.getElementById("panneau");
entete(panneau, "Michelson: construction du schéma équivalent");

const sEt = section(panneau, "Étapes");
const listeEt = el("div", { class: "etapes" }, sEt);
const boutonsEt = ETAPES.map((e, k) =>
  el("button", { class: "b etape", html: (k + 1) + ". " + e.titre, onclick: () => aller(k) }, listeEt));
const bt = boutons(sEt);
const bPrec = bouton(bt, "◀ Précédente", () => aller(p.etape - 1));
const bRej = bouton(bt, "⟲ Rejouer", () => aller(p.etape));
const bSuiv = bouton(bt, "Suivante ▶", () => aller(p.etape + 1));
const bAuto = bouton(bt, "▶ Tout enchaîner", () => {
  if (p.auto) { p.auto = false; majBoutons(); return; }
  p.auto = true; aller(p.etape === ETAPES.length - 1 ? 0 : p.etape);
});
const explication = el("div", { class: "info explication" }, section(panneau, "Explication"));
const longueurs = el("div", { class: "info mono" }, section(panneau, "Chemins optiques"));
const avert = el("div", { class: "erreur", style: "margin-top:4px" }, longueurs.parentNode);

const sReg = section(panneau, "Réglages");
const cD1 = curseur(sReg, { label: "Distance de M<sub>1</sub> à O", min: 2.5, max: 6, val: p.d1, pas: 0.05,
  onchange: (v) => { p.d1 = v; } });
const cD2 = curseur(sReg, { label: "Distance de M<sub>2</sub> à O", min: 2.5, max: 6.5, val: p.d2, pas: 0.05,
  onchange: (v) => { p.d2 = v; } });
const cAl = curseur(sReg, { label: "Inclinaison α de M<sub>2</sub> (°)", min: -10, max: 10, val: p.alpha, pas: 0.5,
  onchange: (v) => { p.alpha = v; } });
const bReg = boutons(sReg);
bouton(bReg, "Lame d'air (α = 0)", () => { cAl.set(0); });
bouton(bReg, "Position initiale", () => {
  p.S = [-6.5, -0.6]; p.A = [2.2, -6.8]; cD1.set(4.0); cD2.set(5.0); cAl.set(5);
});
el("div", { class: "note", html: "Glisser à la souris: la source S, le point A, les miroirs M<sub>1</sub> et M<sub>2</sub> " +
  "(translation)." }, sReg);

function majBoutons() {
  boutonsEt.forEach((b, k) => b.classList.toggle("actif", k === p.etape));
  bPrec.disabled = p.etape === 0; bSuiv.disabled = p.etape === ETAPES.length - 1;
  bAuto.innerHTML = p.auto ? "■ Arrêter" : "▶ Tout enchaîner";
  explication.innerHTML = "<b>" + (p.etape + 1) + ". " + ETAPES[p.etape].titre + "</b><br>" + ETAPES[p.etape].texte;
}
function aller(k) {
  if (k < 0 || k >= ETAPES.length) return;
  p.etape = k; p.tau = 0; p.lecture = true; p.pause = 0;
  majBoutons();
}

// ---------------------------------------------------------------- dessin
const zone = document.getElementById("z_schema");
let vue = null;                               // passage monde -> écran
const cv = canevas(zone, () => {});

function cadrer() {
  const xmin = -8.6, xmax = 7.6, ymin = -8.4, ymax = 7.2;
  const k = Math.min((cv.w - 20) / (xmax - xmin), (cv.h - 20) / (ymax - ymin));
  const ox = cv.w / 2 - k * (xmin + xmax) / 2, oy = cv.h / 2 + k * (ymin + ymax) / 2;
  vue = { k, X: (P) => [ox + k * P[0], oy - k * P[1]], inv: (x, y) => [(x - ox) / k, (oy - y) / k] };
}

function trait(ctx, pts, coul, larg, tirets, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha === undefined ? 1 : alpha;
  ctx.strokeStyle = coul; ctx.lineWidth = larg; ctx.lineJoin = "round"; ctx.lineCap = "round";
  ctx.setLineDash(tirets || []);
  ctx.beginPath();
  pts.forEach((P, i) => { const [x, y] = vue.X(P); if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y); });
  ctx.stroke();
  ctx.restore();
}
function fleche(ctx, A, B, coul, alpha) {      // petite flèche au milieu de [AB]
  if (dist(A, B) < 0.4) return;
  const [x1, y1] = vue.X(A), [x2, y2] = vue.X(B);
  const xm = x1 + 0.55 * (x2 - x1), ym = y1 + 0.55 * (y2 - y1), a = Math.atan2(y2 - y1, x2 - x1);
  ctx.save(); ctx.globalAlpha = alpha === undefined ? 1 : alpha; ctx.fillStyle = coul;
  ctx.translate(xm, ym); ctx.rotate(a);
  ctx.beginPath(); ctx.moveTo(7, 0); ctx.lineTo(-5, -4.5); ctx.lineTo(-2, 0); ctx.lineTo(-5, 4.5); ctx.closePath();
  ctx.fill(); ctx.restore();
}
/** Ligne brisée tracée jusqu'à la fraction f de sa longueur totale, avec flèches. */
function chemin(ctx, pts, f, coul, larg, alpha, tirets) {
  const segs = []; let tot = 0;
  for (let i = 1; i < pts.length; i++) { const l = dist(pts[i - 1], pts[i]); segs.push(l); tot += l; }
  let reste = f * tot; const vus = [pts[0]];
  for (let i = 1; i < pts.length && reste > 0; i++) {
    if (reste >= segs[i - 1]) { vus.push(pts[i]); reste -= segs[i - 1]; }
    else { vus.push(lerp(pts[i - 1], pts[i], reste / segs[i - 1])); reste = 0; }
  }
  trait(ctx, vus, coul, larg, tirets, alpha);
  if (!tirets) for (let i = 1; i < vus.length; i++) fleche(ctx, vus[i - 1], vus[i], coul, alpha);
}
function miroir(ctx, a, b, n, coul, alpha, tirets) {
  ctx.save(); ctx.globalAlpha = alpha === undefined ? 1 : alpha;
  const L = dist(a, b), u = unit(sub(b, a)), h = 0.32;
  ctx.strokeStyle = coul; ctx.lineWidth = 1;
  ctx.beginPath();
  for (let s = 0.15; s < L; s += 0.22) {
    const P = add(a, mul(u, s)), Q = add(add(P, mul(n, h)), mul(u, 0.22));
    const [x1, y1] = vue.X(P), [x2, y2] = vue.X(Q); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
  }
  ctx.stroke(); ctx.restore();
  trait(ctx, [a, b], coul, 3, tirets, alpha);
}
function point(ctx, P, coul, texte, dx, dy, alpha) {
  const [x, y] = vue.X(P);
  ctx.save(); ctx.globalAlpha = alpha === undefined ? 1 : alpha;
  ctx.fillStyle = coul; ctx.beginPath(); ctx.arc(x, y, 3.5, 0, 2 * Math.PI); ctx.fill();
  if (texte) { ctx.font = "italic 15px 'Times New Roman', serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(texte, x + dx, y + dy); }
  ctx.restore();
}
function texteMonde(ctx, P, txt, coul, dx, dy, taille, alpha) {
  const [x, y] = vue.X(P);
  ctx.save(); ctx.globalAlpha = alpha === undefined ? 1 : alpha; ctx.fillStyle = coul;
  ctx.font = (taille || 14) + "px system-ui, sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(txt, x + (dx || 0), y + (dy || 0)); ctx.restore();
}
/** Marque d'égalité (petits traits) au milieu d'un segment. */
function marque(ctx, A, B, nb, coul, alpha) {
  const M = lerp(A, B, 0.5), u = unit(sub(B, A)), n = [-u[1], u[0]];
  for (let i = 0; i < nb; i++) {
    const C = add(M, mul(u, (i - (nb - 1) / 2) * 0.14));
    trait(ctx, [add(C, mul(n, 0.16)), add(C, mul(n, -0.16))], coul, 1.6, null, alpha);
  }
}
const ease = (t) => t < 0 ? 0 : t > 1 ? 1 : t * t * (3 - 2 * t);
const f1 = (n) => fmt(n, 2);

function dessiner() {
  if (!vue) return;
  const ctx = cv.ctx; cv.effacer("#fff");
  const g = calculer();
  const e = p.etape, t = ease(p.tau);
  const { M1, M2 } = g;
  // facteur d'effacement des éléments réels à la dernière étape
  const fond = e === 6 ? 1 - 0.85 * t : (e === 5 ? 0.35 + 0.65 * (1 - t) : 1);
  const reel = e >= 5 ? 1 - 0.75 * (e === 5 ? t : 1) : 1;

  // séparatrice et miroirs
  const sepA = e === 6 ? 1 - 0.8 * t : 1;
  trait(ctx, [bout(SP, SP.a), bout(SP, SP.b)], COUL.sep, 5, null, sepA * 0.9);
  texteMonde(ctx, bout(SP, SP.a), "Sₚ", COUL.sep, 14, 14, 15, sepA);
  miroir(ctx, bout(M1, M1.a), bout(M1, M1.b), M1.n, COUL.miroir);
  texteMonde(ctx, bout(M1, M1.b), "M₁", COUL.miroir, 18, -2, 15);
  const m2A = e === 6 ? 1 - 0.8 * t : 1;
  if (e === 4) {     // repliement de M2 sur M'2
    const a = lerp(bout(M2, M2.a), sym(bout(M2, M2.a)), t), b = lerp(bout(M2, M2.b), sym(bout(M2, M2.b)), t);
    miroir(ctx, bout(M2, M2.a), bout(M2, M2.b), M2.n, COUL.miroir, 0.35);
    miroir(ctx, a, b, lerp(M2.n, sym(M2.n), t), COUL.fictif, 1, [7, 5]);
  } else miroir(ctx, bout(M2, M2.a), bout(M2, M2.b), M2.n, COUL.miroir, m2A);
  texteMonde(ctx, bout(M2, M2.a), "M₂", COUL.miroir, 16, 12, 15, m2A);
  if (e >= 5) {
    miroir(ctx, sym(bout(M2, M2.a)), sym(bout(M2, M2.b)), sym(M2.n), COUL.fictif, 1, [7, 5]);
    texteMonde(ctx, sym(bout(M2, M2.b)), "M′₂", COUL.fictif, 20, -4, 15);
  }

  if (!g.ok) { point(ctx, g.S, "#000", "S", -12, 0); point(ctx, g.A, "#000", "A", 0, 14); avert.textContent = g.defaut; return; }
  avert.textContent = g.defaut;
  const S = g.S, A = g.A, S2 = g.S2;

  // chemins réels
  const ch1 = [S, g.I, g.J, A], ch2 = [S, g.K, g.P, g.N, A];
  if (e >= 1) chemin(ctx, ch1, e === 1 ? t : 1, COUL.ch1, 2.2, e === 3 ? 1 : reel, e >= 5 ? [6, 5] : null);
  if (e >= 2) chemin(ctx, ch2, e === 2 ? t : 1, COUL.ch2, 2.2, e === 4 ? 1 : reel, e >= 5 ? [6, 5] : null);

  // étape 3: symétrie de S
  if (e >= 3) {
    const s2 = e === 3 ? lerp(S, S2, t) : S2;
    trait(ctx, [S, s2], COUL.fictif, 1.2, [2, 4], e === 6 ? 1 - t : 1);
    if (e <= 4) {
      trait(ctx, [s2, g.I], COUL.ch1, 2.2, [6, 5]);
      if (e === 3 && t > 0.98) { marque(ctx, S, g.I, 1, COUL.ch1); marque(ctx, S2, g.I, 1, COUL.ch1); }
    }
    point(ctx, s2, COUL.fictif, "S′", 0, 16);
  }
  // étape 4: repliement du chemin 2 (K -> P -> N)
  if (e === 4) {
    const p2 = lerp(g.P, g.P2, t);
    trait(ctx, [S2, g.K], COUL.ch2, 2.2, [6, 5], t);
    trait(ctx, [g.K, p2, g.N], COUL.ch2, 2.2, [6, 5]);
    trait(ctx, [g.P, p2], COUL.fictif, 1.2, [2, 4]);
    point(ctx, p2, COUL.ch2, "P′", 14, -10);
    if (t > 0.98) { marque(ctx, S, g.K, 2, COUL.ch2); marque(ctx, S2, g.K, 2, COUL.ch2);
      marque(ctx, g.K, g.P, 3, COUL.ch2); marque(ctx, g.K, g.P2, 3, COUL.ch2); }
  }
  // étapes 5 et 6: chemins dépliés
  if (e >= 5) {
    const f = e === 5 ? t : 1;
    chemin(ctx, [S2, g.J, A], f, COUL.ch1, 2.6, 1);
    chemin(ctx, [S2, g.P2, A], f, COUL.ch2, 2.6, 1);
    point(ctx, g.P2, COUL.ch2, "P′", 14, -10);
    if (e === 6) {
      // épaisseur e (sur la normale à M1 passant par O) et angle α
      const xe = 0;
      const m2a = sym(bout(M2, M2.a)), m2b = sym(bout(M2, M2.b));
      const yM2 = m2a[1] + (xe - m2a[0]) * (m2b[1] - m2a[1]) / (m2b[0] - m2a[0]);
      trait(ctx, [[xe, p.d1], [xe, yM2]], COUL.vert, 1.6, null, t);
      texteMonde(ctx, [xe, (p.d1 + yM2) / 2], "e", COUL.vert, -11, 0, 16, t);
    }
  }
  // points
  const aS = e === 6 ? 1 - 0.8 * t : 1;
  point(ctx, S, "#000", "S", -13, 0, aS);
  point(ctx, A, "#000", "A", 0, 15);
  if (e >= 1) { point(ctx, g.J, COUL.ch1, "J", -10, 13); if (e < 6) point(ctx, g.I, COUL.ch1, "I", -12, -8, reel); }
  if (e >= 2 && e < 6) { point(ctx, g.K, COUL.ch2, "K", 13, 8, reel); point(ctx, g.N, COUL.ch2, "N", -12, -9, reel); }
  if (e >= 2) point(ctx, g.P, COUL.ch2, "P", -13, 8, e === 6 ? 1 - 0.8 * t : reel);

  majLongueurs(g);
}

function majLongueurs(g) {
  const e = p.etape, r1 = "<b style='color:" + COUL.ch1 + "'>(SA)<sub>1</sub></b>", r2 = "<b style='color:" + COUL.ch2 + "'>(SA)<sub>2</sub></b>";
  const L = [];
  if (e >= 1) L.push(r1 + " = n (SI + IJ + JA)" + (e >= 3 ? " = n (S′J + JA)" : ""));
  if (e >= 2) {
    let l = r2 + " = n (SK + KP + PN + NA)";
    if (e >= 4) l += "<br>&nbsp;&nbsp;&nbsp;= n (S′K + KP′ + P′N + NA)";
    if (e >= 5) l += "<br>&nbsp;&nbsp;&nbsp;= n (S′P′ + P′A)";
    L.push(l);
    L.push("<b>δ = (SA)<sub>1</sub> − (SA)<sub>2</sub></b>" + (e >= 5 ? " = n [(S′J + JA) − (S′P′ + P′A)]" : ""));
  }
  if (e === 6) L.push(Math.abs(p.alpha) < 1e-9 ? "M′<sub>2</sub> ∥ M<sub>1</sub>: <b>lame d'air</b>" : "M′<sub>2</sub> incliné de α sur M<sub>1</sub>: <b>coin d'air</b>");
  longueurs.innerHTML = L.length ? L.join("<br>") : "<span class='note'>Les chemins apparaissent à l'étape 2.</span>";
}

// ---------------------------------------------------------------- souris
let prise = null;
function trouver(x, y) {
  const g = calculer(), { M1, M2 } = g;
  const proche = (P) => { const [u, v] = vue.X(P); return Math.hypot(u - x, v - y) < 14; };
  if (proche(p.S)) return "S";
  if (proche(p.A)) return "A";
  const P = vue.inv(x, y), tol = 10 / vue.k;
  const surSeg = (m) => { const s = dot(sub(P, m.O), m.u); const Q = add(m.O, mul(m.u, s));
    return s >= m.a && s <= m.b && dist(P, Q) < tol + 0.2; };
  if (surSeg(M1)) return "M1";
  if (surSeg(M2)) return "M2";
  return null;
}
cv.cv.addEventListener("pointerdown", (ev) => {
  const r = cv.cv.getBoundingClientRect();
  prise = trouver(ev.clientX - r.left, ev.clientY - r.top);
  if (prise) cv.cv.setPointerCapture(ev.pointerId);
});
cv.cv.addEventListener("pointermove", (ev) => {
  const r = cv.cv.getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
  if (!prise) { cv.cv.style.cursor = trouver(x, y) ? "grab" : "default"; return; }
  const P = vue.inv(x, y);
  const borne = (v, a, b) => Math.min(b, Math.max(a, v));
  if (prise === "S") p.S = [borne(P[0], -8.2, -3), borne(P[1], -3, 2.5)];
  if (prise === "A") p.A = [borne(P[0], -2.5, 5), borne(P[1], -8, -3)];
  if (prise === "M1") cD1.set(P[1]);
  if (prise === "M2") cD2.set(P[0] + Math.tan(p.alpha * Math.PI / 180) * P[1]);
});
cv.cv.addEventListener("pointerup", () => { prise = null; });

// ---------------------------------------------------------------- boucle
majBoutons();
cv.dessiner = () => { cadrer(); dessiner(); };
cadrer();
boucle((dt) => {
  if (p.lecture) {
    p.tau += dt / ETAPES[p.etape].duree;
    if (p.tau >= 1) {
      p.tau = 1;
      if (p.auto && p.etape < ETAPES.length - 1) {
        p.pause += dt;
        if (p.pause > 1.6) aller(p.etape + 1);
      } else { p.lecture = false; if (p.auto && p.etape === ETAPES.length - 1) { p.auto = false; majBoutons(); } }
    }
  }
  dessiner();
});
aller(0);
</script>
