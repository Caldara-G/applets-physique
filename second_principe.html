<style>
* { box-sizing: border-box; }

<body>
<div id="app">
  <div id="principal">
    <div class="ligne-zones" style="flex: 1.05">
      <div class="zone" id="z_boite" data-mt-nom="Billes" style="flex: 1.35"></div>

<script>
"use strict";
/* ======================================================================
   Bibliothèque commune aux applets (aucune dépendance externe)
   - interface: sections, curseurs (−/+, saisie, molette), boutons radio,
     cases à cocher, boutons
   - canvas: adaptation à la taille et à la résolution de l'écran,
     repères gradués, courbes, flèches, légendes
   - 3D: projection en perspective, rotation à la souris, tri en profondeur
   ====================================================================== */

// ---------------------------------------------------------------- DOM
function el(tag, attrs, parent) {
  const e = document.createElement(tag);
  if (attrs) {
    for (const k in attrs) {
      const v = attrs[k];
      if (k === "text") e.textContent = v;
      else if (k === "html") e.innerHTML = v;
      else if (k === "class") e.className = v;
      else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v);
    }
  }
  if (parent) parent.appendChild(e);
  return e;
}

/** Nombre écrit avec une virgule décimale. */
function fmt(v, d) {
  if (v === Infinity) return "∞";
  if (v === -Infinity) return "−∞";
  if (!isFinite(v)) return "—";
  let s = v.toFixed(d);
  if (/^-0(\.0*)?$/.test(s)) s = s.slice(1);
  return s.replace(".", ",").replace("-", "−");
}

function section(parent, titre) {
  const s = el("div", { class: "section" }, parent);
  if (titre) el("div", { class: "titre", html: titre }, s);
  return s;
}

/** Curseur avec boutons −/+, saisie au clavier et molette.
    o = {label, min, max, val, pas, dec, onchange} */
function curseur(parent, o) {
  const ligne = el("div", { class: "curseur" }, parent);
  const tete = el("div", { class: "tete" }, ligne);
  el("span", { html: o.label }, tete);
  const zone = el("span", { class: "valeur" }, tete);
  const moins = el("button", { class: "pm", text: "−", title: "diminuer" }, zone);
  const saisie = el("input", { type: "text", class: "saisie" }, zone);
  const plus = el("button", { class: "pm", text: "+", title: "augmenter" }, zone);
  const r = el("input", { type: "range", min: o.min, max: o.max, step: "any" }, ligne);
  const dec = o.dec !== undefined ? o.dec
    : Math.max(0, -Math.floor(Math.log10(o.pas) + 1e-9));
  let v = o.val;
  function borne(x) {
    x = Math.min(Math.max(x, o.min), o.max);
    return +(o.min + Math.round((x - o.min) / o.pas) * o.pas).toFixed(10);
  }
  function afficher() { r.value = v; saisie.value = fmt(v, dec); }
  function regler(x, silencieux) {
    x = borne(x);
    const change = Math.abs(x - v) > 1e-12;
    v = x;
    afficher();
    if (change && !silencieux && o.onchange) o.onchange(v);
  }
  r.addEventListener("input", () => regler(parseFloat(r.value)));
  saisie.addEventListener("change", () => {
    const x = parseFloat(saisie.value.replace(",", ".").replace("−", "-"));
    if (isFinite(x)) regler(x); else afficher();
  });
  saisie.addEventListener("keydown", (e) => { if (e.key === "Enter") saisie.blur(); });
  moins.addEventListener("click", () => regler(v - o.pas));
  plus.addEventListener("click", () => regler(v + o.pas));
  r.addEventListener("keydown", (e) => {
    const sauts = { ArrowRight: 1, ArrowUp: 1, ArrowLeft: -1, ArrowDown: -1,
                    PageUp: 10, PageDown: -10 };
    if (e.key in sauts) { e.preventDefault(); regler(v + sauts[e.key] * o.pas); }
  });
  ligne.addEventListener("wheel", (e) => {
    e.preventDefault();
    regler(v + (e.deltaY < 0 ? 1 : -1) * o.pas * (e.shiftKey ? 10 : 1));
  }, { passive: false });
  afficher();
  return {
    get: () => v,
    set: (x, silencieux) => regler(x, silencieux),
    ligne,
    montrer: (b) => { ligne.style.display = b ? "" : "none"; },
  };
}

/** Groupe de boutons radio. onchange(valeur, indice). */
function radios(parent, titre, options, actif, onchange) {
  const s = section(parent, titre);
  const nom = "r" + Math.random().toString(36).slice(2);
  const items = options.map((opt, i) => {
    const lab = el("label", { class: "choix" }, s);
    const inp = el("input", { type: "radio", name: nom }, lab);
    el("span", { html: opt }, lab);
    if (i === actif) inp.checked = true;
    inp.addEventListener("change", () => {
      if (inp.checked && onchange) onchange(opt, i);
    });
    return { inp, lab };
  });
  return {
    indice: () => items.findIndex((o) => o.inp.checked),
    valeur: () => options[items.findIndex((o) => o.inp.checked)],
    set: (i, silencieux) => {
      items[i].inp.checked = true;
      if (!silencieux && onchange) onchange(options[i], i);
    },
    desactiver: (i, b) => {
      items[i].inp.disabled = b;
      items[i].lab.classList.toggle("off", b);
    },
    section: s,
  };
}

/** Cases à cocher. options = [[libellé, coché], ...]. onchange(indice, état). */
function cases(parent, titre, options, onchange) {
  const s = section(parent, titre);
  const items = options.map(([texte, coche], i) => {
    const lab = el("label", { class: "choix" }, s);
    const inp = el("input", { type: "checkbox" }, lab);
    inp.checked = coche;
    el("span", { html: texte }, lab);
    inp.addEventListener("change", () => onchange && onchange(i, inp.checked));
    return inp;
  });
  return {
    get: (i) => items[i].checked,
    set: (i, b, silencieux) => {
      items[i].checked = b;
      if (!silencieux && onchange) onchange(i, b);
    },
    section: s,
  };
}

function boutons(parent) { return el("div", { class: "boutons" }, parent); }
function bouton(parent, texte, onclick) {
  return el("button", { class: "b", html: texte, onclick }, parent);
}

/** En-tête du panneau de commandes. */
function entete(panneau, titre) {
  const haut = el("div", { class: "haut" }, panneau);
  el("a", { class: "retour", href: "index.html", text: "← Sommaire" }, haut);
  el("span", { class: "etiquette", text: "MP* Malherbe" }, haut);
  // filigrane visible en permanence sur la zone de simulation
  const principal = document.getElementById("principal");
  if (principal) el("div", { class: "filigrane", text: "MP* Malherbe" }, principal);
  el("h1", { html: titre }, panneau);
}

// ---------------------------------------------------------------- canvas
/** Canvas qui remplit son conteneur et se redessine quand il change de taille. */
function canevas(conteneur, dessiner) {
  const cv = el("canvas", null, conteneur);
  const ctx = cv.getContext("2d");
  const obj = { cv, ctx, w: 1, h: 1, dessiner };
  function taille() {
    const r = conteneur.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    obj.w = Math.max(10, Math.floor(r.width));
    obj.h = Math.max(10, Math.floor(r.height));
    cv.width = Math.round(obj.w * dpr);
    cv.height = Math.round(obj.h * dpr);
    cv.style.width = obj.w + "px";
    cv.style.height = obj.h + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (obj.dessiner) obj.dessiner(obj);
  }
  obj.effacer = (fond) => {
    ctx.fillStyle = fond || "#fff";
    ctx.fillRect(0, 0, obj.w, obj.h);
  };
  new ResizeObserver(taille).observe(conteneur);
  taille();
  return obj;
}

function boucle(pas) {
  let t0 = null;
  function image(t) {
    const dt = t0 === null ? 0 : Math.min(0.1, (t - t0) / 1000);
    t0 = t;
    pas(dt);
    requestAnimationFrame(image);
  }
  requestAnimationFrame(image);
}
// ---------------------------------------------------------------- outils communs de dessin
function texteIndices(ctx, x, y, t, police, aligne) {
  const morceaux = []; let i = 0;
  while (i < t.length) {
    if (t[i] === "_") { if (t[i + 1] === "{") { const j = t.indexOf("}", i); morceaux.push([t.slice(i + 2, j), 1]); i = j + 1; }
      else { morceaux.push([t[i + 1], 1]); i += 2; } }
    else { let j = i; while (j < t.length && t[j] !== "_") j++; morceaux.push([t.slice(i, j), 0]); i = j; }
  }
  const taille = parseInt((police.match(/(\d+)px/) || [0, 14])[1]), petite = police.replace(/\d+px/, Math.round(taille * 0.7) + "px");
  let L = 0; morceaux.forEach(([m, ind]) => { ctx.font = ind ? petite : police; L += ctx.measureText(m).width; });
  let xx = aligne === "g" ? x : aligne === "d" ? x - L : x - L / 2; ctx.textAlign = "left";
  morceaux.forEach(([m, ind]) => { ctx.font = ind ? petite : police; ctx.fillText(m, xx, y + (ind ? taille * 0.3 : 0)); xx += ctx.measureText(m).width; });
}
function txt(ctx, x, y, t, coul, police, aligne) { ctx.save(); ctx.fillStyle = coul; texteIndices(ctx, x, y, t, police || "bold 14px system-ui", aligne); ctx.restore(); }
function fleche(ctx, x1, y1, x2, y2, coul, larg) {
  const a = Math.atan2(y2 - y1, x2 - x1), L = Math.hypot(x2 - x1, y2 - y1);
  if (L < 2) return;
  const t = Math.min(12, L * 0.6);
  ctx.save(); ctx.strokeStyle = coul; ctx.fillStyle = coul; ctx.lineWidth = larg || 2;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2 - 0.7 * t * Math.cos(a), y2 - 0.7 * t * Math.sin(a)); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x2, y2); ctx.lineTo(x2 - t * Math.cos(a - 0.4), y2 - t * Math.sin(a - 0.4));
  ctx.lineTo(x2 - t * Math.cos(a + 0.4), y2 - t * Math.sin(a + 0.4)); ctx.closePath(); ctx.fill(); ctx.restore();
}
function trace(ctx, pts, coul, larg, tirets) {
  if (pts.length < 2) return;
  ctx.save(); ctx.strokeStyle = coul; ctx.lineWidth = larg; ctx.setLineDash(tirets || []); ctx.beginPath();
  pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.stroke(); ctx.restore();
}
function seg(ctx, A, B, coul, larg, tirets) { trace(ctx, [A, B], coul, larg, tirets); }
function point(ctx, P, n, coul, dx, dy, r) {
  ctx.save(); ctx.fillStyle = coul; ctx.beginPath(); ctx.arc(P[0], P[1], r || 4, 0, 2 * Math.PI); ctx.fill(); ctx.restore();
  if (n) txt(ctx, P[0] + (dx || 0), P[1] + (dy || 0), n, coul, "bold 14px system-ui");
}
/** Glissière sans affichage de valeur numérique. */
function glissiere(parent, label, min, max, val, onchange) {
  const l = el("div", { class: "curseur" }, parent);
  el("div", { html: label }, l);
  const r = el("input", { type: "range", min, max, step: (max - min) / 500, value: val }, l);
  r.style.width = "100%"; r.addEventListener("input", () => onchange(parseFloat(r.value)));
  return { r, l };
}
const fr = (u, a, b) => Math.max(0, Math.min(1, (u - a) / (b - a)));
/** Interface standard des étapes. */
function interfaceEtapes(titre) {
  const panneau = document.getElementById("panneau");
  entete(panneau, titre);
  const sEt = section(panneau, "Étapes");
  const liste = el("div", { class: "etapes" }, sEt);
  const boutonsEt = ETAPES.map((e, k) => el("button", { class: "b etape", html: (k + 1) + ". " + e.titre, onclick: () => aller(k) }, liste));
  const bt = boutons(sEt);
  const bPrec = bouton(bt, "◀ Précédente", () => aller(p.etape - 1));
  bouton(bt, "⟲ Rejouer", () => aller(p.etape));
  const bSuiv = bouton(bt, "Suivante ▶", () => aller(p.etape + 1));
  const explication = el("div", { class: "info explication" }, section(panneau, "Raisonnement"));
  const maj = () => {
    boutonsEt.forEach((b, k) => b.classList.toggle("actif", k === p.etape));
    bPrec.disabled = p.etape === 0; bSuiv.disabled = p.etape === ETAPES.length - 1;
    explication.innerHTML = "<b>" + (p.etape + 1) + ". " + ETAPES[p.etape].titre + "</b><br>" + ETAPES[p.etape].texte;
  };
  return { panneau, sEt, bt, explication, maj };
}
// ====================================================================== applet
/* Aspect probabiliste du second principe : N billes réparties entre deux cases.
   Situations : deux cases identiques ; cases de volumes V1, V2 (détente de Joule) ;
   deux niveaux d'énergie -ε (case 1) et +ε (case 2) au contact d'un thermostat.
   Dans tous les cas, une bille est à l'équilibre dans la case 1 avec la probabilité q
   (q = 1/2, q = V1/(V1+V2) ou q = 1/(1+exp(-2ε/kT))).
   Règles : modèle 1 (chaque bille change de case : 1→2 avec 2p(1-q), 2→1 avec 2pq) ;
   modèle 2 (urne d'Ehrenfest généralisée : une bille au hasard, acceptation de Metropolis).
   Options : renversement du temps (on rejoue les tirages à l'envers), M réalisations simultanées. */

const COUL = { c1: "#1565c0", c2: "#e07b00", th: "#555", s: "#7b2d8e", su: "#2e7d32",
  bande: "rgba(120,120,120,0.13)", histo: "rgba(21,101,192,0.45)", bin: "#c62828", fond1: "#eef4fc", fond2: "#fdf3e7",
  autres: "rgba(21,101,192,0.16)", moy: "#111" };
const NMAX = 4000, LOGMAX = 3000000, NPTS = 50000;
const p = { lgN: 2, modele: 0, situation: 0, prob: 0.05, v1: 0.25, kT: 1, f0: 1, ips: 4, run: true,
  couleurDepart: false, theorie: true, bande: true, entropie: true, multi: false, M: 20 };

let N = 100, c = [], depart = [], pos = [], ancienne = [], tAnim = [];
let t = 0, N1 = 0, pasH = 1, hist1 = [], histS = [], histSu = [], histo = [], nHisto = 0, horloge = 0, acc = 0;
let journal = [], nJournal = 0, journalTronque = false, envers = false, messageEnvers = "";
let autres = [], histAutres = [], histMoy = [];
let lnFact = [0];
for (let k = 1; k <= NMAX; k++) lnFact[k] = lnFact[k - 1] + Math.log(k);
const lnC = (n, k) => lnFact[n] - lnFact[k] - lnFact[n - k];

// ---------------------------------------------------------------- probabilités
function q() {
  if (p.situation === 1) return p.v1;
  if (p.situation === 2) return 1 / (1 + Math.exp(-2 / p.kT));
  return 0.5;
}
/** Probabilités de passage par itération pour une bille : a (1→2) et b (2→1). */
function passages() {
  const qq = q();
  if (p.modele === 0) return { a: 2 * p.prob * (1 - qq), b: 2 * p.prob * qq };
  return { a: Math.min(1, (1 - qq) / qq), b: Math.min(1, qq / (1 - qq)) };   // Metropolis (bille tirée au hasard)
}
/** Facteur de relaxation par itération de la moyenne : ⟨N1⟩ - Nq ∝ r^t. */
function facteur() {
  const { a, b } = passages();
  return p.modele === 0 ? 1 - a - b : 1 - (a + b) / N;
}
function tau() { const r = Math.abs(facteur()); return r < 1e-9 ? 0.3 : -1 / Math.log(r); }
/** Entropie statistique S/k = ln Ω. Situation 1 : Ω compte aussi les positions (∝ V1^N1 V2^N2, référence V/2).
    Situation 2 : entropie du système (ln C) et de l'univers (système + thermostat, à une constante près). */
function entropies(n1) {
  const sys = lnC(N, n1), qq = q();
  if (p.situation === 0) return [sys, sys];
  const tot = sys + n1 * Math.log(2 * qq) + (N - n1) * Math.log(2 * (1 - qq));
  return p.situation === 1 ? [tot, tot] : [sys, tot];
}

// ---------------------------------------------------------------- interface
const panneau = document.getElementById("panneau");
entete(panneau, "Billes dans deux cases : aspect probabiliste du second principe");
el("div", { class: "info", html:
  "N billes, deux cases. On part d'un état « ordonné » (par exemple toutes les billes dans la case 1) et on laisse le hasard agir.<br>" +
  "Macroétat: N<sub>1</sub>. Nombre de microétats correspondants: <b>Ω = N! / (N<sub>1</sub>! N<sub>2</sub>!)</b>, " +
  "entropie statistique <b>S = k ln Ω</b>." }, section(panneau, "Modèle"));

const rS = radios(panneau, "Situation", ["Deux cases identiques", "Cases de volumes V<sub>1</sub> et V<sub>2</sub> (détente de Joule)",
  "Deux niveaux d'énergie −ε (case 1) et +ε (case 2), thermostat à T"], p.situation,
  (v, i) => { p.situation = i; majVisibilite(); raz(); });
const sSit = rS.section;
const cV = curseur(sSit, { label: "V<sub>1</sub> / (V<sub>1</sub> + V<sub>2</sub>)", min: 0.05, max: 0.95, val: p.v1, pas: 0.05, dec: 2,
  onchange: (v) => { p.v1 = v; raz(); } });
const cT = curseur(sSit, { label: "Température réduite kT/ε", min: 0.2, max: 5, val: p.kT, pas: 0.1, dec: 1,
  onchange: (v) => { p.kT = v; raz(); } });
const lSit = el("div", { class: "note" }, sSit);

const rM = radios(panneau, "Règle d'évolution", ["Modèle 1: chaque bille change de case avec la probabilité p",
  "Modèle 2: urne d'Ehrenfest (une bille au hasard)"], p.modele, (v, i) => { p.modele = i; majVisibilite(); raz(); });
const sR = section(panneau, "Réglages");
const cN = curseur(sR, { label: "log<sub>10</sub> N", min: 0.3, max: Math.log10(NMAX), val: p.lgN, pas: 0.1, dec: 1,

const lN = el("div", { class: "note" }, sR);
const cP = curseur(sR, { label: "Probabilité p de changer de case", min: 0.01, max: 0.5, val: p.prob, pas: 0.01, dec: 2,
  onchange: (v) => { p.prob = v; raz(); } });
const cF = curseur(sR, { label: "Fraction initiale N<sub>1</sub>(0)/N", min: 0, max: 1, val: p.f0, pas: 0.05, dec: 2,

curseur(sR, { label: "Itérations par seconde", min: 1, max: 500, val: p.ips, pas: 1, dec: 0, onchange: (v) => { p.ips = v; } });
el("div", { class: "note", text: "Jusqu'à 10 itérations par seconde, on voit les billes changer de case." }, sR);
const bb = boutons(sR);
const bP = bouton(bb, "❚❚ Pause", () => lecture(!p.run));

const bb2 = boutons(sR);
bouton(bb2, "p = 1/2", () => { rM.set(0, true); p.modele = 0; majVisibilite(); cP.set(0.5); raz(); });

bouton(bb2, "Grand système (N = 4000)", () => { cN.set(Math.log10(4000)); });

const sE = section(panneau, "Renverser le temps");
el("div", { class: "note", html: "On rejoue exactement les mêmes tirages, dans l'ordre inverse: chaque bille refait à l'envers " +
  "les changements de case qu'elle a subis." }, sE);

const bE = bouton(bbE, "◀ Renverser le temps", () => renverser());
const lE = el("div", { class: "note" }, sE);

const sMu = section(panneau, "Plusieurs réalisations");

cases(panneau, "Affichage", [["Couleur des billes selon leur case de départ", p.couleurDepart],

  ["Entropie S/k = ln Ω", p.entropie]], (i, b) => {

const res = el("div", { class: "info" }, section(panneau, "Mesures"));
el("div", { class: "info explication", html:
  "• L'état initial ordonné correspond à un seul microétat (Ω = 1, S = 0). L'équilibre N<sub>1</sub> ≈ N/2 en compte " +

function majVisibilite() {
  cV.montrer(p.situation === 1); cT.montrer(p.situation === 2); cP.montrer(p.modele === 0);
  cM.montrer(p.multi);
}
function lecture(b) { p.run = b; bP.innerHTML = p.run ? "❚❚ Pause" : "▶ Lecture"; }

// ---------------------------------------------------------------- simulation
const hasard = Math.random;
function nouvellePosition(i) { pos[i] = [0.06 + 0.88 * hasard(), 0.08 + 0.84 * hasard()]; }
function raz() {
  N = Math.max(2, Math.min(NMAX, Math.round(Math.pow(10, p.lgN))));
  const n1 = Math.round(p.f0 * N);
  c = []; depart = []; pos = []; ancienne = []; tAnim = [];
  for (let i = 0; i < N; i++) { c[i] = i < n1 ? 0 : 1; depart[i] = c[i]; nouvellePosition(i); ancienne[i] = null; tAnim[i] = -1; }
  t = 0; N1 = n1; pasH = 1;
  const [s0, su0] = entropies(N1);
  hist1 = [N1]; histS = [s0]; histSu = [su0]; histo = new Array(N + 1).fill(0); nHisto = 0;
  journal = []; nJournal = 0; journalTronque = false; envers = false; messageEnvers = "";
  autres = []; histAutres = []; histMoy = [N1];
  if (p.multi) for (let m = 1; m < p.M; m++) { autres.push(n1); histAutres.push([n1]); }
  const qq = q();
  lN.innerHTML = "N = " + N + " billes, N<sub>1</sub>(0) = " + n1;
  lSit.innerHTML = p.situation === 0 ? "" : "À l'équilibre, une bille est dans la case 1 avec la probabilité q = " + fmt(qq, 3) +
    (p.situation === 2 ? " = 1/(1 + e<sup>−2ε/kT</sup>)" : "");
  lE.innerHTML = "";
  bE.innerHTML = "◀ Renverser le temps";
  acc = 0;
  majVisibilite();
}
function deplacer(i, anime) {
  const avant = [c[i], pos[i][0], pos[i][1]];
  c[i] = 1 - c[i];
  N1 += c[i] === 0 ? 1 : -1;
  nouvellePosition(i);
  if (anime) { ancienne[i] = avant; tAnim[i] = horloge; } else { ancienne[i] = null; tAnim[i] = -1; }
}
/** Tirage binomial (exact pour n petit, approximation gaussienne sinon). */
function binomiale(n, pr) {
  if (n <= 0 || pr <= 0) return 0;
  if (pr >= 1) return n;
  if (n < 60) { let k = 0; for (let i = 0; i < n; i++) if (hasard() < pr) k++; return k; }
  let g = 0; for (let i = 0; i < 12; i++) g += hasard(); g -= 6;
  return Math.max(0, Math.min(n, Math.round(n * pr + g * Math.sqrt(n * pr * (1 - pr)))));
}
function evoluerAutre(n1) {
  const { a, b } = passages();
  if (p.modele === 0) return n1 - binomiale(n1, a) + binomiale(N - n1, b);
  const i = hasard() * N < n1;   // la bille tirée est dans la case 1 ?
  if (i) return hasard() < a ? n1 - 1 : n1;
  return hasard() < b ? n1 + 1 : n1;
}
function enregistrer() {
  t++;
  if (t % pasH === 0) {
    const [s, su] = entropies(N1);
    hist1.push(N1); histS.push(s); histSu.push(su);
    if (p.multi) {
      let somme = N1;
      autres.forEach((v, m) => { histAutres[m].push(v); somme += v; });
      histMoy.push(somme / (autres.length + 1));
    }
    if (hist1.length > NPTS) {   // mémoire limitée : on garde un point sur deux
      const moitie = (a) => a.filter((_, k) => k % 2 === 0);
      hist1 = moitie(hist1); histS = moitie(histS); histSu = moitie(histSu); histMoy = moitie(histMoy);
      histAutres = histAutres.map(moitie); pasH *= 2;
    }
  }
}
function iteration(anime) {
  const { a, b } = passages();
  const changes = [];
  if (p.modele === 0) {
    for (let i = 0; i < N; i++) if (hasard() < (c[i] === 0 ? a : b)) { deplacer(i, anime); changes.push(i); }
  } else {
    const i = Math.floor(hasard() * N);
    if (hasard() < (c[i] === 0 ? a : b)) { deplacer(i, anime); changes.push(i); }
  }
  // journal des tirages, pour pouvoir renverser le temps
  journal.push(Int32Array.from(changes)); nJournal += changes.length + 1;
  while (nJournal > LOGMAX && journal.length) { nJournal -= journal.shift().length + 1; journalTronque = true; }
  autres = autres.map(evoluerAutre);
  enregistrer();
  if (t > 3 * tau()) { histo[N1]++; nHisto++; }
}
function iterationEnvers(anime) {
  const changes = journal.pop();
  if (!changes) { finEnvers(); return; }
  nJournal -= changes.length + 1;
  for (const i of changes) deplacer(i, anime);
  enregistrer();
  if (!journal.length) finEnvers();
}
function finEnvers() {
  envers = false; lecture(false);
  messageEnvers = journalTronque ? "Retour à l'état d'il y a " + (LOGMAX / 1e6) + " millions de tirages (mémoire limitée)."
    : "Retour exact à l'état initial: N<sub>1</sub> = " + N1 + ".";
  lE.innerHTML = messageEnvers; bE.innerHTML = "◀ Renverser le temps";
}
function renverser() {
  if (envers) { envers = false; bE.innerHTML = "◀ Renverser le temps"; lE.innerHTML = "Renversement interrompu."; return; }
  if (!journal.length) { lE.innerHTML = "Rien à renverser: lancer d'abord la simulation."; return; }
  envers = true; lecture(true);
  bE.innerHTML = "■ Arrêter le renversement";
  lE.innerHTML = "Lecture à l'envers de " + journal.length + " itérations" +
    (p.multi ? " (seule la réalisation principale est renversée)." : ".");
}
function pas(anime) { if (envers) iterationEnvers(anime); else iteration(anime); }
const dureeAnim = () => Math.min(0.6, 0.8 / p.ips);

// ---------------------------------------------------------------- outils de tracé
function pasGradu(etendue, nb) {
  const brut = etendue / nb, e = Math.pow(10, Math.floor(Math.log10(brut))), m = brut / e;
  return (m < 1.5 ? 1 : m < 3.5 ? 2 : m < 7.5 ? 5 : 10) * e;
}
const decimales = (pas) => Math.max(0, -Math.floor(Math.log10(pas) + 1e-9));
/** Repère : cadre, graduations ; renvoie les fonctions de conversion. */
function repere(ctx, B, xmin, xmax, ymin, ymax, etx, ety, nbx, nby) {
  const X = (v) => B.x0 + (B.x1 - B.x0) * (v - xmin) / (xmax - xmin);
  const Y = (v) => B.y1 - (B.y1 - B.y0) * (v - ymin) / (ymax - ymin);
  ctx.save(); ctx.strokeStyle = "#333"; ctx.lineWidth = 1; ctx.strokeRect(B.x0, B.y0, B.x1 - B.x0, B.y1 - B.y0); ctx.restore();
  const px = pasGradu(xmax - xmin, nbx || 6), py = pasGradu(ymax - ymin, nby || 4);
  for (let v = Math.ceil(xmin / px) * px; v <= xmax + 1e-9; v += px) {
    seg(ctx, [X(v), B.y1], [X(v), B.y1 + 4], "#333", 1);
    seg(ctx, [X(v), B.y0], [X(v), B.y1], "#eceef1", 1);
    txt(ctx, X(v), B.y1 + 16, fmt(v, decimales(px)), "#333", "11px system-ui");
  }
  for (let v = Math.ceil(ymin / py) * py; v <= ymax + 1e-9; v += py) {
    seg(ctx, [B.x0 - 4, Y(v)], [B.x0, Y(v)], "#333", 1);
    seg(ctx, [B.x0, Y(v)], [B.x1, Y(v)], "#eceef1", 1);
    txt(ctx, B.x0 - 7, Y(v) + 4, fmt(v, decimales(py)), "#333", "11px system-ui", "d");
  }
  if (etx) txt(ctx, B.x1 - 135, B.y1 + 30, etx, "#333", "12px system-ui", "d");
  if (ety) txt(ctx, B.x0, B.y0 - 7, ety, "#333", "12px system-ui", "g");
  return { X, Y };
}
const nomCase = (j) => p.situation === 2 ? (j === 0 ? "niveau bas −ε" : "niveau haut +ε") : "case " + (j + 1);

// ---------------------------------------------------------------- dessin : les deux cases
const cvB = canevas(document.getElementById("z_boite"), () => {});
function dessinerBoite() {
  const ctx = cvB.ctx; cvB.effacer("#fff");
  const W = cvB.w, H = cvB.h, m = 14;
  let C;
  if (p.situation === 2) {   // niveaux d'énergie : niveau haut au-dessus
    const L = W - 2 * m - 140, h = (H - 3 * m - 10) / 2;
    C = [{ x: m + 140, y: 2 * m + 10 + h, w: L, h, fond: COUL.fond1 }, { x: m + 140, y: m + 5, w: L, h, fond: COUL.fond2 }];
    fleche(ctx, m, H - m, m, m + 4, "#555", 1.5);
    txt(ctx, m + 8, m + 12, "énergie", "#555", "12px system-ui", "g");
  } else {
    const haut = 56, h = H - haut - m, Lt = W - 3 * m;
    const f = p.situation === 1 ? p.v1 : 0.5;
    C = [{ x: m, y: haut, w: Lt * f, h, fond: COUL.fond1 }, { x: 2 * m + Lt * f, y: haut, w: Lt * (1 - f), h, fond: COUL.fond2 }];
  }
  C.forEach((k, j) => {
    ctx.fillStyle = k.fond; ctx.fillRect(k.x, k.y, k.w, k.h);
    ctx.save(); ctx.strokeStyle = "#333"; ctx.lineWidth = 2; ctx.strokeRect(k.x, k.y, k.w, k.h); ctx.restore();
    const n = j === 0 ? N1 : N - N1;
    const coul = j === 0 ? COUL.c1 : COUL.c2;
    if (p.situation === 2) {
      txt(ctx, k.x - 8, k.y + k.h / 2 - 4, nomCase(j), coul, "bold 13px system-ui", "d");
      txt(ctx, k.x - 8, k.y + k.h / 2 + 14, "N_" + (j + 1) + " = " + n, "#222", "bold 13px system-ui", "d");
    } else {
      txt(ctx, k.x + k.w / 2, 22, nomCase(j), coul, "bold 15px system-ui");
      txt(ctx, k.x + k.w / 2, 44, "N_" + (j + 1) + " = " + n + "  (" + fmt(100 * n / N, 0) + " %)", "#222", "bold 14px system-ui");
    }
  });
  const aire = C[0].w * C[0].h + C[1].w * C[1].h;
  const r = Math.max(1.6, Math.min(9, 0.32 * Math.sqrt(aire / Math.max(N, 1))));
  const P = (cc, u, v) => [C[cc].x + u * C[cc].w, C[cc].y + v * C[cc].h];
  for (let i = 0; i < N; i++) {
    let qq = P(c[i], pos[i][0], pos[i][1]);
    if (ancienne[i] && tAnim[i] >= 0) {
      const s = (horloge - tAnim[i]) / dureeAnim();
      if (s >= 1) { ancienne[i] = null; tAnim[i] = -1; }
      else {
        const a = P(ancienne[i][0], ancienne[i][1], ancienne[i][2]), e = s * s * (3 - 2 * s);
        const bosse = p.situation === 2 ? [Math.sin(Math.PI * e) * 0.15 * W, 0] : [0, -Math.sin(Math.PI * e) * 0.25 * H];
        qq = [a[0] + (qq[0] - a[0]) * e + bosse[0], a[1] + (qq[1] - a[1]) * e + bosse[1]];
      }
    }
    ctx.fillStyle = (p.couleurDepart ? depart[i] : c[i]) === 0 ? COUL.c1 : COUL.c2;
    ctx.beginPath(); ctx.arc(qq[0], qq[1], r, 0, 2 * Math.PI); ctx.fill();
  }
  if (envers) {
    ctx.save(); ctx.fillStyle = "rgba(198,40,40,0.9)"; ctx.fillRect(W / 2 - 110, H / 2 - 16, 220, 32); ctx.restore();
    txt(ctx, W / 2, H / 2 + 5, "◀ temps renversé", "#fff", "bold 15px system-ui");
  }
}

// ---------------------------------------------------------------- dessin : histogramme de N1
const cvH = canevas(document.getElementById("z_histo"), () => {});
function dessinerHisto() {
  const ctx = cvH.ctx; cvH.effacer("#fff");
  const W = cvH.w, H = cvH.h, qq = q(), s = Math.sqrt(N * qq * (1 - qq)), mu = N * qq;
  const lo = Math.max(0, Math.floor(mu - Math.max(5 * s, 2))), hi = Math.min(N, Math.ceil(mu + Math.max(5 * s, 2)));
  const bin = (k) => Math.exp(lnC(N, k) + k * Math.log(qq) + (N - k) * Math.log(1 - qq));
  let pmax = 0; for (let k = lo; k <= hi; k++) pmax = Math.max(pmax, bin(k));
  let fmax = 0; for (let k = lo; k <= hi; k++) fmax = Math.max(fmax, nHisto ? histo[k] / nHisto : 0);
  const ymax = 1.15 * Math.max(pmax, fmax);
  const B = { x0: 52, x1: W - 14, y0: 34, y1: H - 36 };
  const R = repere(ctx, B, lo - 0.5, hi + 0.5, 0, ymax, "N_1", "fréquence de N_1 à l'équilibre", 5, 4);
  const larg = Math.max(1, (B.x1 - B.x0) / (hi - lo + 1));
  for (let k = lo; k <= hi; k++) if (histo[k]) {
    const f = histo[k] / nHisto; ctx.fillStyle = COUL.histo;
    ctx.fillRect(R.X(k) - larg * 0.45, R.Y(f), larg * 0.9, R.Y(0) - R.Y(f));
  }
  if (hi - lo <= 80) { for (let k = lo; k <= hi; k++) point(ctx, [R.X(k), R.Y(bin(k))], "", COUL.bin, 0, 0, 2.5); }
  else { const pts = []; for (let k = lo; k <= hi; k++) pts.push([R.X(k), R.Y(bin(k))]); trace(ctx, pts, COUL.bin, 1.8); }
  txt(ctx, B.x1 - 4, B.y0 + 16, qq === 0.5 ? "loi binomiale C(N, N_1) / 2ᴺ" : "loi binomiale de paramètres N et q = " + fmt(qq, 3),
    COUL.bin, "bold 12px system-ui", "d");
  txt(ctx, B.x1 - 4, B.y0 + 32, nHisto ? nHisto + " itérations après 3τ" : "en attente de l'équilibre (t > 3τ)", "#555", "11px system-ui", "d");
}

// ---------------------------------------------------------------- dessin : N1(t), N2(t) et S(t)
const cvC = canevas(document.getElementById("z_courbes"), () => {});
function courbe(tab, R, f) {
  const pts = [], pas = Math.max(1, Math.floor(tab.length / 1500));
  for (let k = 0; k < tab.length; k += pas) pts.push([R.X(k * pasH), R.Y(f ? f(tab[k]) : tab[k])]);
  const k = tab.length - 1; pts.push([R.X(k * pasH), R.Y(f ? f(tab[k]) : tab[k])]);
  return pts;
}
function dessinerCourbes() {
  const ctx = cvC.ctx; cvC.effacer("#fff");
  const W = cvC.w, H = cvC.h, qq = q();
  const tmax = Math.max(t, Math.ceil(6 * tau()), 20);
  const deux = p.entropie;
  const Hc = deux ? (H - 20) * 0.6 : H;
  const B = { x0: 58, x1: W - 16, y0: 30, y1: Hc - 36 };
  const R = repere(ctx, B, 0, tmax, 0, N, deux ? "" : "itérations t", "nombre de billes", 8, 4);
  const sd = Math.sqrt(N * qq * (1 - qq)), mu = N * qq;
  if (p.bande) {
    ctx.fillStyle = COUL.bande;
    ctx.fillRect(B.x0, R.Y(mu + sd), B.x1 - B.x0, R.Y(mu - sd) - R.Y(mu + sd));
    ctx.fillRect(B.x0, R.Y(N - mu + sd), B.x1 - B.x0, R.Y(N - mu - sd) - R.Y(N - mu + sd));
    seg(ctx, [B.x0, R.Y(mu)], [B.x1, R.Y(mu)], "#999", 1, [4, 4]);
    seg(ctx, [B.x0, R.Y(N - mu)], [B.x1, R.Y(N - mu)], "#999", 1, [4, 4]);
  }
  if (p.multi) histAutres.forEach((h) => trace(ctx, courbe(h, R), COUL.autres, 1));
  trace(ctx, courbe(hist1, R), COUL.c1, 1.6);
  trace(ctx, courbe(hist1, R, (v) => N - v), COUL.c2, 1.6);
  if (p.multi) trace(ctx, courbe(histMoy, R), COUL.moy, 2.2);
  if (p.theorie) {
    const r = facteur(), a0 = hist1[0] - mu;
    const pt1 = [], pt2 = [];
    for (let i = 0; i <= 300; i++) { const tt = tmax * i / 300, m = mu + a0 * Math.pow(r, tt);
      pt1.push([R.X(tt), R.Y(m)]); pt2.push([R.X(tt), R.Y(N - m)]); }
    trace(ctx, pt1, COUL.th, 1.3, [6, 4]); trace(ctx, pt2, COUL.th, 1.3, [6, 4]);
  }
  let xl = B.x0 + 170;
  const leg = (texte, coul, police) => { txt(ctx, xl, B.y0 - 7, texte, coul, police || "bold 13px system-ui", "g");
    ctx.font = police || "bold 13px system-ui"; xl += ctx.measureText(texte.replace(/_/g, "")).width + 18; };
  leg("N_1(t)", COUL.c1); leg("N_2(t)", COUL.c2);
  if (p.multi) leg("moyenne des " + p.M + " réalisations", COUL.moy);
  if (p.theorie) leg("- - moyenne théorique", COUL.th, "12px system-ui");
  if (p.bande) leg("bande moyenne ± σ", "#888", "12px system-ui");
  if (!deux) return;
  // entropie
  const B2 = { x0: 58, x1: W - 16, y0: Hc + 16, y1: H - 36 };
  let Smax, SuMax, Smin = 0;
  if (p.situation === 0) { Smax = lnC(N, Math.floor(N / 2)); SuMax = Smax; }
  else {
    const k = Math.round(mu); SuMax = entropies(k)[1]; Smax = p.situation === 2 ? lnC(N, Math.floor(N / 2)) : SuMax;
    Smin = Math.min(0, ...[0, N].map((n1) => entropies(n1)[1]));
  }
  const ymax = Math.max(1, Smax, SuMax) * 1.12, ymin = Smin < 0 ? Smin * 1.05 : 0;
  const R2 = repere(ctx, B2, 0, tmax, ymin, ymax, "itérations t", p.situation === 2 ? "entropies / k" : "S / k = ln Ω", 8, 3);
  if (p.situation === 2) {
    seg(ctx, [B2.x0, R2.Y(SuMax)], [B2.x1, R2.Y(SuMax)], COUL.su, 1, [4, 4]);
    trace(ctx, courbe(histSu, R2), COUL.su, 1.6);
    trace(ctx, courbe(histS, R2), COUL.s, 1.6);
    txt(ctx, B2.x0 + 120, B2.y0 - 7, "système: ln C(N, N_1)", COUL.s, "bold 12px system-ui", "g");
    txt(ctx, B2.x0 + 290, B2.y0 - 7, "univers (système + thermostat): ln C(N, N_1) − E/kT + cte", COUL.su, "bold 12px system-ui", "g");
  } else {
    seg(ctx, [B2.x0, R2.Y(Smax)], [B2.x1, R2.Y(Smax)], COUL.s, 1, [4, 4]);
    const etiq = p.situation === 0
      ? "S_{max}/k = " + fmt(Smax, Smax < 10 ? 2 : 1) + " (N ln 2 = " + fmt(N * Math.LN2, N < 15 ? 2 : 1) + ")"
      : "S_{éq} − S_{0} ≈ N k ln((V_1 + V_2)/V_1) = " + fmt(-N * Math.log(qq), 1) + " k";
    txt(ctx, B2.x1 - 4, R2.Y(Smax) - 5, etiq, COUL.s, "12px system-ui", "d");
    trace(ctx, courbe(histS, R2), COUL.s, 1.6);
  }
}

// ---------------------------------------------------------------- mesures
function puissance10(lg) {
  if (lg < 6) return fmt(Math.pow(10, lg), 0);
  const e = Math.floor(lg), m = Math.pow(10, lg - e);
  return fmt(m, 2) + "·10<sup>" + e + "</sup>";
}
function mesures() {
  const qq = q(), lnO = lnC(N, N1), [s, su] = entropies(N1);
  const lgRetour = -N * Math.log10(qq);
  const annees = lgRetour - 6 - Math.log10(3.156e7);   // à un million d'itérations par seconde
  let html = "t = <b>" + t + "</b> itérations, N<sub>1</sub> = <b>" + N1 + "</b>, N<sub>2</sub> = <b>" + (N - N1) + "</b><br>" +
    "Ω = C(N, N<sub>1</sub>) = " + puissance10(lnO / Math.LN10) + " microétats";
  if (p.situation === 0) html += ", S/k = <b>" + fmt(s, 2) + "</b>";
  if (p.situation === 1) html += "<br>S/k = ln[Ω (2V<sub>1</sub>/V)<sup>N<sub>1</sub></sup> (2V<sub>2</sub>/V)<sup>N<sub>2</sub></sup>] = <b>" + fmt(s, 2) + "</b>";
  if (p.situation === 2) html += "<br>E = ε(N<sub>2</sub> − N<sub>1</sub>) = <b>" + (N - 2 * N1) + " ε</b>, ⟨E⟩<sub>éq</sub> = −N ε th(ε/kT) = " +
    fmt(-N * Math.tanh(1 / p.kT), 1) + " ε<br>S<sub>système</sub>/k = " + fmt(s, 2) + ", S<sub>univers</sub>/k = " + fmt(su, 2) + " (à une constante près)";
  html += "<br>Temps caractéristique de relaxation τ ≈ " + fmt(tau(), tau() < 10 ? 1 : 0) + " itérations<br>" +
    "Équilibre: ⟨N<sub>1</sub>⟩ = Nq = " + fmt(N * qq, 1) + ", σ = √(Nq(1−q)) = " + fmt(Math.sqrt(N * qq * (1 - qq)), 1) +
    ", σ/⟨N<sub>1</sub>⟩ = " + fmt(100 * Math.sqrt((1 - qq) / (N * qq)), 1) + " %<br>" +
    "Retour moyen à l'état « tout en case 1 »: 1/q<sup>N</sup> = " + puissance10(lgRetour) + " itérations" +
    (annees > 0 ? ", soit " + puissance10(annees) + " ans à un million d'itérations par seconde" : "");
  res.innerHTML = html;
}

// ---------------------------------------------------------------- boucle
raz();
boucle((dt) => {
  horloge += dt;
  if (p.run) {
    acc += dt * p.ips;
    let n = 0;
    const anime = p.ips <= 10;
    while (acc >= 1 && n < 5000) { pas(anime); acc -= 1; n++; if (!p.run) { acc = 0; break; } }
  }
  dessinerBoite(); dessinerHisto(); dessinerCourbes(); mesures();
});
