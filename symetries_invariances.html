<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Symétries et invariances — MP* Malherbe</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 13px; color: #222; background: #eef0f3;
}
#app { display: flex; height: 100vh; }
#principal { position: relative; flex: 1; display: flex; flex-direction: column; min-width: 0;
  padding: 8px; gap: 8px; }
.ligne-zones { display: flex; gap: 8px; min-height: 0; }
.zone { position: relative; flex: 1; min-height: 0; min-width: 0; background: #fff;
  border: 1px solid #d5d9df; border-radius: 6px; overflow: hidden; }
.zone canvas { position: absolute; left: 0; top: 0; touch-action: none; }
#panneau { width: 340px; flex: none; overflow-y: auto; background: #fff;
  border-left: 1px solid #d5d9df; padding: 10px 14px 20px; }
#panneau h1 { font-size: 16px; margin: 4px 0 2px; }
.retour { font-size: 12px; color: #4a6fa5; text-decoration: none; }
.retour:hover { text-decoration: underline; }
.section { margin: 8px 0; padding-bottom: 8px; border-bottom: 1px solid #eceef1; }
.section:last-child { border-bottom: none; }
.titre { font-weight: 600; margin-bottom: 4px; color: #333; }
.choix { display: flex; align-items: center; gap: 6px; padding: 1px 0; cursor: pointer;
  user-select: none; }
.choix input { margin: 0 2px 0 0; }
.choix.off { color: #aaa; cursor: default; }
.curseur { margin: 7px 0; }
.curseur .tete { display: flex; justify-content: space-between; align-items: center;
  gap: 6px; }
.curseur .valeur { display: flex; align-items: center; gap: 2px; flex: none; }
.saisie { width: 66px; text-align: right; font: inherit; padding: 1px 4px;
  border: 1px solid #c9cdd3; border-radius: 3px; }
.pm { width: 20px; height: 20px; padding: 0; border: 1px solid #c9cdd3;
  background: #f5f6f8; border-radius: 3px; cursor: pointer; line-height: 1; }
.pm:hover { background: #e6e9ee; }
input[type=range] { width: 100%; margin: 3px 0 0; accent-color: #3b6fb6; }
.boutons { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
button.b { padding: 5px 10px; border: 1px solid #b8bec8; background: #f3f4f6;
  border-radius: 4px; cursor: pointer; font: inherit; }
button.b:hover { background: #e4e7ec; }
button.b.actif { background: #dce7f7; border-color: #7f9fcf; }
.info { background: #f6f8fa; border: 1px solid #e1e4e8; border-radius: 4px;
  padding: 6px 8px; line-height: 1.5; }
.note { font-size: 11.5px; color: #666; font-style: italic; line-height: 1.4; }
.dialogue { position: fixed; inset: 0; background: rgba(0,0,0,0.3); display: none;
  align-items: center; justify-content: center; z-index: 10; }
.dialogue .boite { background: #fff; border-radius: 8px; padding: 16px 20px;
  min-width: 340px; box-shadow: 0 6px 30px rgba(0,0,0,0.25); }
.dialogue table td { padding: 3px 6px; }
.dialogue input[type=text] { width: 80px; font: inherit; padding: 2px 4px; }
.erreur { color: #c62828; }
@media (max-width: 900px) {
  #app { flex-direction: column; height: auto; }
  #principal { height: 75vh; }
  #panneau { width: 100%; border-left: none; border-top: 1px solid #d5d9df; }
}
.haut { display: flex; justify-content: space-between; align-items: center; }
.etiquette { font-size: 11.5px; font-weight: 600; color: #fff; background: #3b5f96;
  border-radius: 10px; padding: 2px 9px; letter-spacing: 0.02em; }
.filigrane { position: absolute; right: 16px; bottom: 14px; z-index: 5; pointer-events: none;
  font-size: 13px; font-weight: 700; color: #3b5f96; background: rgba(255,255,255,0.82);
  border: 1px solid rgba(59,95,150,0.35); border-radius: 12px; padding: 3px 11px; }
.etapes { display: flex; flex-direction: column; gap: 3px; margin-bottom: 4px; }
button.b.etape { text-align: left; padding: 4px 8px; }
button.b:disabled { opacity: 0.45; cursor: default; }
.explication { line-height: 1.55; }
</style>
</head>
<body>
<div id="app">
  <div id="principal">
    <div class="zone" id="z_vue" data-mt-nom="Schéma" style="flex: 1"></div>
  </div>
  <div id="panneau"></div>
</div>
<script>
"use strict";
/* ======================================================================
   Bibliothèque commune aux applets (aucune dépendance externe)
   - interface: sections, curseurs (−/+, saisie, molette), boutons radio,
     cases à cocher, boutons
   - canvas: adaptation à la taille et à la résolution de l'écran,
     repères gradués, courbes, flèches, légendes
   - 3D: projection en perspective, rotation à la souris, tri en profondeur
   ====================================================================== */

// ---------------------------------------------------------------- DOM
function el(tag, attrs, parent) {
  const e = document.createElement(tag);
  if (attrs) {
    for (const k in attrs) {
      const v = attrs[k];
      if (k === "text") e.textContent = v;
      else if (k === "html") e.innerHTML = v;
      else if (k === "class") e.className = v;
      else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v);
    }
  }
  if (parent) parent.appendChild(e);
  return e;
}

/** Nombre écrit avec une virgule décimale. */
function fmt(v, d) {
  if (v === Infinity) return "∞";
  if (v === -Infinity) return "−∞";
  if (!isFinite(v)) return "—";
  let s = v.toFixed(d);
  if (/^-0(\.0*)?$/.test(s)) s = s.slice(1);
  return s.replace(".", ",").replace("-", "−");
}

function section(parent, titre) {
  const s = el("div", { class: "section" }, parent);
  if (titre) el("div", { class: "titre", html: titre }, s);
  return s;
}

/** Curseur avec boutons −/+, saisie au clavier et molette.
    o = {label, min, max, val, pas, dec, onchange} */
function curseur(parent, o) {
  const ligne = el("div", { class: "curseur" }, parent);
  const tete = el("div", { class: "tete" }, ligne);
  el("span", { html: o.label }, tete);
  const zone = el("span", { class: "valeur" }, tete);
  const moins = el("button", { class: "pm", text: "−", title: "diminuer" }, zone);
  const saisie = el("input", { type: "text", class: "saisie" }, zone);
  const plus = el("button", { class: "pm", text: "+", title: "augmenter" }, zone);
  const r = el("input", { type: "range", min: o.min, max: o.max, step: "any" }, ligne);
  const dec = o.dec !== undefined ? o.dec
    : Math.max(0, -Math.floor(Math.log10(o.pas) + 1e-9));
  let v = o.val;
  function borne(x) {
    x = Math.min(Math.max(x, o.min), o.max);
    return +(o.min + Math.round((x - o.min) / o.pas) * o.pas).toFixed(10);
  }
  function afficher() { r.value = v; saisie.value = fmt(v, dec); }
  function regler(x, silencieux) {
    x = borne(x);
    const change = Math.abs(x - v) > 1e-12;
    v = x;
    afficher();
    if (change && !silencieux && o.onchange) o.onchange(v);
  }
  r.addEventListener("input", () => regler(parseFloat(r.value)));
  saisie.addEventListener("change", () => {
    const x = parseFloat(saisie.value.replace(",", ".").replace("−", "-"));
    if (isFinite(x)) regler(x); else afficher();
  });
  saisie.addEventListener("keydown", (e) => { if (e.key === "Enter") saisie.blur(); });
  moins.addEventListener("click", () => regler(v - o.pas));
  plus.addEventListener("click", () => regler(v + o.pas));
  r.addEventListener("keydown", (e) => {
    const sauts = { ArrowRight: 1, ArrowUp: 1, ArrowLeft: -1, ArrowDown: -1,
                    PageUp: 10, PageDown: -10 };
    if (e.key in sauts) { e.preventDefault(); regler(v + sauts[e.key] * o.pas); }
  });
  ligne.addEventListener("wheel", (e) => {
    e.preventDefault();
    regler(v + (e.deltaY < 0 ? 1 : -1) * o.pas * (e.shiftKey ? 10 : 1));
  }, { passive: false });
  afficher();
  return {
    get: () => v,
    set: (x, silencieux) => regler(x, silencieux),
    ligne,
    montrer: (b) => { ligne.style.display = b ? "" : "none"; },
  };
}

/** Groupe de boutons radio. onchange(valeur, indice). */
function radios(parent, titre, options, actif, onchange) {
  const s = section(parent, titre);
  const nom = "r" + Math.random().toString(36).slice(2);
  const items = options.map((opt, i) => {
    const lab = el("label", { class: "choix" }, s);
    const inp = el("input", { type: "radio", name: nom }, lab);
    el("span", { html: opt }, lab);
    if (i === actif) inp.checked = true;
    inp.addEventListener("change", () => {
      if (inp.checked && onchange) onchange(opt, i);
    });
    return { inp, lab };
  });
  return {
    indice: () => items.findIndex((o) => o.inp.checked),
    valeur: () => options[items.findIndex((o) => o.inp.checked)],
    set: (i, silencieux) => {
      items[i].inp.checked = true;
      if (!silencieux && onchange) onchange(options[i], i);
    },
    desactiver: (i, b) => {
      items[i].inp.disabled = b;
      items[i].lab.classList.toggle("off", b);
    },
    section: s,
  };
}

/** Cases à cocher. options = [[libellé, coché], ...]. onchange(indice, état). */
function cases(parent, titre, options, onchange) {
  const s = section(parent, titre);
  const items = options.map(([texte, coche], i) => {
    const lab = el("label", { class: "choix" }, s);
    const inp = el("input", { type: "checkbox" }, lab);
    inp.checked = coche;
    el("span", { html: texte }, lab);
    inp.addEventListener("change", () => onchange && onchange(i, inp.checked));
    return inp;
  });
  return {
    get: (i) => items[i].checked,
    set: (i, b, silencieux) => {
      items[i].checked = b;
      if (!silencieux && onchange) onchange(i, b);
    },
    section: s,
  };
}

function boutons(parent) { return el("div", { class: "boutons" }, parent); }
function bouton(parent, texte, onclick) {
  return el("button", { class: "b", html: texte, onclick }, parent);
}

/** En-tête du panneau de commandes. */
function entete(panneau, titre) {
  const haut = el("div", { class: "haut" }, panneau);
  el("a", { class: "retour", href: "animations.html", text: "← Animations" }, haut);
  el("span", { class: "etiquette", text: "MP* Malherbe" }, haut);
  // filigrane visible en permanence sur la zone de simulation
  const principal = document.getElementById("principal");
  if (principal) el("div", { class: "filigrane", text: "MP* Malherbe" }, principal);
  el("h1", { html: titre }, panneau);
}

// ---------------------------------------------------------------- canvas
/** Canvas qui remplit son conteneur et se redessine quand il change de taille. */
function canevas(conteneur, dessiner) {
  const cv = el("canvas", null, conteneur);
  const ctx = cv.getContext("2d");
  const obj = { cv, ctx, w: 1, h: 1, dessiner };
  function taille() {
    const r = conteneur.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    obj.w = Math.max(10, Math.floor(r.width));
    obj.h = Math.max(10, Math.floor(r.height));
    cv.width = Math.round(obj.w * dpr);
    cv.height = Math.round(obj.h * dpr);
    cv.style.width = obj.w + "px";
    cv.style.height = obj.h + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (obj.dessiner) obj.dessiner(obj);
  }
  obj.effacer = (fond) => {
    ctx.fillStyle = fond || "#fff";
    ctx.fillRect(0, 0, obj.w, obj.h);
  };
  new ResizeObserver(taille).observe(conteneur);
  taille();
  return obj;
}

function boucle(pas) {
  let t0 = null;
  function image(t) {
    const dt = t0 === null ? 0 : Math.min(0.1, (t - t0) / 1000);
    t0 = t;
    pas(dt);
    requestAnimationFrame(image);
  }
  requestAnimationFrame(image);
}

// ====================================================================== applet
/* Symétries et invariances: direction du champ E (vrai vecteur) ou B (pseudo-vecteur)
   créé par quelques distributions classiques. Vue 3D orientable à la souris. */

const COUL = { sym: "#2e7d32", anti: "#c62828", champ: "#1f5fbf", dist: "#e67e22", axe: "#555", M: "#111" };
const p = { cas: "fil", champ: "B", etape: 0, tau: 1, az: -0.6, el: 0.35, temps: 0 };

// base locale cylindrique pour M sur l'axe (Ox): u_r = ex, u_θ = ey, u_z = ez
const CAS = {
  fil: {
    nom: "Fil rectiligne infini", M: [1.3, 0, 0],
    base: [["u_r", [1, 0, 0]], ["u_θ", [0, 1, 0]], ["u_z", [0, 0, 1]]],
    src: { E: "fil uniformément chargé (densité linéique λ)", B: "fil parcouru par un courant I" },
    inv: { texte: "La distribution est invariante par <b>translation selon (Oz)</b> et par <b>rotation autour de (Oz)</b>: en coordonnées cylindriques, les composantes du champ ne dépendent que de <b>r</b>.", mouv: "translation+rotation" },
    plans: {
      E: [["sym", [0, 1, 0], "(M, u<sub>r</sub>, u<sub>z</sub>), qui contient le fil, est un plan de <b>symétrie</b> des charges", "E appartient à ce plan: pas de composante selon u<sub>θ</sub>."],
          ["sym", [0, 0, 1], "(M, u<sub>r</sub>, u<sub>θ</sub>), perpendiculaire au fil, est aussi un plan de <b>symétrie</b> des charges", "E appartient aussi à ce plan: pas de composante selon u<sub>z</sub>."]],
      B: [["sym", [0, 1, 0], "(M, u<sub>r</sub>, u<sub>z</sub>), qui contient le fil et donc le courant, est un plan de <b>symétrie</b> des courants", "B est perpendiculaire à ce plan: B est porté par u<sub>θ</sub>."],
          ["anti", [0, 0, 1], "(M, u<sub>r</sub>, u<sub>θ</sub>), perpendiculaire au fil, est un plan d'<b>antisymétrie</b> des courants (le symétrique du courant est opposé)", "B appartient à ce plan: c'est compatible avec B selon u<sub>θ</sub>."]],
    },
    dir: { E: [1, 0, 0], B: [0, 1, 0] }, concl: { E: "E(M) = E(r) u<sub>r</sub>", B: "B(M) = B(r) u<sub>θ</sub>" },
  },
  spire: {
    nom: "Spire circulaire (point de l'axe)", M: [0, 0, 1.0],
    base: [["u_x", [1, 0, 0]], ["u_y", [0, 1, 0]], ["u_z", [0, 0, 1]]],
    src: { E: "anneau uniformément chargé", B: "spire parcourue par un courant I" },
    inv: { texte: "La distribution est invariante par <b>rotation autour de (Oz)</b>. Pour un point M de l'axe, tous les plans contenant l'axe jouent le même rôle.", mouv: "rotation" },
    plans: {
      E: [["sym", [0, 1, 0], "(M, u<sub>x</sub>, u<sub>z</sub>), qui contient l'axe, est un plan de <b>symétrie</b> des charges", "E appartient à ce plan."],
          ["sym", [1, 0, 0], "(M, u<sub>y</sub>, u<sub>z</sub>), qui contient aussi l'axe, est un autre plan de <b>symétrie</b>", "E appartient aux deux plans, donc à leur intersection: l'axe (Oz)."]],
      B: [["anti", [0, 1, 0], "(M, u<sub>x</sub>, u<sub>z</sub>), qui contient l'axe, est un plan d'<b>antisymétrie</b> des courants (les courants lui sont perpendiculaires)", "B appartient à ce plan."],
          ["anti", [1, 0, 0], "(M, u<sub>y</sub>, u<sub>z</sub>), qui contient aussi l'axe, est un autre plan d'<b>antisymétrie</b>", "B appartient aux deux plans, donc à leur intersection: l'axe (Oz)."]],
    },
    dir: { E: [0, 0, 1], B: [0, 0, 1] }, concl: { E: "E(M) = E(z) u<sub>z</sub> sur l'axe", B: "B(M) = B(z) u<sub>z</sub> sur l'axe" },
  },
  plan: {
    nom: "Plan infini", M: [0, 0, 1.0],
    base: [["u_x", [1, 0, 0]], ["u_y", [0, 1, 0]], ["u_z", [0, 0, 1]]],
    src: { E: "plan uniformément chargé (densité surfacique σ)", B: "nappe de courant uniforme selon u<sub>x</sub>" },
    inv: { texte: "La distribution est invariante par <b>translation selon (Ox) et selon (Oy)</b>: les composantes du champ ne dépendent que de <b>z</b>.", mouv: "translation xy" },
    plans: {
      E: [["sym", [1, 0, 0], "(M, u<sub>y</sub>, u<sub>z</sub>) est un plan de <b>symétrie</b> des charges", "E appartient à ce plan."],
          ["sym", [0, 1, 0], "(M, u<sub>x</sub>, u<sub>z</sub>) est aussi un plan de <b>symétrie</b>", "E appartient à l'intersection des deux plans: il est porté par u<sub>z</sub>."]],
      B: [["sym", [0, 1, 0], "(M, u<sub>x</sub>, u<sub>z</sub>), qui contient la direction du courant, est un plan de <b>symétrie</b> des courants", "B est perpendiculaire à ce plan: B est porté par u<sub>y</sub>."],
          ["anti", [1, 0, 0], "(M, u<sub>y</sub>, u<sub>z</sub>), perpendiculaire au courant, est un plan d'<b>antisymétrie</b>", "B appartient à ce plan: c'est compatible avec B selon u<sub>y</sub>."]],
    },
    dir: { E: [0, 0, 1], B: [0, -1, 0] }, concl: { E: "E(M) = E(z) u<sub>z</sub>", B: "B(M) = B(z) u<sub>y</sub>" },
  },
  solenoide: {
    nom: "Solénoïde infini", M: [0.55, 0, 0.3],
    base: [["u_r", [1, 0, 0]], ["u_θ", [0, 1, 0]], ["u_z", [0, 0, 1]]],
    src: { B: "solénoïde infini parcouru par un courant I" },
    inv: { texte: "La distribution est invariante par <b>translation selon (Oz)</b> et par <b>rotation autour de (Oz)</b>: les composantes du champ ne dépendent que de <b>r</b>.", mouv: "translation+rotation" },
    plans: {
      B: [["sym", [0, 0, 1], "(M, u<sub>r</sub>, u<sub>θ</sub>), perpendiculaire à l'axe et parallèle aux spires, est un plan de <b>symétrie</b> des courants", "B est perpendiculaire à ce plan: B est porté par u<sub>z</sub>."],
          ["anti", [0, 1, 0], "(M, u<sub>r</sub>, u<sub>z</sub>), qui contient l'axe, est un plan d'<b>antisymétrie</b> des courants", "B appartient à ce plan: c'est compatible avec B selon u<sub>z</sub>."]],
    },
    dir: { B: [0, 0, 1] }, concl: { B: "B(M) = B(r) u<sub>z</sub>" },
  },
};
const REGLE = "<b>E</b> (vrai vecteur) appartient aux plans de symétrie et est perpendiculaire aux plans d'antisymétrie; " +
  "<b>B</b> (pseudo-vecteur) est perpendiculaire aux plans de symétrie et appartient aux plans d'antisymétrie.";

const ETAPES = ["La distribution", "Invariances", "Premier plan", "Second plan", "Conclusion"];

// ---------------------------------------------------------------- interface
const panneau = document.getElementById("panneau");
entete(panneau, "Symétries et invariances");
const rCas = radios(panneau, "Distribution", Object.values(CAS).map((c) => c.nom), 0, (v, i) => {
  p.cas = Object.keys(CAS)[i];
  if (!CAS[p.cas].plans[p.champ]) { p.champ = "B"; rCh.set(1, true); }
  rCh.desactiver(0, !CAS[p.cas].plans.E); aller(0);
});
const rCh = radios(panneau, "Champ étudié", ["champ électrique <b>E</b> (charges)", "champ magnétique <b>B</b> (courants)"], 1,
  (v, i) => { p.champ = i === 0 ? "E" : "B"; aller(0); });
const sEt = section(panneau, "Étapes");
const listeEt = el("div", { class: "etapes" }, sEt);
const boutonsEt = ETAPES.map((t, k) =>
  el("button", { class: "b etape", html: (k + 1) + ". " + t, onclick: () => aller(k) }, listeEt));
const bt = boutons(sEt);
const bPrec = bouton(bt, "◀ Précédente", () => aller(p.etape - 1));
bouton(bt, "⟲ Rejouer", () => aller(p.etape));
const bSuiv = bouton(bt, "Suivante ▶", () => aller(p.etape + 1));
const explication = el("div", { class: "info explication" }, section(panneau, "Raisonnement"));
const sRg = section(panneau, "Règle");
el("div", { class: "info", html: REGLE }, sRg);
el("div", { class: "note", html: "Faire glisser la souris sur le schéma pour changer le point de vue." }, sRg);

function texteEtape() {
  const c = CAS[p.cas], f = p.champ, pl = c.plans[f], e = p.etape;
  const L = ["On étudie le champ <b>" + f + "</b> créé en M par un " + c.src[f] + "."];
  if (e >= 1) L.push("<b>Invariances.</b> " + c.inv.texte.replace(/champ/g, "champ " + f));
  if (e >= 2) L.push("<b style='color:" + (pl[0][0] === "sym" ? COUL.sym : COUL.anti) + "'>Plan 1.</b> Le plan " + pl[0][2] + ". " + pl[0][3]);
  if (e >= 3) L.push("<b style='color:" + (pl[1][0] === "sym" ? COUL.sym : COUL.anti) + "'>Plan 2.</b> Le plan " + pl[1][2] + ". " + pl[1][3]);
  if (e >= 4) L.push("<b style='color:" + COUL.champ + "'>Conclusion:</b> <b>" + c.concl[f] + "</b>. Les symétries ne donnent que la direction: la composante, et donc le sens, se déterminent ensuite (théorème de Gauss, d'Ampère ou calcul direct). La flèche dessinée indique le sens obtenu pour des charges positives ou pour le sens du courant représenté.");
  return L.join("<br><br>");
}
function majBoutons() {
  boutonsEt.forEach((b, k) => b.classList.toggle("actif", k === p.etape));
  bPrec.disabled = p.etape === 0; bSuiv.disabled = p.etape === ETAPES.length - 1;
  explication.innerHTML = texteEtape();
}
function aller(k) {
  if (k < 0 || k >= ETAPES.length) return;
  p.etape = k; p.tau = 0; p.temps = 0; majBoutons();
}

// ---------------------------------------------------------------- 3D
const cv = canevas(document.getElementById("z_vue"), () => {});
function proj(P) {
  const ca = Math.cos(p.az), sa = Math.sin(p.az), ce = Math.cos(p.el), se = Math.sin(p.el);
  const xr = P[0] * ca - P[1] * sa, yr = P[0] * sa + P[1] * ca;
  const k = Math.min(cv.w, cv.h) / 5.2;
  return [cv.w / 2 + k * xr, cv.h / 2 + 30 - k * (P[2] * ce + yr * se)];
}
const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const mul = (a, s) => [a[0] * s, a[1] * s, a[2] * s];
function seg(ctx, A, B, coul, larg, tirets, alpha) {
  const [x1, y1] = proj(A), [x2, y2] = proj(B);
  ctx.save(); ctx.globalAlpha = alpha === undefined ? 1 : alpha; ctx.strokeStyle = coul; ctx.lineWidth = larg || 1.5;
  ctx.setLineDash(tirets || []); ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); ctx.restore();
}
function fleche(ctx, A, u, coul, larg, texte, alpha) {
  const B = add(A, u), [x1, y1] = proj(A), [x2, y2] = proj(B);
  const L = Math.hypot(x2 - x1, y2 - y1); if (L < 4) return;
  const a = Math.atan2(y2 - y1, x2 - x1), h = Math.min(13, 0.4 * L);
  ctx.save(); ctx.globalAlpha = alpha === undefined ? 1 : alpha; ctx.strokeStyle = coul; ctx.fillStyle = coul; ctx.lineWidth = larg || 2;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2 - h * 0.7 * Math.cos(a), y2 - h * 0.7 * Math.sin(a)); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x2, y2); ctx.lineTo(x2 - h * Math.cos(a - 0.38), y2 - h * Math.sin(a - 0.38));
  ctx.lineTo(x2 - h * Math.cos(a + 0.38), y2 - h * Math.sin(a + 0.38)); ctx.closePath(); ctx.fill();
  if (texte) { ctx.font = "italic bold 14px 'Times New Roman', serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(texte, x2 + 13 * Math.cos(a), y2 + 13 * Math.sin(a)); }
  ctx.restore();
}
function texte3(ctx, P, t, coul, dx, dy, police) {
  const [x, y] = proj(P); ctx.save(); ctx.fillStyle = coul; ctx.font = police || "italic 15px 'Times New Roman', serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(t, x + (dx || 0), y + (dy || 0)); ctx.restore();
}
function signe(ctx, P, coul) {
  const [x, y] = proj(P); ctx.save(); ctx.strokeStyle = coul; ctx.lineWidth = 1.8;
  ctx.beginPath(); ctx.moveTo(x - 4, y); ctx.lineTo(x + 4, y); ctx.moveTo(x, y - 4); ctx.lineTo(x, y + 4); ctx.stroke(); ctx.restore();
}
function cercle3(ctx, C, R, coul, larg, n) {
  const pts = []; for (let i = 0; i <= (n || 60); i++) { const t = 2 * Math.PI * i / (n || 60); pts.push(add(C, [R * Math.cos(t), R * Math.sin(t), 0])); }
  ctx.save(); ctx.strokeStyle = coul; ctx.lineWidth = larg || 2; ctx.beginPath();
  pts.forEach((P, i) => { const [x, y] = proj(P); if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y); }); ctx.stroke(); ctx.restore();
}
/** Plan passant par M, de normale n, dessiné comme un carré translucide de demi-côté h. */
function plan(ctx, M, n, coul, h, alpha) {
  const t = Math.abs(n[2]) < 0.9 ? [0, 0, 1] : [1, 0, 0];
  const u = [n[1] * t[2] - n[2] * t[1], n[2] * t[0] - n[0] * t[2], n[0] * t[1] - n[1] * t[0]];
  const w = [n[1] * u[2] - n[2] * u[1], n[2] * u[0] - n[0] * u[2], n[0] * u[1] - n[1] * u[0]];
  const c = [[1, 1], [1, -1], [-1, -1], [-1, 1]].map(([a, b]) => proj(add(M, add(mul(u, a * h), mul(w, b * h)))));
  ctx.save(); ctx.globalAlpha = alpha; ctx.fillStyle = coul; ctx.strokeStyle = coul; ctx.lineWidth = 1.5;
  ctx.beginPath(); c.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); ctx.closePath(); ctx.fill();
  ctx.globalAlpha = Math.min(1, alpha * 3); ctx.stroke(); ctx.restore();
}

/** Distribution, avec un décalage s (translation) et un angle a (rotation) pour montrer l'invariance. */
function distribution(ctx, s, a) {
  const f = p.champ, cd = COUL.dist;
  if (p.cas === "fil") {
    seg(ctx, [0, 0, -2.1], [0, 0, 2.1], cd, 4);
    for (let k = -5; k <= 5; k++) {
      const z = ((k * 0.4 + s) % 4 + 6) % 4 - 2;
      if (f === "B") fleche(ctx, [0, 0, z], [0, 0, 0.3], cd, 2); else signe(ctx, [0.12 * Math.cos(a + k), 0.12 * Math.sin(a + k), z], cd);
    }
    texte3(ctx, [0, 0, 2.25], f === "B" ? "I" : "λ", cd, 12, 0);
  } else if (p.cas === "spire") {
    cercle3(ctx, [0, 0, 0], 1.2, cd, 3);
    for (let k = 0; k < 8; k++) {
      const t = a + k * Math.PI / 4, P = [1.2 * Math.cos(t), 1.2 * Math.sin(t), 0];
      if (f === "B") fleche(ctx, P, [-0.3 * Math.sin(t), 0.3 * Math.cos(t), 0], cd, 2); else signe(ctx, P, cd);
    }
    texte3(ctx, [1.35, 0, 0], f === "B" ? "I" : "λ", cd, 10, 8);
  } else if (p.cas === "plan") {
    const h = 2.2;
    plan(ctx, [0, 0, 0], [0, 0, 1], "#f3c48b", h, 0.25);
    for (let i = -2; i <= 2; i++) for (let j = -2; j <= 2; j++) {
      const x = ((i * 0.85 + s) % 4.25 + 6.375) % 4.25 - 2.125, y = ((j * 0.85 + 0.6 * s) % 4.25 + 6.375) % 4.25 - 2.125;
      if (f === "B") fleche(ctx, [x - 0.15, y, 0], [0.3, 0, 0], cd, 1.8); else signe(ctx, [x, y, 0], cd);
    }
  } else if (p.cas === "solenoide") {
    for (let k = -5; k <= 4; k++) {
      const z = ((k * 0.4 + s) % 4 + 6) % 4 - 2;
      cercle3(ctx, [0, 0, z], 1, cd, 1.6, 40);
      const t = a + k, P = [Math.cos(t), Math.sin(t), z];
      fleche(ctx, P, [-0.25 * Math.sin(t), 0.25 * Math.cos(t), 0], cd, 1.6);
    }
    seg(ctx, [0, 0, -2.3], [0, 0, 2.3], "#bbb", 1, [4, 4]);
  }
}

function dessiner() {
  const ctx = cv.ctx; cv.effacer("#fff");
  const c = CAS[p.cas], e = p.etape, t = Math.min(1, p.tau), M = c.M;
  // axes
  for (const [u, n] of [[[1, 0, 0], "x"], [[0, 1, 0], "y"], [[0, 0, 1], "z"]]) {
    fleche(ctx, [0, 0, 0], mul(u, 2.4), "#bbb", 1.2); texte3(ctx, mul(u, 2.6), n, "#999");
  }
  // invariance: translation ou rotation de la distribution
  let s = 0, a = 0;
  if (e === 1) {
    const m = c.inv.mouv, ph = p.temps * 0.8;
    if (m.indexOf("translation") >= 0) s = (ph % 2) * 0.5;
    if (m.indexOf("rotation") >= 0) a = ph * 0.6;
  }
  distribution(ctx, s, a);
  // plans
  const pl = c.plans[p.champ];
  for (let i = 0; i < 2; i++) {
    if (e < 2 + i) continue;
    const al = (e === 2 + i ? t : 1) * 0.22;
    plan(ctx, M, pl[i][1], pl[i][0] === "sym" ? COUL.sym : COUL.anti, 1.4, al);
  }
  // point M et base locale
  const [xm, ym] = proj(M);
  ctx.fillStyle = COUL.M; ctx.beginPath(); ctx.arc(xm, ym, 4, 0, 2 * Math.PI); ctx.fill();
  texte3(ctx, M, "M", COUL.M, -12, 12);
  if (e <= 1) c.base.forEach(([n, u]) => fleche(ctx, M, mul(u, 0.55), "#666", 1.5, n.replace("_", "")));
  // champ
  if (e === 4) {
    if (p.cas === "fil" && p.champ === "B") cercle3(ctx, [0, 0, 0], M[0], COUL.champ, 1.2, 80);   // ligne de champ
    fleche(ctx, M, mul(c.dir[p.champ], 0.95 * t), COUL.champ, 3.5, p.champ);
  }
  if (e === 2 || e === 3) {
    // direction autorisée après ce plan
    const [type, n] = pl[e - 2], vrai = p.champ === "E";
    const perp = (vrai && type === "anti") || (!vrai && type === "sym");
    if (perp) { seg(ctx, add(M, mul(n, -0.8)), add(M, mul(n, 0.8)), COUL.champ, 2, [6, 4], t);
      texte3(ctx, add(M, mul(n, 0.95)), p.champ + " ⊥ plan", COUL.champ, 0, 0, "bold 13px system-ui"); }
    else texte3(ctx, add(M, [0, 0, -0.55]), p.champ + " dans le plan", COUL.champ, 0, 0, "bold 13px system-ui");
  }
  ctx.save(); ctx.fillStyle = "#333"; ctx.font = "bold 14px system-ui"; ctx.fillText(c.nom + " — champ " + p.champ, 12, 20); ctx.restore();
}

// ---------------------------------------------------------------- souris
let prise = null;
cv.cv.addEventListener("pointerdown", (ev) => { prise = [ev.clientX, ev.clientY, p.az, p.el]; cv.cv.setPointerCapture(ev.pointerId); });
cv.cv.addEventListener("pointermove", (ev) => {
  if (!prise) return;
  p.az = prise[2] - (ev.clientX - prise[0]) * 0.01;
  p.el = Math.max(-0.2, Math.min(1.4, prise[3] + (ev.clientY - prise[1]) * 0.01));
});
cv.cv.addEventListener("pointerup", () => { prise = null; });
cv.cv.style.cursor = "grab";

// ---------------------------------------------------------------- boucle
majBoutons();
// ---- enchaînement automatique de toutes les étapes (durée de chaque étape: temps de lecture de l'explication)
const ench = { on: false, t: 0, der: null };
const bEnch = bouton(bt, "▶ Tout enchaîner", () => {
  ench.on = !ench.on;
  if (ench.on) aller(p.etape === ETAPES.length - 1 ? 0 : p.etape);
  ench.t = 0; majEnch();
});
const barreEnch = el("div", { style: "height:4px;background:#e3e8ef;border-radius:2px;margin-top:6px;display:none" }, sEt);
const jaugeEnch = el("div", { style: "height:4px;width:0;background:#3d6fb3;border-radius:2px" }, barreEnch);
function majEnch() { bEnch.innerHTML = ench.on ? "■ Arrêter" : "▶ Tout enchaîner"; barreEnch.style.display = ench.on ? "" : "none"; }
function dureeEnch() { const n = (explication.innerText || "").split(/\s+/).length; return 5 + n / 4; }
{ const allerInitial = aller; aller = (k) => { ench.t = 0; allerInitial(k); }; }
function tickEnch(ts) {
  const dt = ench.der === null ? 0 : Math.min(0.1, (ts - ench.der) / 1000); ench.der = ts;
  if (ench.on) {
    ench.t += dt; const D = dureeEnch(); jaugeEnch.style.width = Math.min(100, 100 * ench.t / D) + "%";
    if (ench.t >= D) { if (p.etape < ETAPES.length - 1) aller(p.etape + 1); else { ench.on = false; majEnch(); } }
  }
  requestAnimationFrame(tickEnch);
}
requestAnimationFrame(tickEnch);

boucle((dt) => { p.tau += dt / 1.2; p.temps += dt; dessiner(); });

</script>
